# Apache version of nginx-wos.conf. Put inside your site's <VirtualHost *:443>.
# Needs:  sudo a2enmod proxy proxy_http headers && sudo systemctl reload apache2
ProxyPreserveHost On
ProxyPass        /public/ http://127.0.0.1:8080/public/
ProxyPassReverse /public/ http://127.0.0.1:8080/public/
ProxyPass        /api/    http://127.0.0.1:8080/api/
ProxyPassReverse /api/    http://127.0.0.1:8080/api/
RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
RequestHeader unset CF-Connecting-IP
LimitRequestBody 27262976
