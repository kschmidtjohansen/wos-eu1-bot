# Add these lines INSIDE the existing  server { ... }  block of your site (the one with your domain).
# They forward the bot's addresses to the bot, so the website, the report form and the dashboard
# all talk to the same address and no extra setup (CORS, tunnels) is needed.

# --- public pages (report form, known issues, changelog) ---
location /public/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header X-Real-IP $remote_addr;          # the bot uses this for rate limits / spam pauses
    proxy_set_header CF-Connecting-IP "";             # never trust a header the visitor could fake
    client_max_body_size 26m;                         # report form uploads (4 files x 8 MB)
    proxy_read_timeout 60s;
}

# --- dashboard API (protected by your DASHBOARD_API_KEY) ---
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    client_max_body_size 5m;
}

