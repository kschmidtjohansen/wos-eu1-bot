<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WOS EU1 – Staff</title>
<meta name="theme-color" content="#060c17">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="EU1 Staff">

<!-- STANDALONE ONLY: delete this block when you paste the page into your site's own template -->
<style>
  body{margin:0;background:#060c17;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
</style>
<!-- /STANDALONE ONLY -->

<style>
/* ===========================================================================
   WOS EU1 manager – every rule is scoped to .wosd, so it won't touch the host
   site. To match your site, override the --w-* variables below (see README).
   =========================================================================== */
.wosd{
  --w-surface:#ffffff; --w-surface-2:#f5f6fa; --w-text:#1a1e2b; --w-muted:#667085; --w-border:#e3e6ee;
  --w-accent:#4f46e5; --w-accent-fg:#ffffff; --w-accent-soft:#eceeff;
  --w-ok:#15803d; --w-warn:#b45309; --w-bad:#dc2626; --w-ok-soft:#e7f6ec; --w-warn-soft:#fdf2dc; --w-bad-soft:#fde8e8;
  --w-radius:14px; --w-shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.05);
  color:var(--w-text); font-size:15px; line-height:1.5; max-width:1120px; margin:0 auto; padding:20px 16px 56px;
}
@media (prefers-color-scheme:dark){
  .wosd[data-theme="auto"]{
    --w-surface:#171b25; --w-surface-2:#1e2330; --w-text:#e8eaf1; --w-muted:#9aa3b5; --w-border:#2b3142;
    --w-accent:#8b93ff; --w-accent-fg:#10131c; --w-accent-soft:#252b45;
    --w-ok:#4ade80; --w-warn:#fbbf24; --w-bad:#f87171; --w-ok-soft:#16301f; --w-warn-soft:#3a2d12; --w-bad-soft:#3a1c1f;
    --w-shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
/* "wos" = matches the WOS Europa site (dark navy, soft blue accents). It is the default theme. */
.wosd[data-theme="wos"]{
  --w-surface:#121b2b; --w-surface-2:#192639; --w-text:#eef3fb; --w-muted:#9fb0c8; --w-border:#2a3b55;
  --w-accent:#4f86d6; --w-accent-fg:#ffffff; --w-accent-soft:#1d3453;
  --w-ok:#4fd1a1; --w-warn:#f4b73a; --w-bad:#ff7b7b; --w-ok-soft:#133a33; --w-warn-soft:#3b3012; --w-bad-soft:#3d1c24;
  --w-radius:20px; --w-shadow:0 8px 30px rgba(0,0,0,.28);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
.wosd[data-theme="wos"] .w-logo,.wosd[data-theme="wos"] .w-btn.primary{background:linear-gradient(180deg,#5b93e6,#3f6fb8)}
.wosd[data-theme="wos"] .w-btn{border-radius:14px}
.wosd[data-theme="wos"] .w-input,.wosd[data-theme="wos"] .w-select,.wosd[data-theme="wos"] .w-textarea{background:#0c1422;border-radius:14px}
.wosd[data-theme="wos"] .w-pagehead h2{font-size:26px;letter-spacing:-.02em}
.wosd[data-theme="wos"] .w-group-title{color:#7fb4f0;letter-spacing:.14em}
.wosd[data-theme="wos"] .w-savebar{background:#eef3fb;color:#0c1422}
.wosd[data-theme="wos"] .w-toast{background:#eef3fb;color:#0c1422}
.wosd[data-theme="dark"]{
  --w-surface:#171b25; --w-surface-2:#1e2330; --w-text:#e8eaf1; --w-muted:#9aa3b5; --w-border:#2b3142;
  --w-accent:#8b93ff; --w-accent-fg:#10131c; --w-accent-soft:#252b45;
  --w-ok:#4ade80; --w-warn:#fbbf24; --w-bad:#f87171; --w-ok-soft:#16301f; --w-warn-soft:#3a2d12; --w-bad-soft:#3a1c1f;
  --w-shadow:0 1px 2px rgba(0,0,0,.4);
}

.wosd, .wosd *{box-sizing:border-box}
.wosd h1,.wosd h2,.wosd h3,.wosd p{margin:0}
.wosd button,.wosd input,.wosd select,.wosd textarea{font:inherit;color:inherit}
.wosd :focus-visible{outline:2px solid var(--w-accent);outline-offset:2px}
.wosd [hidden]{display:none !important}
.wosd .w-ic{width:18px;height:18px;flex:none}

/* ---- surfaces & layout ---- */
.w-card{background:var(--w-surface);border:1px solid var(--w-border);border-radius:var(--w-radius);box-shadow:var(--w-shadow)}
.w-pad{padding:20px}
.w-head{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:16px;flex-wrap:wrap}
.w-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--w-surface-2);flex:none}
.w-title{font-weight:650;font-size:17px;line-height:1.25}
.w-sub{color:var(--w-muted);font-size:13px}
.w-spacer{flex:1}
.w-layout{display:grid;grid-template-columns:224px minmax(0,1fr);gap:16px;align-items:start}
.w-nav{padding:8px;position:sticky;top:12px;display:flex;flex-direction:column;gap:2px}
.w-nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;color:var(--w-muted);font-weight:550}
.w-nav button:hover{background:var(--w-surface-2);color:var(--w-text)}
.w-nav button[aria-selected="true"]{background:var(--w-accent-soft);color:var(--w-accent)}
.w-main{min-width:0;display:grid;gap:16px}
.w-main > *{min-width:0}
.wosd a.w-btn{color:inherit}
.w-pagehead h2{font-size:21px;line-height:1.3;margin-bottom:2px}
.w-pagehead p{color:var(--w-muted)}
.w-grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.w-h3{font-size:15.5px;font-weight:650;margin-bottom:2px}
@media (max-width:860px){
  .w-layout{grid-template-columns:1fr}
  .w-nav{position:static;flex-direction:row;overflow-x:auto;padding:6px}
  .w-nav button{white-space:nowrap}
  .w-grid2{grid-template-columns:1fr}
}

/* ---- controls ---- */
.w-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--w-border);background:var(--w-surface);cursor:pointer;font-weight:600;line-height:1.2;text-decoration:none}
.w-btn:hover{background:var(--w-surface-2)}
.w-btn.primary{background:var(--w-accent);color:var(--w-accent-fg);border-color:transparent}
.w-btn.primary:hover{filter:brightness(1.07)}
.w-btn.small{padding:6px 12px;font-size:13.5px}
.w-btn:disabled{opacity:.55;cursor:default;filter:none}
.w-field{display:grid;gap:6px;margin-bottom:16px}
.w-field:last-child{margin-bottom:0}
.w-label{font-weight:600;font-size:13.5px}
.w-hint{font-size:12.5px;color:var(--w-muted)}
.w-input,.w-select,.w-textarea{width:100%;padding:9px 12px;border:1px solid var(--w-border);border-radius:10px;background:var(--w-surface);color:var(--w-text)}
.w-textarea{min-height:170px;resize:vertical;line-height:1.5}
.w-input:hover,.w-select:hover,.w-textarea:hover{border-color:color-mix(in srgb,var(--w-muted) 50%,var(--w-border))}
.w-num{width:110px;text-align:right}
.w-counter{font-size:12px;color:var(--w-muted);text-align:right}
.w-switch{position:relative;display:inline-block;width:44px;height:26px;flex:none}
.w-switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.w-switch span{position:absolute;inset:0;border-radius:999px;background:color-mix(in srgb,var(--w-muted) 35%,var(--w-border));transition:background .15s}
.w-switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.w-switch input:checked + span{background:var(--w-accent)}
.w-switch input:checked + span::after{transform:translateX(18px)}
.w-switch input:focus-visible + span{outline:2px solid var(--w-accent);outline-offset:2px}

/* ---- setting rows ---- */
.w-group-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--w-muted);margin-bottom:4px}
.w-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0;border-top:1px solid var(--w-border)}
.w-group-title + .w-row,.w-pad > .w-row:first-child{border-top:0}
.w-row > div:first-child{min-width:0}
.w-row-label{font-weight:600}
.w-row-desc{font-size:13px;color:var(--w-muted)}
.w-row.chan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:8px 24px;align-items:center}
.w-row.chan .full{grid-column:1/-1}
@media (max-width:700px){.w-row.chan{grid-template-columns:1fr}}

/* ---- badges & status ---- */
.w-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--w-surface-2);border:1px solid var(--w-border);color:var(--w-muted);white-space:nowrap}
.w-dot{width:8px;height:8px;border-radius:50%;background:var(--w-ok);flex:none}
.w-demo{background:var(--w-warn-soft);color:var(--w-warn);border-color:transparent}
.w-rmrows{display:grid;gap:8px;margin:8px 0 6px}
.w-rmrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 84px minmax(0,1.4fr) auto;gap:8px;align-items:center}
@media (max-width:860px){.w-rmrow{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--w-border);border-radius:12px}.w-rmrow .rm-d{grid-column:1/-1}}
.w-stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.w-emojis{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.w-emojis .w-stk img{width:56px;height:56px}
.w-stk{margin:0;padding:10px 6px 8px;border-radius:14px;border:1px solid var(--w-border);background:var(--w-surface-2);text-align:center;opacity:.6}
.w-stk.on{opacity:1;border-color:color-mix(in srgb,var(--w-ok) 40%,var(--w-border))}
.w-stk img{width:84px;height:84px;display:block;margin:0 auto 4px;object-fit:contain}
.w-stk figcaption{font-size:12px;color:var(--w-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-reason .w-chips{margin:6px 0 8px}
.w-reason .w-textarea{min-height:70px}
.w-changes{margin:10px 0;padding:12px;border:1px dashed var(--w-border);border-radius:12px}
.w-changes.done{border-style:solid;border-color:color-mix(in srgb,#9b59b6 45%,var(--w-border));background:color-mix(in srgb,#9b59b6 7%,transparent)}
.w-changes .w-textarea{min-height:70px;margin-top:6px}
.w-badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px}
.w-badge.ok{background:var(--w-ok-soft);color:var(--w-ok)}
.w-badge.warn{background:var(--w-warn-soft);color:var(--w-warn)}
.w-badge.bad{background:var(--w-bad-soft);color:var(--w-bad)}
.w-badge.todo{background:var(--w-surface-2);color:var(--w-muted)}

/* ---- overview ---- */
.w-banner{display:flex;align-items:center;gap:12px;padding:14px 18px}
.w-banner.ok{background:var(--w-ok-soft);border-color:transparent}
.w-banner.warn{background:var(--w-warn-soft);border-color:transparent}
.w-banner .w-ic{width:22px;height:22px}
.w-banner.ok .w-ic{color:var(--w-ok)} .w-banner.warn .w-ic{color:var(--w-warn)}
.w-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.w-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.w-tile{padding:14px 16px}
.w-tile b{display:block;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.w-tile span{font-size:13px;color:var(--w-muted)}
.w-check{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--w-border)}
.w-sec-head + .w-check{border-top:0}
.w-check-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.w-check-ic .w-ic{width:16px;height:16px}
.w-check-ic.ok{background:var(--w-ok-soft);color:var(--w-ok)}
.w-check-ic.warn{background:var(--w-warn-soft);color:var(--w-warn)}
.w-check-ic.bad{background:var(--w-bad-soft);color:var(--w-bad)}
.w-check-ic.todo{background:var(--w-surface-2);color:var(--w-muted)}
.w-check > div:nth-child(2){flex:1;min-width:0}
.w-check-label{font-weight:600}
.w-check-detail{font-size:13px;color:var(--w-muted);overflow-wrap:anywhere}
.w-sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}

/* ---- discord-style preview (always dark, like Discord) ---- */
.w-dp{background:#313338;border-radius:10px;padding:14px;color:#dbdee1;font-family:"gg sans","Noto Sans","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.4}
.w-dp-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.w-dp-head img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.w-dp-name{font-weight:600;color:#fff}
.w-dp-tag{background:#5865f2;color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:6px}
.w-dp-embed{margin-left:46px;background:#2b2d31;border-left:4px solid #5865f2;border-radius:4px;padding:10px 14px 12px;max-width:460px}
.w-dp-title{font-weight:700;color:#fff;margin-bottom:6px;overflow-wrap:anywhere}
.w-dp-desc{overflow-wrap:anywhere}
.w-dp-desc code{background:#1e1f22;padding:1px 4px;border-radius:3px;font-size:12.5px}
.w-dp-foot{font-size:12px;color:#b5bac1;margin-top:10px}
.w-dp-reacts{margin:8px 0 0 46px;display:flex;gap:6px}
.w-dp-reacts span{background:#2b2d31;border:1px solid #3f4147;border-radius:8px;padding:2px 9px;font-size:13px}
.w-dp-reacts .w-dp-btn{background:#4e5058;border:0;border-radius:4px;padding:6px 14px;font-size:14px;font-weight:500;color:#fff}
.w-dp-reacts .w-dp-btn.pri{background:#5865f2}
@media (max-width:520px){.w-dp-embed,.w-dp-reacts{margin-left:0}}
.w-live{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--w-muted)}

/* ---- bot profile ---- */
.w-avrow{display:flex;align-items:center;gap:18px;margin-bottom:20px;flex-wrap:wrap}
.w-bprev{position:relative;margin-bottom:58px}
.w-bannerbox{height:150px;border-radius:16px;background:linear-gradient(180deg,#d8753a,#f4c07c);background-size:cover;background-position:center;border:1px solid var(--w-border)}
.w-avover{position:absolute;left:22px;bottom:-48px;border:6px solid var(--w-surface)}
.w-servart{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:14px;background:var(--w-accent-soft);margin-bottom:20px}
.w-avbig{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--w-surface-2);border:1px solid var(--w-border)}

/* ---- log ---- */
.w-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.w-chips{display:flex;gap:6px;flex-wrap:wrap}
.w-chip{padding:5px 12px;border-radius:999px;border:1px solid var(--w-border);background:var(--w-surface);cursor:pointer;font-size:13px;font-weight:600;color:var(--w-muted)}
.w-chip:hover{background:var(--w-surface-2)}
.w-chip[aria-pressed="true"]{background:var(--w-accent-soft);color:var(--w-accent);border-color:transparent}
.w-search{flex:1;min-width:180px;max-width:300px}
.w-autor{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--w-muted)}
.w-logrow{display:grid;grid-template-columns:92px 104px minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--w-border);align-items:start}
.w-logrow:first-child,.w-sec-head + .w-logrow{border-top:0}
.w-logrow time{font-size:13px;color:var(--w-muted);padding-top:2px;white-space:nowrap}
.w-kind{justify-self:start;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--k,#64748b);background:rgba(120,120,160,.14);background:color-mix(in srgb,var(--k,#64748b) 15%,transparent)}
.w-logtext{overflow-wrap:anywhere}
.w-empty{text-align:center;color:var(--w-muted);padding:36px 12px}
@media (max-width:620px){.w-logrow{grid-template-columns:auto 1fr;gap:4px 10px}.w-logtext{grid-column:1/-1}}

/* ---- save bar, toasts, login ---- */
.w-savebar{position:sticky;bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--w-text);color:var(--w-surface);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.w-savebar span{flex:1;min-width:160px;font-weight:600}
.w-savebar .w-btn{border-color:transparent}
.w-savebar .w-btn:not(.primary){background:transparent;color:inherit;border:1px solid color-mix(in srgb,currentColor 45%,transparent)}
.w-savebar .w-btn:not(.primary):hover{background:color-mix(in srgb,currentColor 14%,transparent)}
.w-toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:99999;max-width:min(380px,calc(100vw - 32px))}
.w-toast{padding:11px 14px;border-radius:12px;background:var(--w-text);color:var(--w-surface);box-shadow:0 6px 24px rgba(0,0,0,.3);font-size:14px;animation:w-in .18s ease-out}
.w-toast.err{background:#b42318;color:#fff}
.w-toast.warn{background:#b45309;color:#fff}
@keyframes w-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.w-login{max-width:440px;margin:6vh auto 0;padding:28px}
.w-login h1{font-size:22px;margin:14px 0 4px}
.w-login p{color:var(--w-muted);margin-bottom:20px}
.w-error{background:var(--w-bad-soft);color:var(--w-bad);padding:10px 12px;border-radius:10px;margin-bottom:16px;font-size:14px}
.w-logo{width:44px;height:44px;border-radius:12px;background:var(--w-accent);color:var(--w-accent-fg);display:grid;place-items:center;font-weight:800;letter-spacing:-.02em}
.w-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.w-tiles4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:620px){.w-tiles4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.w-tile.ok b{color:var(--w-ok)} .w-tile.warn b{color:var(--w-warn)} .w-tile.bad b{color:var(--w-bad)}
.w-tilegroup{display:grid;gap:8px}
.w-tilegroup > .w-group-title{margin:0}
.w-dp-msg{margin-left:46px;overflow-wrap:anywhere}
@media (max-width:520px){.w-dp-msg{margin-left:0}}
.w-mention{background:rgba(88,101,242,.3);color:#c9cdfb;border-radius:3px;padding:0 3px;font-weight:500}
.w-phrow{display:flex;gap:6px;flex-wrap:wrap}
.w-phrow .w-chip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}

/* ---- bugs, insights, moderation ---- */
.w-badge.info{background:var(--w-accent-soft);color:var(--w-accent)}
.w-fsel{width:auto;min-width:0;padding:7px 10px;font-size:13.5px}
.w-files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.w-file{width:84px;height:64px;padding:0;border:1px solid var(--w-border);border-radius:10px;background:var(--w-surface-2);overflow:hidden;cursor:pointer;display:grid;place-items:center;color:var(--w-muted)}
.w-file img{width:100%;height:100%;object-fit:cover;display:block}
.w-linkbtn{border:0;background:none;padding:0;color:var(--w-accent);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.w-linkbtn:hover{text-decoration:underline}
.w-bugrow{display:grid;grid-template-columns:54px minmax(0,1fr) 148px 84px;gap:12px;align-items:center;width:100%;padding:11px 8px;border:0;border-top:1px solid var(--w-border);background:none;text-align:left;cursor:pointer;border-radius:8px}
.w-bugrow:first-child{border-top:0}
.w-bugrow:hover{background:var(--w-surface-2)}
.w-bugrow b{font-variant-numeric:tabular-nums;color:var(--w-muted)}
.w-bugsum{font-weight:600;overflow-wrap:anywhere}

.w-pipe .w-pipebar{display:flex;gap:3px;height:10px;border-radius:99px;overflow:hidden;margin:4px 0 12px}
.w-pipebar i{display:block;min-width:4px}
.p-new{background:#7de3f4}.p-adm{background:#a08cff}.p-inv{background:#ffc15e}.p-ok{background:#5be0a8}.p-bad{background:#6b7790}
.w-pipeparts{display:flex;flex-wrap:wrap;gap:6px}
.w-pipeparts button{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;border:1px solid var(--w-border);background:var(--w-surface-2);color:var(--w-text);font:inherit;cursor:pointer}
.w-pipeparts button:hover{border-color:var(--w-border-strong)}
.w-pipeparts b{font-size:17px}
.w-pipeparts span{color:var(--w-muted);font-size:13px}
.w-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.w-mysum{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:0 0 10px;font-size:13.5px;color:var(--w-muted)}
.w-mysum b{color:var(--w-text)}
.w-mychip{display:inline-flex;align-items:center;gap:6px}
.w-steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.w-steps code{font-size:12.5px;background:var(--w-surface-2);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
.w-selbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;margin-bottom:10px;border-radius:14px;background:var(--w-bad-soft);border:1px solid color-mix(in srgb,var(--w-bad) 35%,transparent)}
.w-bugrow.sel[aria-pressed="true"]{border-color:var(--w-bad);background:var(--w-bad-soft)}
.w-form2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:620px){.w-form2{grid-template-columns:1fr}}

/* ====================== design v3 – "Frostline" ======================
   The furnace control room of a frozen city: permafrost blues and frosted glass everywhere,
   ice-cyan for selection and focus, and furnace orange only where something needs a person. */
.wosd[data-theme="wos"]{
  --w-bg:#060c17; --w-surface:rgba(16,27,45,.74); --w-surface-solid:#0f1a2c; --w-surface-2:rgba(130,170,230,.06);
  --w-text:#e8f0fa; --w-muted:#8a9dba; --w-border:rgba(160,200,255,.11); --w-border-strong:rgba(160,200,255,.2);
  --w-accent:#7de3f4; --w-accent-fg:#06202a; --w-accent-soft:rgba(125,227,244,.11);
  --w-heat:#ff8a3d; --w-heat-2:#ffc15e; --w-heat-soft:rgba(255,138,61,.13);
  --w-ok:#5be0a8; --w-warn:#ffc15e; --w-bad:#ff6b81; --w-ok-soft:rgba(91,224,168,.12); --w-warn-soft:rgba(255,193,94,.12); --w-bad-soft:rgba(255,107,129,.12);
  --w-radius:18px; --w-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -24px rgba(0,0,0,.8);
  --w-display:'WOS Unbounded','WOS Figtree',system-ui,sans-serif;
  font-family:'WOS Figtree',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:15px;
}
.wosd{--w-display:inherit;--w-heat:var(--w-accent);--w-heat-2:var(--w-accent);--w-heat-soft:var(--w-accent-soft);--w-border-strong:var(--w-border);--w-surface-solid:var(--w-surface)}
.wosd[data-theme="wos"]{--w-heat:#ff8a3d;--w-heat-2:#ffc15e;--w-heat-soft:rgba(255,138,61,.13);--w-border-strong:rgba(160,200,255,.2);--w-surface-solid:#0f1a2c;--w-display:'WOS Unbounded','WOS Figtree',system-ui,sans-serif}
.wosd{max-width:1280px;padding:28px 22px 80px;position:relative;isolation:isolate}

/* the night sky: a faint dot field that fades out, with an aurora above the content */
.wosd[data-theme="wos"]::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(60% 45% at 78% -8%,rgba(125,227,244,.16),transparent 70%),
             radial-gradient(45% 35% at 12% -5%,rgba(139,124,246,.14),transparent 70%),var(--w-bg)}
.wosd[data-theme="wos"]::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(rgba(190,220,255,.13) 1px,transparent 1.2px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 85%);mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 85%)}

/* ---- layout ---- */
.w-layout{grid-template-columns:252px minmax(0,1fr);gap:28px}
.w-layout > *{min-width:0}
.w-main{gap:18px}

/* ---- frosted surfaces with a spotlight that follows the pointer (magic card) ---- */
.wosd[data-theme="wos"] .w-card{position:relative;background:var(--w-surface);border:1px solid var(--w-border);
  -webkit-backdrop-filter:blur(14px) saturate(130%);backdrop-filter:blur(14px) saturate(130%);box-shadow:var(--w-shadow)}
.wosd[data-theme="wos"] .w-card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(125,227,244,.09),transparent 45%);z-index:0}
.wosd[data-theme="wos"] .w-card.lit::before{opacity:1}
.wosd[data-theme="wos"] .w-card > :not(.w-beam){position:relative;z-index:1}
.w-card{transition:border-color .2s}
.w-pad{padding:24px}

/* ---- sidebar ---- */
.w-side{position:sticky;top:20px;padding:18px 10px 12px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 40px);overflow:auto;scrollbar-width:thin}
.wosd[data-theme="wos"] .w-side{background:linear-gradient(180deg,rgba(18,31,52,.85),rgba(10,18,32,.8))}
.w-brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.w-brand .w-avatar{width:42px;height:42px;border-radius:13px;box-shadow:0 0 0 1px var(--w-border-strong),0 8px 22px -8px var(--w-heat)}
.w-brand .w-title{font-family:var(--w-display);font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.w-brand-t{min-width:0}.w-brand-t .w-title,.w-brand-t .w-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-status{display:flex;gap:6px;flex-wrap:wrap;padding:0 8px}
.w-dot{box-shadow:0 0 0 3px var(--w-ok-soft);animation:w-pulse 2.4s ease-in-out infinite}
@keyframes w-pulse{50%{box-shadow:0 0 0 6px transparent}}
.w-nav{position:static;padding:0;border:0;background:none;box-shadow:none;gap:1px;flex:1;display:flex;flex-direction:column}
.w-navgroup{font-size:12px;font-weight:600;color:var(--w-muted);opacity:.75;padding:14px 12px 4px}
.w-navgroup:first-child{padding-top:0}
.w-nav button{position:relative;display:flex;align-items:center;gap:11px;padding:8px 12px;border:0;background:none;border-radius:11px;cursor:pointer;text-align:left;color:var(--w-muted);font-weight:550;font-size:14.5px;transition:background .15s,color .15s}
.w-nav button span{flex:1}
.w-nav button:hover{background:var(--w-surface-2);color:var(--w-text)}
.w-nav .w-ic{width:17px;height:17px;opacity:.75}
.w-nav button[aria-selected="true"]{color:var(--w-text);background:linear-gradient(90deg,var(--w-accent-soft),transparent 90%)}
.w-nav button[aria-selected="true"] .w-ic{color:var(--w-accent);opacity:1}
.w-nav button[aria-selected="true"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--w-accent);box-shadow:0 0 12px var(--w-accent)}
.w-count{font-style:normal;font-size:11.5px;font-weight:700;min-width:22px;text-align:center;padding:1px 7px;border-radius:999px;background:linear-gradient(135deg,var(--w-heat),var(--w-heat-2));color:#2a1204}
.w-me{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:0 2px;border-radius:12px;background:var(--w-surface-2);border:1px solid var(--w-border)}
.w-sidefoot{display:flex;gap:8px;padding:12px 6px 0;border-top:1px solid var(--w-border)}
.w-sidefoot .w-btn{flex:1;padding:8px 6px}

/* ---- type ---- */
.w-pagehead{padding:6px 2px 4px}
.w-pagehead h2{font-family:var(--w-display);font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.025em}
.w-pagehead p{margin-top:8px;max-width:68ch;color:var(--w-muted);line-height:1.55}
.w-h3{font-size:17px;font-weight:700;letter-spacing:-.005em}
.w-group-title{text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:650;color:var(--w-muted);margin-bottom:10px;display:flex;align-items:center;gap:12px}
.wosd[data-theme="wos"] .w-group-title{color:var(--w-muted);letter-spacing:0}
.w-group-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--w-border-strong),transparent)}
.w-table th{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:650}
.w-label{font-weight:650}

/* ---- controls ---- */
.w-btn{border-radius:12px;border:1px solid var(--w-border-strong);background:var(--w-surface-2);transition:background .15s,border-color .15s,transform .06s,box-shadow .2s}
.w-btn:hover{background:rgba(160,200,255,.1);border-color:rgba(160,200,255,.3)}
.w-btn:active{transform:translateY(1px)}
/* furnace buttons: the only warm thing besides "needs you" – with a shimmer on hover */
.wosd[data-theme="wos"] .w-btn.primary{position:relative;overflow:hidden;border:0;color:#2a1204;font-weight:700;
  background:linear-gradient(135deg,var(--w-heat),var(--w-heat-2));box-shadow:0 0 0 1px rgba(255,193,94,.4) inset,0 10px 26px -10px var(--w-heat)}
.wosd[data-theme="wos"] .w-btn.primary::after{content:"";position:absolute;inset:0;transform:translateX(-120%);
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%)}
.wosd[data-theme="wos"] .w-btn.primary:hover::after{transform:translateX(120%);transition:transform .7s ease}
.wosd[data-theme="wos"] .w-btn.primary:hover{filter:brightness(1.05);box-shadow:0 0 0 1px rgba(255,193,94,.55) inset,0 14px 32px -10px var(--w-heat)}
.w-btn.danger{color:var(--w-bad)}
.wosd[data-theme="wos"] .w-input,.wosd[data-theme="wos"] .w-select,.wosd[data-theme="wos"] .w-textarea{background:rgba(4,10,20,.55);border:1px solid var(--w-border-strong);border-radius:12px}
.w-input:focus,.w-select:focus,.w-textarea:focus{outline:none;border-color:var(--w-accent) !important;box-shadow:0 0 0 3px var(--w-accent-soft)}
.wosd :focus-visible{outline:2px solid var(--w-accent);outline-offset:2px}
.w-switch input:checked + span{background:var(--w-accent);box-shadow:0 0 14px -2px var(--w-accent)}
.w-chip{border-radius:999px;border:1px solid var(--w-border-strong);background:transparent;padding:6px 14px}
.w-chip:hover{background:var(--w-surface-2)}
.w-chip[aria-pressed="true"]{background:var(--w-accent-soft);color:var(--w-accent);border-color:rgba(125,227,244,.45)}
.w-badge{padding:3px 10px;font-size:12px;font-weight:650;border:1px solid transparent}
.w-badge.info{border-color:rgba(125,227,244,.25)}
.w-pill{font-size:12px;background:var(--w-surface-2);border-color:var(--w-border)}

/* ---- overview: bento ---- */
.w-bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.w-bento > .w-hero{grid-column:span 4}
.w-bento > .w-week{grid-column:span 2}
.w-hero{padding:24px 24px 18px;overflow:hidden}
.w-hero h3{font-family:var(--w-display);font-size:19px;font-weight:600;letter-spacing:-.015em;margin-bottom:4px}
.w-hero .w-sub{font-size:14px}
.w-todo{display:grid;gap:8px;margin-top:16px}
.w-todo button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--w-border);background:rgba(4,10,20,.35);cursor:pointer;color:inherit;transition:border-color .15s,background .15s}
.w-todo button:hover{border-color:rgba(255,138,61,.45);background:var(--w-heat-soft)}
.w-todo b{font-family:var(--w-display);font-size:22px;font-weight:600;min-width:2.2ch;font-variant-numeric:tabular-nums}
.w-todo button.hot b{color:var(--w-heat)}
.w-todo .w-ic{color:var(--w-muted)}
.w-allclear{display:flex;align-items:center;gap:14px;margin-top:16px;padding:16px;border-radius:14px;background:var(--w-ok-soft);border:1px solid rgba(91,224,168,.25)}
.w-allclear .w-ic{width:26px;height:26px;color:var(--w-ok)}
/* border beam: one furnace spark travelling round the card, only while something waits for staff */
.w-beam{position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;z-index:2 !important;
  background:conic-gradient(from var(--w-ang,0deg),transparent 0 75%,var(--w-heat) 86%,var(--w-heat-2) 92%,transparent 96%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:w-beam 5.5s linear infinite}
@property --w-ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes w-beam{to{--w-ang:360deg}}
.w-week{padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.w-wks{display:grid}
.w-week .w-big{font-family:var(--w-display);font-size:44px;line-height:1;font-weight:600;letter-spacing:-.03em}
.w-week .w-wk{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--w-border);font-size:14px}
.w-week .w-wk span{color:var(--w-muted)}
.w-week .w-wk b{font-variant-numeric:tabular-nums}
.w-tiles{gap:12px}
.w-tile{position:relative;padding:16px 18px;overflow:hidden}
.w-tile::after{display:none}
.w-tile b{font-family:var(--w-display);font-size:28px;font-weight:600;letter-spacing:-.025em;margin-top:8px;font-variant-numeric:tabular-nums;color:var(--w-text)}
.w-tile.ok b,.w-tile.warn b,.w-tile.bad b{color:var(--w-text)}
.w-tile span{display:block;margin-top:4px;font-size:13px;color:var(--w-muted)}
.w-tic{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--w-accent-soft);color:var(--w-accent);font-style:normal}
.w-tic .w-ic{width:17px;height:17px}
.w-tile.ok .w-tic{background:var(--w-ok-soft);color:var(--w-ok)}
.w-tile.warn .w-tic{background:var(--w-warn-soft);color:var(--w-warn)}
.w-tile.bad .w-tic{background:var(--w-bad-soft);color:var(--w-bad)}
.w-banner{border-radius:var(--w-radius);padding:16px 20px}
.w-banner.ok{background:linear-gradient(90deg,var(--w-ok-soft),transparent 70%);border:1px solid rgba(91,224,168,.22)}
.w-banner.warn{background:linear-gradient(90deg,var(--w-warn-soft),transparent 70%);border:1px solid rgba(255,193,94,.25)}

/* ---- lists ---- */
.w-row{padding:16px 0}
.w-row:hover .w-row-label{color:var(--w-accent)}
.w-check{padding:13px 0}
.w-bugrow{position:relative;padding:13px 14px 13px 18px;border:1px solid var(--w-border);border-radius:14px;margin-bottom:8px;background:rgba(4,10,20,.32);grid-template-columns:56px minmax(0,1fr) auto auto 84px;transition:border-color .15s,background .15s}
.w-bugrow:first-child{border-top:1px solid var(--w-border)}
.w-bugrow:hover{border-color:rgba(125,227,244,.35);background:rgba(125,227,244,.05)}
.w-bugrow::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--w-border-strong)}
.w-bugrow[data-sev="critical"]::before{background:var(--w-bad);box-shadow:0 0 10px var(--w-bad)}
.w-bugrow[data-sev="major"]::before{background:var(--w-heat)}
.w-bugrow[data-sev="minor"]::before{background:var(--w-warn)}
.w-bugrow > b{display:grid;place-items:center;height:30px;border-radius:9px;background:var(--w-surface-2);font-size:13px;color:var(--w-muted)}
.w-sugrow{background:rgba(4,10,20,.32);border-color:var(--w-border);border-radius:16px}
.w-coderow .w-code{background:rgba(4,10,20,.5);border:1px dashed var(--w-border-strong);letter-spacing:.06em}
.w-coderow.new .w-code{border:1px solid rgba(255,138,61,.55);color:var(--w-heat-2);box-shadow:0 0 18px -6px var(--w-heat)}
.w-table td{border-bottom-color:var(--w-border)}
.w-table tbody tr{transition:background .12s}
.w-table tbody tr:hover{background:var(--w-surface-2)}
.w-qbtn{border-radius:10px;background:var(--w-surface-2);border-color:var(--w-border-strong)}
.w-qbtn:hover{border-color:var(--w-accent);transform:none;background:var(--w-accent-soft)}

/* ---- overlays ---- */
.w-savebar{bottom:18px;border-radius:16px;padding:12px 16px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.wosd[data-theme="wos"] .w-savebar{background:rgba(232,240,250,.94);color:#081222;box-shadow:0 18px 50px -12px rgba(0,0,0,.7)}
.wosd[data-theme="wos"] .w-toast{background:rgba(232,240,250,.96);color:#081222;border-radius:14px}
.w-modal{background:rgba(3,7,14,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.wosd[data-theme="wos"] .w-modal-card{background:var(--w-surface-solid);border-color:var(--w-border-strong);border-radius:22px;padding:26px}
.w-login{margin-top:10vh;padding:34px;position:relative;overflow:hidden}
.w-login h1{font-family:var(--w-display);font-weight:600;letter-spacing:-.02em}
.wosd[data-theme="wos"] .w-logo{width:52px;height:52px;border-radius:16px;font-family:var(--w-display);font-size:22px;color:#2a1204;background:linear-gradient(135deg,var(--w-heat),var(--w-heat-2));box-shadow:0 12px 30px -10px var(--w-heat)}
.wosd a{color:var(--w-accent);text-underline-offset:3px}

/* ---- quick jump, phone tab bar, "More" sheet, login (v3.1) ---- */
.w-search-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--w-border-strong);background:rgba(4,10,20,.4);color:var(--w-muted);cursor:pointer;font-size:14px;text-align:left}
.w-search-btn:hover{border-color:rgba(125,227,244,.45);color:var(--w-text)}
.w-search-btn span{flex:1}
.w-search-btn kbd{font:inherit;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:7px;border:1px solid var(--w-border-strong);color:var(--w-muted)}
.w-palbg{position:fixed;inset:0;z-index:10000;background:rgba(3,7,14,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:start center;padding:12vh 12px 12px}
.w-pal{width:100%;max-width:560px;border-radius:20px;background:var(--w-surface-solid);border:1px solid var(--w-border-strong);box-shadow:0 30px 80px -20px rgba(0,0,0,.8);overflow:hidden;animation:w-pop .16s ease-out}
@keyframes w-pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.wosd .w-palin{width:100%;border:0;border-bottom:1px solid var(--w-border);border-radius:0;background:transparent;padding:18px 20px;font-size:17px;color:var(--w-text);outline:none}
.wosd .w-palin:focus{box-shadow:none;border-color:var(--w-border) !important}
.w-pallist{max-height:50vh;overflow:auto;padding:8px}
.w-pallist button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:none;color:var(--w-text);cursor:pointer;text-align:left;font-size:15px}
.w-pallist button span{flex:1}
.w-pallist button small{color:var(--w-muted);font-size:12.5px}
.w-pallist button .w-ic{color:var(--w-muted)}
.w-pallist button[aria-selected="true"],.w-pallist button:hover{background:var(--w-accent-soft)}
.w-pallist button[aria-selected="true"] .w-ic{color:var(--w-accent)}
.w-palfoot{display:flex;gap:16px;padding:10px 18px;border-top:1px solid var(--w-border);font-size:12px;color:var(--w-muted)}
.w-tabbar{display:none}
.w-loginlogo{display:block;width:64px;height:64px;border-radius:18px;box-shadow:0 0 0 1px var(--w-border-strong),0 14px 34px -12px var(--w-accent)}
.w-login .w-beam{background:conic-gradient(from var(--w-ang,0deg),transparent 0 75%,var(--w-accent) 86%,#fff 91%,transparent 96%)}
@media (max-width:860px){
  .w-side{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px}
  .w-side .w-nav,.w-side .w-sidefoot,.w-side .w-me{display:none}
  .w-side .w-brand{flex:1;min-width:0}
  .w-side .w-status{order:3;flex-basis:100%}
  .w-side .w-search-btn{width:auto;padding:8px 10px}
  .w-side .w-search-btn span,.w-side .w-search-btn kbd{display:none}
  /* phone menu sits at the top (the browser's own bar covers the bottom of the screen) */
  .w-tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:sticky;top:0;z-index:900;margin:-12px -12px 12px;padding:calc(6px + env(safe-area-inset-top)) 6px 6px;
    background:rgba(8,14,26,.9);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--w-border);border-radius:0 0 18px 18px}
  .w-tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border:0;border-radius:14px;background:none;color:var(--w-muted);font-size:11.5px;font-weight:650;cursor:pointer;min-width:0}
  .w-tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .w-tabbar .w-ic{width:22px;height:22px}
  .w-tabbar button[aria-current="page"]{color:var(--w-text);background:var(--w-accent-soft)}
  .w-tabbar button[aria-current="page"] .w-ic{color:var(--w-accent)}
  .w-tabbar .w-count{position:absolute;top:2px;right:calc(50% - 26px);font-size:10.5px;min-width:18px;padding:0 5px}
  .w-sheetbg{position:fixed;inset:0;z-index:950;background:rgba(3,7,14,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start}
  .w-sheet{width:100%;max-height:82vh;overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 10px;border-radius:0 0 24px 24px;background:var(--w-surface-solid);border-bottom:1px solid var(--w-border-strong);animation:w-down .2s ease-out;display:flex;flex-direction:column}
  @keyframes w-down{from{transform:translateY(-30px);opacity:.4}to{transform:none;opacity:1}}
  .w-grab{display:block;width:44px;height:5px;border-radius:5px;background:var(--w-border-strong);margin:12px auto 2px;order:9}
  .w-sheet .w-search-btn{margin-bottom:6px}
  .w-sheet .w-navgroup{display:block;padding:14px 4px 6px}
  .w-sheetgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .w-sheetgrid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;border:1px solid var(--w-border);background:var(--w-surface-2);color:var(--w-text);font-size:12.5px;font-weight:600;cursor:pointer;text-align:center}
  .w-sheetgrid button .w-ic{width:22px;height:22px;color:var(--w-muted)}
  .w-sheetgrid button[aria-current="page"]{border-color:rgba(125,227,244,.45);background:var(--w-accent-soft)}
  .w-sheetgrid button[aria-current="page"] .w-ic{color:var(--w-accent)}
  .w-sheet .w-sidefoot{display:flex;margin-top:16px;padding:14px 0 0}
  .w-savebar{bottom:calc(14px + env(safe-area-inset-bottom))}
  .w-toasts{bottom:calc(18px + env(safe-area-inset-bottom))}
}
.wosd ::-webkit-scrollbar{width:10px;height:10px}
.wosd ::-webkit-scrollbar-thumb{background:var(--w-border-strong);border-radius:10px;border:2px solid transparent;background-clip:content-box}

/* ---- small screens ---- */
@media (max-width:1100px){.w-bento > .w-hero,.w-bento > .w-week{grid-column:1/-1}}

  .wosd{padding:12px 12px 64px}
  .w-layout{grid-template-columns:1fr;gap:14px}
  .w-side{position:static;max-height:none;padding:12px;gap:10px;overflow:visible}

  .w-week .w-big{font-size:36px}

}
@media (max-width:520px){.w-tiles,.w-tiles4{grid-template-columns:repeat(2,minmax(0,1fr))}.w-tile{padding:14px}.w-sidefoot .w-btn{padding:7px 4px;font-size:13px}

/* ================================================================== api */
async function api(method, path, body) {
  if (S.demo) { if (!S.mock) S.mock = makeMock(); return S.mock(method, path, body); }
  let res;
  try {
    res = await fetch(S.base.replace(/\/+$/, '') + path, {
      method,
      headers: Object.assign({ 'X-Requested-With': 'wos' }, S.key ? { Authorization: 'Bearer ' + S.key } : {}, body ? { 'Content-Type': 'application/json' } : {}),
      credentials: 'same-origin',
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (e) {
    const err = new Error("Can't reach the bot. Check that it is running, that the address is right and uses HTTPS, " +
      "and that this site's address is listed in DASHBOARD_ORIGINS.");
    err.network = true; throw err;
  }
  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) {
    const err = new Error((data && data.error) || ('Request failed (' + res.status + ')'));
    err.status = res.status; throw err;
  }
  return data;
}
async function call(method, path, body) {
  try { return await api(method, path, body); }
  catch (e) { if (e.status === 401) { logout(S.user ? (e.message || 'Please log in again.') : 'Your key was rejected. Please connect again.'); } throw e; }
}

/* ============================================================== helpers */
function toast(msg, type) {
  let box = $('.w-toasts');
  if (!box) { box = document.createElement('div'); box.className = 'w-toasts'; box.setAttribute('aria-live', 'polite'); root.appendChild(box); }
  const t = document.createElement('div');
  t.className = 'w-toast ' + (type || ''); t.textContent = msg; box.appendChild(t);
  setTimeout(() => t.remove(), type === 'err' ? 8000 : 4500);
}
function ago(ts) {
  const s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (s < 45) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  if (s < 86400 * 14) return Math.round(s / 86400) + ' d ago';
  return new Date(ts * 1000).toLocaleDateString();
}
const full = ts => new Date(ts * 1000).toLocaleString();
function md(s) {   // tiny subset of Discord markdown for the preview
  return esc(s).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>').replace(/\n/g, '<br>');
}
function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.l = btn.innerHTML; btn.disabled = true; btn.textContent = label; }
  else { btn.disabled = false; if (btn.dataset.l) btn.innerHTML = btn.dataset.l; }
}

  return html`<option value="">— Not set —</option>${[...groups].map(([g, list]) =>
    html`<optgroup label="${g}">${list.map(c => html`<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>#${c.name}</option>`)}</optgroup>`)}`;
}
const dirtyKeys = () => GROUP.filter(k => S.draft[k] !== S.settings[k]);

// "Your bugs": what this moderator handled, and where those bugs are now.

  return html`<section class="w-card w-pad"><div class="w-sec-head"><h3 class="w-h3">Your bugs</h3>${M.total ? html`<button class="w-btn small" data-act="bugsMine">See all ${M.total}</button>` : ''}</div>
    ${M.total ? html`<div class="w-mysum"><span><b>${M.total}</b> handled · <b>${M.week}</b> this week</span>${chips.filter(c => c[0]).map(c => html`<span class="w-mychip"><i class="w-dot ${c[2]}"></i>${c[0]} ${c[1]}</span>`)}</div>
      ${M.recent.slice(0, 5).map(b => html`<div class="w-bugrow" role="button" tabindex="0" data-act="bugOpen" data-id="${b.id}"><b>#${b.id}</b>
        <span class="w-bugsum">${b.summary}<span class="w-hint" style="display:block">You: ${ACTION_LABEL[b.my_action] || b.my_action} · ${ago(b.my_ts)}</span></span>
        ${bugBadge(b.status)}<time title="${full(b.created_at)}">${ago(b.created_at)}</time></div>`)}`
      : html`<div class="w-empty">You haven’t handled any bugs yet. When you pass, reject or reply to a bug – in Discord or here – it shows up here with where it is now.</div>`}</section>`;
}

function modStats() {
  const I = S.insights; if (!I || !I.weeks) return '';
  const sum = k => I.weeks.reduce((a, w) => a + w[k], 0), areas = (I.areas || []).slice(0, 5), top = Math.max(1, ...areas.map(a => a.total));
  return html`<section class="w-card w-pad"><div class="w-sec-head"><h3 class="w-h3">Bug stats</h3><button class="w-btn small" data-act="nav" data-tab="insights">All stats</button></div>
    <div class="w-mysum"><span>Fixed in <b>${fmtHours(I.fix_hours)}</b> on average</span><span><b>${sum('reported')}</b> reported · <b>${sum('fixed')}</b> fixed in ${I.weeks.length} weeks</span><span><b>${I.duplicates}</b> duplicates closed</span></div>
    <div class="w-grid2" style="margin-top:6px"><div>${weeklyChart(I.weeks)}<div class="w-legend"><span><i class="w-sw" style="background:var(--w-accent)"></i>Reported</span><span><i class="w-sw" style="background:var(--w-ok)"></i>Fixed</span></div></div>
      <div>${areas.length ? areas.map(a => html`<button class="w-arearow" data-act="areaGo" data-v="${a.name}"><span>${a.name}</span><b>${a.total}</b>
          <i class="w-stack" style="height:6px"><i style="width:${a.fixed / top * 100}%;background:var(--w-ok)"></i><i style="width:${a.open / top * 100}%;background:var(--w-accent)"></i></i></button>`) : html`<div class="w-empty">No data yet.</div>`}</div></div></section>`;
}
// One line instead of a grid of tiles: where everything is, each part opens that list.
function pipeline(title, parts) {
  const total = parts.reduce((a, p) => a + p[0], 0) || 1;
  return html`<section class="w-card w-pad w-pipe"><div class="w-sec-head"><h3 class="w-h3">${title}</h3><span class="w-hint">${parts.reduce((a, p) => a + p[0], 0)} in total</span></div>
    <div class="w-pipebar" aria-hidden="true">${parts.filter(p => p[0]).map(p => html`<i class="${p[3]}" style="flex:${p[0] / total}"></i>`)}</div>
    <div class="w-pipeparts">${parts.map(p => html`<button data-act="gotoList" data-tab="${p[4]}" data-s="${p[2]}"><i class="w-dot ${p[3]}"></i><b>${p[0]}</b><span>${p[1]}</span></button>`)}</div></section>`;
}
function viewOverview() {
  const o = S.overview, st = o.stats, h = S.health;
  const rows = [];
  h.channels.forEach(c => {
    if (c.optional && !c.enabled) return;   // welcome channel only matters when welcome is on
    let state = 'ok', detail = 'Ready · #' + c.name;
    if (!c.configured) { state = 'todo'; detail = 'Not selected yet'; }
    else if (!c.found) { state = 'bad'; detail = 'Channel not found – it may have been deleted'; }
    else if (c.missing.length) { state = 'warn'; detail = '#' + c.name + ' · the bot is missing: ' + c.missing.join(', '); }
    rows.push({ label: c.label, state, detail, go: c.key === 'welcome_channel_id' ? 'welcome' : 'channels' });
  });
  rows.push({ label: 'Panel message', state: h.panel.published ? 'ok' : 'todo',
    detail: h.panel.published ? 'Live in #' + (h.panel.channel_name || '?') : 'Not published yet', go: 'panel' });
  h.roles.forEach(r => rows.push({ label: r.label, state: r.found ? 'ok' : 'bad',
    detail: r.found ? '@' + r.name : 'Role not found – check the role IDs in your .env file', go: null }));
  const issues = rows.filter(r => r.state !== 'ok').length;
  const B = st.bugs, G = st.suggestions;
  const bugTiles = [[B.total, 'Bugs reported', ''], [B.awaiting, 'Awaiting moderators', ''], [B.with_admins, 'Waiting for admins', ''],
    [B.investigating, 'Being investigated', 'warn'], [B.fixed, 'Fixed', 'ok'], [B.rejected, 'Rejected', 'bad']];
  const sugTiles = [[G.total, 'Suggestions submitted', ''], [G.pending, 'Awaiting decision', ''],
    [G.accepted, 'Accepted', 'ok'], [G.rejected, 'Rejected', 'bad']];
  const tIc = { 'Bugs reported': 'bug', 'Awaiting moderators': 'list', 'Waiting for admins': 'shield', 'Being investigated': 'alert', 'Fixed': 'check', 'Rejected': 'circle',
    'Suggestions submitted': 'message', 'Awaiting decision': 'list', 'Accepted': 'check' };
  const tile = t => html`<div class="w-card w-tile ${t[2]}"><i class="w-tic">${icon(tIc[t[1]] || 'chart')}</i><b data-tick="${t[0]}">${t[0]}</b><span>${t[1]}</span></div>`;
  const sIc = { ok: 'check', warn: 'alert', bad: 'alert', todo: 'circle' };
  const todo = [[B.awaiting, 'bug reports waiting for a moderator', 'bugs', 'new', 'bug'], [B.dups || 0, (B.dups === 1 ? 'bug looks' : 'bugs look') + ' like a duplicate – merge with one tap', 'bugs', 'dups', 'list'],
    [B.with_admins, 'bugs passed on, waiting for an admin', 'bugs', 'passed', 'shield'],
    [G.pending, 'suggestions waiting for a decision', 'suggestions', 'new', 'bulb'], [issues, issues === 1 ? 'setup problem to fix' : 'setup problems to fix', 'setup', '', 'alert']]
    .filter(t => t[0] && (!isMod() || t[2] === 'bugs') && !(isMod() && t[3] === 'passed'));
  const waiting = todo.reduce((a, t) => a + t[0], 0);
  return html`
    <div class="w-pagehead"><h2>${isMod() ? 'Bug dashboard' : 'Overview'}</h2><p>${isMod() ? 'Bug reports waiting for you, and how the team is doing.' : 'What needs a person right now, and how the server is doing.'}</p></div>
    ${alertStrip()}
    <div class="w-bento">
      <section class="w-card w-hero">${waiting ? html`<i class="w-beam" aria-hidden="true"></i>` : ''}
        <h3>${waiting ? 'Needs you now' : 'All clear'}</h3>
        <div class="w-sub">${waiting ? 'Pick one to jump straight to it.' : 'Nothing is waiting for the team. New reports show up here first.'}</div>
        ${waiting ? html`<div class="w-todo">${todo.map(t => html`<button data-act="${t[2] === 'setup' ? 'scrollSetup' : 'gotoList'}" data-tab="${t[2]}" data-s="${t[3]}" class="${t[2] !== 'setup' ? 'hot' : ''}">
            <b data-tick="${t[0]}">${t[0]}</b><span>${t[1]}</span>${icon(t[4])}</button>`)}</div>`
          : html`<div class="w-allclear">${icon('check')}<div><b>Everything is handled</b><div class="w-sub">The bot has access to every channel${h.panel.published ? ' and the panel is live' : ''}.</div></div></div>`}
      </section>
      <section class="w-card w-week">
        <div><div class="w-sub">Bug reports, last 7 days</div><div class="w-big" data-tick="${st.last7}">${st.last7}</div></div>
        <div class="w-wks">
          ${isMod() ? html`<div class="w-wk"><span>Possible duplicates</span><b>${st.bugs.dups || 0}</b></div>` : html`<div class="w-wk"><span>Members</span><b>${o.guild.members != null ? Number(o.guild.members).toLocaleString('en') : '–'}</b></div>`}
          <div class="w-wk"><span>Open info tickets</span><b>${st.open_tickets}</b></div>
          <div class="w-wk"><span>Bugs fixed so far</span><b>${B.fixed}</b></div>
          ${isMod() ? html`<div class="w-wk"><span>Being investigated</span><b>${B.investigating}</b></div>` : html`<div class="w-wk"><span>Ideas accepted</span><b>${G.accepted}</b></div>`}
        </div>
      </section>
    </div>
    ${isMod() ? myWork() : ''}
    ${pipeline(isMod() ? 'All bug reports' : 'Bug reports', [[B.awaiting, 'New', 'new', 'p-new', 'bugs'], [B.with_admins, 'With admins', 'passed', 'p-adm', 'bugs'],
      [B.investigating, 'Being fixed', 'being_investigated', 'p-inv', 'bugs'], [B.fixed, 'Fixed', 'fixed', 'p-ok', 'bugs'], [B.rejected, 'Rejected', 'rejected', 'p-bad', 'bugs']])}
    ${isMod() ? modStats() : pipeline('Suggestions', [[G.pending, 'Waiting', 'new', 'p-new', 'suggestions'], [G.accepted, 'Accepted', 'accepted', 'p-ok', 'suggestions'], [G.rejected, 'Rejected', 'rejected', 'p-bad', 'suggestions']])}
    ${isMod() ? '' : html`<section class="w-card w-pad" id="setup">
      <div class="w-sec-head"><h3 class="w-h3">Setup</h3><span class="w-badge ${issues ? 'warn' : 'ok'}">${issues ? issues + ' to fix' : 'All ' + rows.length + ' ready'}</span></div>
      ${rows.filter(r => r.state !== 'ok').map(r => html`<div class="w-check">
        <div class="w-check-ic ${r.state}">${icon(sIc[r.state])}</div>
        <div><div class="w-check-label">${r.label}</div><div class="w-check-detail">${r.detail}</div></div>
        ${r.go ? html`<button class="w-btn small" data-act="goto" data-tab="${r.go}">Fix</button>` : ''}
      </div>`)}
      <details class="w-fold"><summary><b>${issues ? 'Everything else' : 'Show all'}</b><span class="w-hint">${rows.filter(r => r.state === 'ok').length} ready</span></summary>
        ${rows.filter(r => r.state === 'ok').map(r => html`<div class="w-check"><div class="w-check-ic ok">${icon('check')}</div><div><div class="w-check-label">${r.label}</div><div class="w-check-detail">${r.detail}</div></div></div>`)}</details>
    </section>`}
    ${isMod() ? '' : html`<section class="w-card w-pad">
      <div class="w-sec-head"><h3 class="w-h3">Recent activity</h3><button class="w-btn small" data-act="goto" data-tab="log">View all</button></div>
      ${o.recent.length ? o.recent.slice(0, 6).map(logRow) : html`<div class="w-empty">Nothing has happened yet.</div>`}
    </section>`}`;
}

function langCard() {
  const L = S.langs;
  if (!L) return '';
  const top = Math.max(1, ...L.languages.map(x => x.count));
  return html`<section class="w-card w-pad"><div class="w-sec-head"><h3 class="w-h3">Languages in bug reports</h3><span class="w-hint">${L.ready} of ${L.total} can be compared in English</span></div>

}

function badgeFor(k) {
  const c = S.health.channels.find(x => x.key === k);
  if (S.draft[k] !== S.settings[k]) return html`<span class="w-badge todo">Unsaved change</span>`;
  if (!S.settings[k]) return html`<span class="w-badge todo">Not set</span>`;
  if (c && !c.found) return html`<span class="w-badge bad">Channel not found</span>`;
  if (c && c.missing.length) return html`<span class="w-badge warn">Bot is missing: ${c.missing.join(', ')}</span>`;
  return html`<span class="w-badge ok">${icon('check')} Bot has access</span>`;
}
function viewChannels() {
  return html`
    <div class="w-pagehead"><h2>Channels</h2><p>Choose where the bot reads and posts. Changes apply as soon as you save.</p></div>

function numberRow(k, label, desc, min, max, unit) {

// Sub-tabs inside a page (e.g. Bug bot → Panel message · Bug reports · …). Remembered per page.
const subOf = list => { const v = (S.sub || {})[S.tab]; return list.some(x => x[0] === v) ? v : list[0][0]; };
const subTabs = list => html`<div class="w-subtabs" role="tablist" aria-label="Parts of this page">${list.map(x => html`<button role="tab" class="w-subtab" data-act="sub" data-v="${x[0]}" aria-selected="${String(subOf(list) === x[0])}">${x[1]}</button>`)}</div>`;
// A page with its own settings gets a "Settings" sub-tab (admins only).
function withSettings(view, names, label) {
  return () => {
    const page = String(view());
    if (isMod()) return new Raw(page);
    const list = [['main', 'Overview'], ['settings', label || 'Settings']];
    const cut = page.indexOf('</div>', page.indexOf('w-pagehead')) + 6;
    if (subOf(list) === 'main') return new Raw(page.slice(0, cut) + subTabs(list) + page.slice(cut));
    return new Raw(page.slice(0, cut) + subTabs(list) + String(fsec(...names)) + String(saveBar()));
  };
}

async function loadStickerImgs() {
  for (const img of $$('img[data-emj]')) {
    const id = img.dataset.emj;
    if (S.demo) { img.src = 'assets/emojis/' + id + '.gif'; continue; }
    try {
      if (!fileUrls['emj-' + id]) { const r = await fetch(S.base.replace(/\/+$/, '') + '/api/emojis/' + id + '.gif', { headers: S.key ? { Authorization: 'Bearer ' + S.key } : {} });
        if (!r.ok) throw new Error('x'); fileUrls['emj-' + id] = URL.createObjectURL(await r.blob()); }
      img.src = fileUrls['emj-' + id];
    } catch (e) { img.alt = 'Not available'; }
  }
  for (const img of $$('img[data-stk]')) {
    const id = img.dataset.stk;
    if (S.demo) { img.src = 'assets/stickers/' + id + '.png'; continue; }
    try {
      if (!fileUrls['stk-' + id]) { const r = await fetch(S.base.replace(/\/+$/, '') + '/api/stickers/' + id + '.png', { headers: S.key ? { Authorization: 'Bearer ' + S.key } : {} });
        if (!r.ok) throw new Error('x'); fileUrls['stk-' + id] = URL.createObjectURL(await r.blob()); }
      img.src = fileUrls['stk-' + id];
    } catch (e) { img.alt = 'Not available'; }
  }
}

async function loadBugs(reset) {
  const B = S.bugs; if (B.loading) return; B.loading = true;
  try {
    const qs = new URLSearchParams({ limit: '25', offset: String(reset ? 0 : B.items.length) });
    if (B.status) qs.set('status', B.status);
    if (B.q) qs.set('q', B.q);
    if (B.mine) qs.set('mine', '1');
    if (B.dups) qs.set('dups', '1');
    ['area', 'version', 'severity'].forEach(k => { if (B[k]) qs.set(k, B[k]); });

    B.items = reset ? r.items : B.items.concat(r.items); B.total = r.total; B.counts = r.counts; B.error = '';
  } catch (e) { B.error = e.message; toast(e.message, 'err'); }
  B.loading = false; renderBugList();
}

async function openBug(id) {
  if (!S.replies) { try { S.replies = isMod() ? [] : (await call('GET', '/api/replies')).items; } catch (e) { S.replies = []; } }
  if (S.detail && S.detail.id !== id) S.rejOpen = false;
  S.detail = await call('GET', '/api/bugs/' + id); S.similar = null; showModal();
  if (!S.detail.duplicate_of && ['new', 'investigating', 'passed', 'being_investigated'].includes(S.detail.status)) (async () => {   // in the background
    try {
      const r = await call('GET', '/api/bugs/' + id + '/similar');
      if (!S.detail || S.detail.id !== id || !$('#wmodal')) return;
      S.similar = r.items;
      // keep what the moderator is doing: focus, typed text and scroll position survive the redraw
      const a = document.activeElement, fid = a && a.id, keep = {};
      $$('#wmodal input[id], #wmodal textarea[id]').forEach(x => { keep[x.id] = x.type === 'checkbox' ? x.checked : x.value; });
      const box = $('#wmodal .w-modal-card'), top = box ? box.scrollTop : 0;
      showModal();
      Object.entries(keep).forEach(([k, v]) => { const x = $('#' + k); if (x) { if (x.type === 'checkbox') x.checked = v; else x.value = v; } });
      const nb = $('#wmodal .w-modal-card'); if (nb) nb.scrollTop = top;
      if (fid && $('#' + fid)) $('#' + fid).focus();
    } catch (e) { /* not important */ }

}
// "Looks like…": the reports this one most resembles, each with a one-tap "Duplicate of #…".
function similarBox(b) {

const fileUrls = {};
async function loadThumbs() {
  for (const img of $$('#m-files img')) {
    const id = img.dataset.fid;
    try { if (!fileUrls[id]) fileUrls[id] = await fetchFile(S.detail.id, id); img.src = fileUrls[id]; } catch (e) { img.alt = 'Not available'; }

}
async function fetchFile(bugId, fid) {
  if (S.demo) return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200"><rect width="320" height="200" fill="#1c2a44"/><text x="160" y="105" fill="#9db7e8" font-family="Arial" font-size="18" text-anchor="middle">screenshot ' + fid + '</text></svg>');
  const res = await fetch(S.base.replace(/\/+$/, '') + '/api/bugs/' + bugId + '/files/' + fid, { headers: { Authorization: 'Bearer ' + S.key } });

function showModal() {

function closeModal() { S.detail = null; S.player = null; S.rejOpen = false; const m = $('#wmodal'); if (m) m.remove(); }
function refreshOverviewSoon() { setTimeout(() => { if (S.tab !== 'overview') call('GET', '/api/overview').then(o => { S.overview = o; refreshNavCount(); }).catch(() => {}); }, 300); }
async function changeBug(body, okMsg, btn) {

/* ---- server status ---- */
const fmtSize = n => n >= 1073741824 ? (n / 1073741824).toFixed(1) + ' GB' : fmtBytes(n);
function fmtDur(s) {
  if (s == null) return '–';
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? d + ' d ' + h + ' h' : h ? h + ' h ' + m + ' min' : m + ' min';
}
function meter(label, used, total, detail) {
  const pct = total ? Math.round(used / total * 100) : 0, cls = pct >= 90 ? 'bad' : pct >= 75 ? 'warn' : 'ok';
  return html`<div class="w-meter"><div class="w-meter-top"><b>${label}</b><span>${detail}</span></div>
    <div class="w-meter-bar ${cls}"><i style="width:${Math.min(100, pct)}%"></i></div><div class="w-hint">${pct}% used</div></div>`;
}

      <div class="w-card w-tile"><i class="w-tic">${icon('refresh')}</i><b>${fmtDur(B.uptime_s)}</b><span>Bot running since restart</span></div>
      <div class="w-card w-tile"><i class="w-tic">${icon('pulse')}</i><b>${fmtDur(Y.uptime_s)}</b><span>Server running since reboot</span></div>
      <div class="w-card w-tile ${T.website_ok === false ? 'bad' : T.website_ok ? 'ok' : ''}"><i class="w-tic">${icon('message')}</i><b>${T.website_ok == null ? '–' : T.website_ok ? 'OK' : 'Down'}</b><span>Website ↔ bot</span></div>

  if (s <= 0) return 'Expired ' + ago(ts);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return 'Expires in ' + (d ? d + ' d ' + h + ' h' : h ? h + ' h ' + m + ' min' : m + ' min');

const roleOptions = (sel, onlyAssignable) => html`<option value="">— None —</option>${(S.roles || []).map(r => html`<option value="${r.id}" ${r.id === String(sel || '') ? 'selected' : ''} ${onlyAssignable && !r.assignable ? 'disabled' : ''}>@${r.name}${onlyAssignable && !r.assignable ? ' (above the bot)' : ''}</option>`)}`;
const chanSelect = (id, sel) => html`<select class="w-select" id="${id}">${channelOptions(sel ? String(sel) : '')}</select>`;
const CASE_BADGE = { warn: ['warn', '⚠️ Warning'], timeout: ['info', '🔇 Timeout'], ban: ['bad', '⛔ Ban'], kick: ['bad', '👢 Kick'], pardon: ['ok', '🕊️ Pardon'], unban: ['ok', '♻️ Unban'] };

/* ------------------------------------------------ staff queue: reported messages, appeals, raid mode */
const DEV_LABEL = { working: '🛠️ Developers are working on it', fixed: '✔️ Fixed by the developers', need_info: '💬 Developers need more info' };
function devLine(b) {
  const d = b.dev; if (!d || !d.state) return '';
  return html`<div class="w-devline ${d.state}"><b>${DEV_LABEL[d.state]}${d.state === 'fixed' && d.version ? ' in ' + d.version : ''}</b>${d.note ? html`<span>“${d.note}”</span>` : ''}<time title="${full(d.ts)}">${ago(d.ts)}</time></div>`;
}
function alertStrip() {
  const Q = S.queue; if (!Q) return '';
  const out = [];
  if (Q.raid.active) out.push(html`<section class="w-card w-alertrow bad">${icon('shield')}<div><b>Raid mode is on</b>
    <span>Since ${ago(Q.raid.since)} · ${Q.raid.joined} joined meanwhile. New members ${Q.raid.gate ? 'can’t get past the device question' : 'aren’t welcomed'} until someone lifts it.</span></div>
    <button class="w-btn primary" data-act="raidSet" data-on="0">Lift raid mode</button></section>`);
  (Q.spikes || []).forEach(s => out.push(html`<section class="w-card w-alertrow warn">${icon('alert')}<div><b>${s.count} reports about “${s.area || 'no area'}” in a short time</b>
    <span>${s.bug ? (s.known ? 'Bug #' + s.bug + ' is on the known issues list.' : 'Post bug #' + s.bug + ' as a known issue so players see it before they report.') : 'Something may be broken.'}</span></div>
    ${s.bug && !s.known ? html`<button class="w-btn primary" data-act="spikeKnown" data-id="${s.bug}">Post as known issue</button>` : ''}
    ${s.bug ? html`<button class="w-btn" data-act="bugOpen" data-id="${s.bug}">Open #${s.bug}</button>` : ''}<button class="w-btn" data-act="spikeDismiss" data-key="${s.key}">Dismiss</button></section>`));
  if (Q.reports || Q.appeals) out.push(html`<section class="w-card w-alertrow">${icon('shield')}<div><b>${[Q.reports ? Q.reports + ' reported message' + (Q.reports === 1 ? '' : 's') : '', Q.appeals ? Q.appeals + ' appeal' + (Q.appeals === 1 ? '' : 's') : ''].filter(Boolean).join(' and ')} waiting</b>
    <span>Players flagged a chat message, or asked for a timeout or ban to be looked at again.</span></div><button class="w-btn primary" data-act="nav" data-tab="queue">Open the queue</button></section>`);
  return out;
}
function caseMini(x) {
  return x.cases && x.cases.length ? html`<details class="w-fold"><summary><b>History</b><span class="w-hint">${x.warnings} active warning${x.warnings === 1 ? '' : 's'} · ${x.cases.length} case${x.cases.length === 1 ? '' : 's'}</span></summary>
    ${x.cases.map(c => html`<div class="w-caseline"><span class="w-badge ${CASE_BADGE[c.kind] ? CASE_BADGE[c.kind][0] : 'todo'}">${CASE_BADGE[c.kind] ? CASE_BADGE[c.kind][1] : c.kind}</span><span>${c.reason || '–'}</span><time title="${full(c.ts)}">${ago(c.ts)}</time></div>`)}</details>`
    : html`<p class="w-hint" style="margin:6px 0 0">No earlier warnings or cases.</p>`;
}
function reportCard(r) {
  const open = r.status === 'open';
  return html`<article class="w-qcard" data-rid="${r.id}">
    <div class="w-qhead"><b>${pname(r.target_id, r.target)}</b><span class="w-hint">in #${r.channel} · ${ago(r.ts)}</span>${r.warnings ? html`<span class="w-badge warn">⚠️ ${r.warnings} active</span>` : ''}
      <a class="w-linkbtn" href="${r.url}" target="_blank" rel="noopener">Open in Discord ↗</a></div>
    ${r.context.length ? html`<div class="w-ctx">${r.context.map(c => html`<p><b>${c.name}</b> ${c.text || '…'}</p>`)}</div>` : ''}
    <blockquote class="w-flagged">${r.content || '(no text)'}${r.attachments.length ? html`<span class="w-hint" style="display:block">${r.attachments.length} attachment${r.attachments.length === 1 ? '' : 's'} – open in Discord to see</span>` : ''}</blockquote>
    <p class="w-hint" style="margin:6px 0">Reported by ${r.reporters.map(p => p.name + (p.reason ? ' (“' + p.reason + '”)' : '')).join(', ')}</p>
    ${caseMini(r)}
    ${open ? html`<div class="w-decide"><button class="w-btn" data-act="repAct" data-a="delete" data-id="${r.id}">🗑️ Delete message</button>
        <button class="w-btn danger" data-act="repAct" data-a="warn" data-id="${r.id}" ${r.on_server ? '' : 'disabled'}>⚠️ Delete + warn</button>
        <button class="w-btn danger" data-act="repAct" data-a="timeout" data-id="${r.id}" ${r.on_server ? '' : 'disabled'}>🔇 Delete + timeout</button>
        <select class="w-select" id="rep-min-${r.id}" aria-label="Timeout length" style="width:auto"><option value="60">1 hour</option><option value="720">12 hours</option><option value="1440">1 day</option><option value="10080">1 week</option></select>
        <button class="w-btn" data-act="repAct" data-a="dismiss" data-id="${r.id}">✅ Nothing wrong</button></div>
      <input class="w-input" id="rep-why-${r.id}" maxlength="300" placeholder="Reason the member sees (optional) – default: “Reported message in #${r.channel}”" style="margin-top:8px" aria-label="Reason">`
      : html`<p class="w-sub" style="margin-top:8px"><b>${r.action}</b> – ${r.handled_by}, ${ago(r.handled_ts)}</p>`}
  </article>`;
}
function appealCard(a) {
  const open = a.status === 'open', mine = a.kind !== 'ban' || !isMod();
  return html`<article class="w-qcard">
    <div class="w-qhead"><b>${pname(a.user_id, a.user)}</b><span class="w-badge ${a.kind === 'ban' ? 'bad' : 'info'}">${a.kind === 'ban' ? '⛔ Ban' : '🔇 Timeout'}</span><span class="w-hint">${ago(a.ts)}</span>
      ${open ? '' : html`<span class="w-badge ${a.status === 'accepted' ? 'ok' : 'todo'}">${a.status === 'accepted' ? 'Accepted' : 'Declined'}</span>`}</div>
    <p class="w-hint" style="margin:6px 0">Punished for: ${a.case_reason || 'no reason recorded'}${a.case_ts ? ' · ' + ago(a.case_ts) : ''}</p>
    <blockquote class="w-flagged calm">${a.text}</blockquote>
    ${caseMini(a)}
    ${open ? (mine ? html`<input class="w-input" id="ap-note-${a.id}" maxlength="500" placeholder="Note to the player (optional)" style="margin-top:10px" aria-label="Note to the player">
        <div class="w-decide"><button class="w-btn primary" data-act="apDecide" data-ok="1" data-id="${a.id}">✅ Accept – remove the ${a.kind}</button><button class="w-btn" data-act="apDecide" data-ok="0" data-id="${a.id}">Decline</button></div>`
        : html`<p class="w-hint" style="margin-top:8px">Only admins can decide on a ban appeal.</p>`)
      : html`<p class="w-sub" style="margin-top:8px">${a.handled_by}, ${ago(a.handled_ts)}${a.note ? ' – “' + a.note + '”' : ''}</p>`}
  </article>`;
}
function viewQueue() {
  const Q = S.queue, R = S.reports, A = S.appeals;
  if (!Q || !R || !A) return html`<div class="w-pagehead"><h2>Reports & appeals</h2></div><div class="w-card w-pad w-empty">Loading…</div>`;
  const done = S.queueDone;
  return html`
    <div class="w-pagehead"><h2>Reports & appeals</h2><p>Chat messages players flagged with “Report to moderators”, appeals against timeouts and bans, and raid mode.</p></div>
    <section class="w-card w-pad"><div class="w-sec-head"><h3 class="w-h3">Raid mode</h3><span class="w-badge ${Q.raid.active ? 'bad' : 'ok'}">${Q.raid.active ? 'On' : 'Off'}</span></div>
      <p class="w-sub">${Q.raid.active ? 'On since ' + ago(Q.raid.since) + (Q.raid.by ? ' (' + Q.raid.by + ')' : '') + ' · ' + Q.raid.joined + ' joined meanwhile. They wait at the door until you lift it.'
        : 'Switches on by itself when many accounts join within minutes: new members ' + (Q.raid.gate ? 'can’t get past the device question' : 'aren’t welcomed') + ' and staff get a ping.'}</p>
      <div class="w-actions"><button class="w-btn ${Q.raid.active ? 'primary' : 'danger'}" data-act="raidSet" data-on="${Q.raid.active ? 0 : 1}">${Q.raid.active ? 'Lift raid mode' : 'Switch on now'}</button></div></section>
    ${playerFind()}
    <section class="w-card w-pad"><div class="w-sec-head"><h3 class="w-h3">Reported messages${!done && R.items.length ? html` <em class="w-count">${R.items.length}</em>` : ''}</h3>
        <button class="w-btn small" data-act="queueDone">${done ? 'Show waiting' : 'Show handled'}</button></div>
      ${R.items.length ? R.items.map(reportCard) : html`<div class="w-empty">${done ? 'Nothing handled yet.' : 'No reported messages are waiting. Players right-click a message → Apps → “Report to moderators”.'}</div>`}</section>
    <section class="w-card w-pad"><div class="w-sec-head"><h3 class="w-h3">Appeals${!done && A.items.length ? html` <em class="w-count">${A.items.length}</em>` : ''}</h3></div>
      ${A.items.length ? A.items.map(appealCard) : html`<div class="w-empty">${done ? 'No appeals decided yet.' : 'No appeals are waiting. A timed-out or banned player can send one from the website’s Appeal page.'}</div>`}</section>`;
}
// Settings → Bug bot → Developers: the live page for the developers. The secret part of the link is only shown when it is made.

/* ------------------------------------------------ player card (one page per player) and deleted messages */

function msgRow(m, withAuthor) {
  const last = m.edits.length ? m.edits[m.edits.length - 1] : null;
  return html`<div class="w-msgrow"><div class="w-qhead">${withAuthor ? html`<b>${pname(m.author_id, m.author)}</b>` : ''}<span class="w-hint">#${m.channel} · written ${ago(m.ts)}${m.deleted_ts ? ' · deleted ' + ago(m.deleted_ts) : ''}</span>
      ${m.deleted_ts ? html`<span class="w-badge ${m.deleted_by === 'bot' ? 'info' : 'todo'}">${m.deleted_by === 'bot' ? 'Removed by the bot' : m.deleted_by ? 'Removed by ' + m.deleted_by : 'Deleted'}</span>` : html`<a class="w-linkbtn" href="${m.url}" target="_blank" rel="noopener">Open ↗</a>`}</div>
    <blockquote class="w-flagged calm">${m.content || '(no text)'}${m.attachments ? html`<span class="w-hint" style="display:block">${m.attachments} attachment${m.attachments === 1 ? '' : 's'} (not kept)</span>` : ''}</blockquote>
    ${last ? html`<details class="w-fold"><summary><b>Before the edit</b><span class="w-hint">${m.edits.length} earlier version${m.edits.length === 1 ? '' : 's'}</span></summary>${m.edits.map(e => html`<blockquote class="w-flagged calm" style="opacity:.8">${e.text || '(no text)'}<span class="w-hint" style="display:block">changed ${ago(e.ts)}</span></blockquote>`)}</details>` : ''}</div>`;
}

        <div class="w-inline"><input class="w-input" id="ml-q" placeholder="Name, channel or words" value="${L.q || ''}" style="max-width:240px" aria-label="Search messages"><button class="w-btn small" data-act="msglogSearch">Search</button></div></div>
      ${!L.enabled ? html`<div class="w-empty">The message log is switched off${isMod() ? '.' : ' – turn it on under Settings on this page.'}</div>`

    </section>`;
}
const BUGST = { new: 'New', investigating: 'Info ticket', passed: 'With admins', being_investigated: 'Being fixed', fixed: 'Fixed', rejected: 'Rejected', admin_rejected: 'Rejected' };

    <div class="w-inline" style="margin-top:6px"><input class="w-input" id="pn-text" maxlength="1000" placeholder="${p.notes.length ? 'Add another note' : 'e.g. Talked to them in voice – it was a misunderstanding'}" aria-label="New note"><button class="w-btn" data-act="playerNote">Add note</button></div>

    ${p.staff ? '' : html`<div class="w-decide" style="margin-top:14px">
      <input class="w-input" id="pa-why" maxlength="400" placeholder="Reason – the member sees it" aria-label="Reason" style="flex:1 1 100%">

    ${p.deleted.length ? sec('Deleted messages', p.deleted.length, p.deleted.map(m => msgRow(m, false))) : ''}

async function openPlayer(id) { S.player = await call('GET', '/api/players/' + id); S.detail = null; showPlayer(); }

const DAYS = [['mon', 'Mon'], ['tue', 'Tue'], ['wed', 'Wed'], ['thu', 'Thu'], ['fri', 'Fri'], ['sat', 'Sat'], ['sun', 'Sun']];
function tmSoon() {   // next full hour, as yyyy-mm-ddThh:mm (the browser's own clock)
  const d = new Date(Date.now() + 3600e3); d.setMinutes(0, 0, 0);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':00';
}
function tmBlank(preset) {
  return preset === 'bear' ? { id: null, name: 'Bear Hunt reminder', channel_id: '', content: '🐻 **Bear Hunt starts in 30 minutes!** Get your rallies ready, chiefs.', kind: 'daily', at: '19:30', days: DAYS.map(d => d[0]), every_minutes: 240, role_id: '', delete_previous: true, enabled: true }
    : { id: null, name: '', channel_id: '', content: '', kind: 'once', at: tmSoon(), days: DAYS.map(d => d[0]), every_minutes: 240, role_id: '', delete_previous: false, enabled: true };
}
function tmCollect() {
  const E = S.tmEdit; if (!E || !$('#tm-name')) return;
  E.name = $('#tm-name').value; E.channel_id = $('#tm-chan').value; E.content = $('#tm-msg').value; E.role_id = $('#tm-role').value;
  E.delete_previous = $('#tm-del') ? $('#tm-del').checked : false;
  if ($('#tm-at')) E.at = $('#tm-at').value; if ($('#tm-when')) E.at = $('#tm-when').value;
  if ($('#tm-every')) E.every_minutes = parseInt($('#tm-every').value || '0', 10) * 60;
}
const TM_KINDS = [['once', 'Once – on a date and time'], ['daily', 'Every day (or chosen days)'], ['interval', 'Again and again – every few hours']];
function tmWhen(t) {
  if (t.kind === 'once') { const d = new Date(t.at); return isNaN(d) ? t.at : d.toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  if (t.kind === 'interval') return 'every ' + Math.round(t.every_minutes / 60) + ' h';
  return t.at + ' · ' + (t.days.length === 7 ? 'every day' : t.days.map(d => d[0].toUpperCase() + d.slice(1)).join(', '));
}
function viewTimers() {
  if (!S.tm) return html`<div class="w-pagehead"><h2>Timed messages</h2></div><div class="w-card w-pad w-empty">Loading…</div>`;

  const editor = E ? html`<section class="w-card w-pad" id="tm-edit"><h3 class="w-h3" style="margin-bottom:12px">${E.id ? 'Edit timed message' : 'New timed message'}</h3>
      <div class="w-form2"><div class="w-field"><label class="w-label" for="tm-name">Name <span class="w-hint">(only for you)</span></label><input class="w-input" id="tm-name" maxlength="60" value="${E.name}" placeholder="e.g. SvS starts"></div>
        <div class="w-field"><label class="w-label" for="tm-chan">Channel</label>${chanSelect('tm-chan', E.channel_id)}</div></div>
