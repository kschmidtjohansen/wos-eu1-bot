      ${E.kind === 'once' ? html`<div class="w-form2"><div class="w-field"><label class="w-label" for="tm-when">Post it on <span class="w-hint">(${T.timezone})</span></label><input class="w-input" id="tm-when" type="datetime-local" value="${/T/.test(E.at || '') ? E.at : tmSoon()}"></div></div>`
        : E.kind === 'daily' ? html`<div class="w-form2"><div class="w-field"><label class="w-label" for="tm-at">Time <span class="w-hint">(${T.timezone})</span></label><input class="w-input" id="tm-at" type="time" value="${/^\d\d:\d\d$/.test(E.at || '') ? E.at : '18:00'}"></div></div>
          <div class="w-field"><span class="w-label">On these days</span><div class="w-chips">${DAYS.map(d => html`<button type="button" class="w-chip" data-act="tmDay" data-d="${d[0]}" aria-pressed="${String(E.days.includes(d[0]))}">${d[1]}</button>`)}</div></div>`
        : html`<div class="w-form2"><div class="w-field"><label class="w-label" for="tm-every">Every</label><div class="w-inline"><input class="w-input" id="tm-every" type="number" min="1" max="168" value="${Math.round((E.every_minutes || 240) / 60)}" style="max-width:110px"><span class="w-hint">hours</span></div></div></div>`}
      <div class="w-form2"><div class="w-field"><label class="w-label" for="tm-role">Ping a role <span class="w-hint">(optional)</span></label><select class="w-select" id="tm-role">${roleOptions(E.role_id, false)}</select></div>
        ${E.kind === 'once' ? '' : html`<div class="w-field"><label class="w-label">&nbsp;</label><label class="w-inline w-hint" style="gap:6px"><input type="checkbox" id="tm-del" ${E.delete_previous ? 'checked' : ''}> Delete the previous one when posting (keeps the channel tidy)</label></div>`}</div>
      <div class="w-actions"><div class="w-spacer"></div><button class="w-btn" data-act="tmCancel">Cancel</button><button class="w-btn primary" data-act="tmSave">${E.kind === 'once' ? 'Schedule it' : 'Save'}</button></div></section>` : '';
  const upcoming = T.items.filter(t => !(t.kind === 'once' && !t.next_run)), done = T.items.filter(t => t.kind === 'once' && !t.next_run);
  const item = t => html`<div class="w-item"><div><b>${t.name}</b> ${t.kind === 'once' && !t.next_run ? html`<span class="w-badge ok">Posted${t.last_run ? ' ' + ago(t.last_run) : ''}</span>` : t.enabled ? '' : html`<span class="w-badge todo">Paused</span>`}
      <p>${t.kind === 'once' ? '📅 ' : '🔁 '}${tmWhen(t)} · ${chanName(t.channel_id) || '?'}${t.role_id ? ' · pings ' + roleName(t.role_id) : ''}${t.enabled && t.next_run && t.kind !== 'once' ? ' · next ' + full(t.next_run) : ''}</p><p>${t.content.slice(0, 140)}</p></div>
    <div class="w-inline">${t.kind === 'once' && !t.next_run ? '' : html`<label class="w-switch" title="On/off"><input type="checkbox" data-act="tmToggle" data-id="${t.id}" ${t.enabled ? 'checked' : ''} aria-label="On"><span></span></label>`}
      <button class="w-btn small" data-act="tmSend" data-id="${t.id}">Send now</button><button class="w-btn small" data-act="tmEdit" data-id="${t.id}">${t.kind === 'once' && !t.next_run ? 'Post again later' : 'Edit'}</button><button class="w-btn small danger" data-act="tmDelete" data-id="${t.id}">Delete</button></div></div>`;
  return html`
    <div class="w-pagehead"><h2>Timed messages</h2><p>Write a message now and let the bot post it at the moment you choose – “SvS starts in 1 hour” on Saturday 18:00, a maintenance notice, an event announcement. Repeating ones (every day, every few hours) work too. Times are in ${T.timezone}.</p></div>
    ${editor || html`<div class="w-actions"><button class="w-btn primary" data-act="tmNew">📅 Schedule a message</button><button class="w-btn" data-act="tmNew" data-preset="bear">🐻 Daily “Bear Hunt in 30 min”</button></div>`}
    <section class="w-card w-pad"><h3 class="w-h3">Coming up (${upcoming.length})</h3>${upcoming.length ? upcoming.map(item) : html`<div class="w-empty">Nothing scheduled.</div>`}</section>
    ${done.length ? html`<section class="w-card w-pad"><h3 class="w-h3">Already posted (${done.length})</h3>${done.slice(0, 20).map(item)}</section>` : ''}`;
}

}

    <section class="w-card w-pad"><h3 class="w-h3">Device question for new members</h3>

      ${locked ? html`<div class="w-banner ok" style="margin:10px 0">${icon('check')}<div><b>On – new members answer the question first</b><div class="w-sub">Switched on ${ago(C.locked_at)}.</div></div><button class="w-btn small danger" data-act="accUnlock">Undo</button></div>` : ''}
      ${step(1, rolesDone, 'Roles', html`<div class="w-form2"><div class="w-field"><label class="w-label" for="acc-member">Member role</label><select class="w-select" id="acc-member">${new Raw(String(roleOptions(C.member_role, true)).replace('— None —', '— Create “Member” —'))}</select></div>
          <div class="w-field"><label class="w-label" for="acc-ios">iOS role</label><select class="w-select" id="acc-ios">${new Raw(String(roleOptions(C.ios_role, true)).replace('— None —', '— Create “🍎 iOS” —'))}</select></div>
          <div class="w-field"><label class="w-label" for="acc-android">Android / Emulator role</label><select class="w-select" id="acc-android">${new Raw(String(roleOptions(C.android_role, true)).replace('— None —', '— Create “🤖 Android / Emulator” —'))}</select></div></div>
        <div class="w-actions"><button class="w-btn" data-act="accRoles">${rolesDone ? 'Save roles' : 'Create / save roles'}</button></div>`)}
      ${step(2, gateDone, 'The question', html`<div class="w-form2"><div class="w-field"><label class="w-label" for="acc-gch">Channel new members see</label>${chanSelect('acc-gch', C.gate_channel || '')}</div></div>
        <div class="w-field"><label class="w-label" for="acc-gtext">Text <span class="w-hint">– {server} becomes the server name</span></label><textarea class="w-textarea" id="acc-gtext" maxlength="1500" style="min-height:80px">${C.gate_text || "Welcome to **{server}**! 👋\n\nBefore you can see the channels, tell us which device you play on. Tap a button below – it takes one second."}</textarea></div>
        <div class="w-actions"><button class="w-btn" data-act="accGate" ${rolesDone ? '' : 'disabled'}>${icon('send')} ${gateDone ? 'Update the question' : 'Post the question'}</button></div>`)}
      ${step(3, bfDone, 'Give Member to everyone already here', html`<p class="w-hint">So nobody who is already in the server loses the channels. Bots get it too. About 4 members a second – it keeps going if the bot restarts.</p>
        ${bf.state ? html`<div class="w-bar"><i style="width:${pct}%"></i></div><div class="w-hint">${bfDone ? '✅ Done – ' + (bf.done || 0) + ' member(s) got the role' + (bf.failed ? ', ' + bf.failed + ' failed' : '') : 'Working… ' + (bf.done || 0) + ' of ' + (bf.total || '?')}</div>` : ''}
        <div class="w-actions"><button class="w-btn" data-act="accBackfill" ${rolesDone && bf.state !== 'running' ? '' : 'disabled'}>${bfDone ? 'Run again (catches anyone missed)' : 'Give Member to everyone (' + (A.members || 0) + ')'}</button></div>`)}
      ${step(4, locked, 'Switch it on', html`<p class="w-hint">Moves “View Channels” from @everyone to the Member role, and opens the question channel to everyone. Private staff channels are left alone. Everything is remembered, so <b>Undo</b> puts it back exactly.</p>
        <div class="w-actions"><button class="w-btn primary" data-act="accLock" ${rolesDone && gateDone && bfDone && !locked ? '' : 'disabled'}>${locked ? 'It’s on' : 'Hide channels until they answer'}</button></div>`)}
    </section>`;
}

    ${!V.can_read ? html`<div class="w-card w-banner warn">${icon('alert')}<div><b>The bot can’t read the invite links</b><div class="w-sub">Give the bot’s role the <b>Manage Server</b> permission in Discord – it needs it to see which link someone used.</div></div></div>` : ''}

      <ol class="w-steps" style="margin:0 0 10px 18px;line-height:1.7">

      ${V.top.length ? html`<div class="w-tablewrap"><table class="w-table"><thead><tr><th>Member</th><th>Invites</th><th>Joined</th><th>Left</th><th>New accounts</th><th>Bonus</th></tr></thead><tbody>
        ${V.top.map(r => html`<tr><td>${r.name}</td><td><b>${r.regular}</b></td><td>${r.total}</td><td>${r.left || '–'}</td><td>${r.fake || '–'}</td><td>${r.bonus || '–'}</td></tr>`)}</tbody></table></div>` : html`<div class="w-empty">Nobody has joined through an invite yet.</div>`}

    <section class="w-card w-pad"><h3 class="w-h3">Recent joins</h3>
      ${V.recent.length ? html`<div class="w-tablewrap"><table class="w-table"><thead><tr><th>Member</th><th style="text-align:left">Invited by</th><th>Link</th><th>Joined</th><th>Status</th></tr></thead><tbody>

/* ---- moderator stats ---- */
function viewModerators() {
  const M = S.modstats;
  if (!M) return html`<div class="w-pagehead"><h2>Moderators</h2></div><div class="w-card w-pad w-empty">Loading…</div>`;

  const chip = d => html`<button class="w-chip" data-act="modDays" data-d="${d}" aria-pressed="${String(M.days === d)}">${d ? 'Last ' + d + ' days' : 'All time'}</button>`;
  const WHO = { Moderators: 'warn', Admins: 'info', 'Info ticket': 'todo' };
  return html`
    <div class="w-pagehead"><h2>Moderators</h2><p>How fast players get an answer, who does the work, and what is waiting too long right now.</p></div>
    <div class="w-chips" style="margin-bottom:12px">${[7, 30, 90, 0].map(chip)}</div>
    <div class="w-tiles w-tiles4">
      ${tile(fmtHours(M.mod_hours), 'First answer by a moderator (median, ' + M.mod_count + ' bugs)')}
      ${tile(fmtHours(M.admin_hours), 'Admin answer after passing (median, ' + M.admin_count + ' bugs)')}
      ${tile(M.within_day == null ? '–' : M.within_day + '%', 'Bugs answered within 24 h', M.within_day == null ? '' : M.within_day >= 80 ? 'ok' : 'bad')}
      ${tile(fmtHours(M.sug_hours), 'Suggestion decision (median, ' + M.sug_count + ')')}
    </div>
    <section class="w-card w-pad"><div class="w-sec-head"><h3 class="w-h3">Waiting over ${M.wait_hours} h (${M.waiting_total})</h3></div>
      ${M.waiting.length ? html`<div class="w-tablewrap"><table class="w-table"><thead><tr><th></th><th style="text-align:left">What</th><th>Waiting on</th><th>Since</th><th>Affected</th></tr></thead><tbody>
        ${M.waiting.map(w => html`<tr><td>${w.kind === 'bug' ? html`<button class="w-linkbtn" data-act="bugOpen" data-id="${w.id}">#${w.id}</button>` : '💡 #' + w.id}</td>
          <td style="text-align:left">${w.severity ? SEV[w.severity] + ' · ' : ''}${w.title}</td><td><span class="w-badge ${WHO[w.who] || 'todo'}">${w.who}</span></td><td title="${full(w.since)}">${ago(w.since)}</td><td>${w.votes ? '👥 ' + w.votes : '–'}</td></tr>`)}</tbody></table></div>`
        : html`<div class="w-empty">Nothing has waited over ${M.wait_hours} h. 🎉</div>`}
      <p class="w-hint" style="margin-top:6px">“Info ticket” means a moderator is waiting for the player to answer.</p>
    </section>
    <section class="w-card w-pad"><h3 class="w-h3">Who did the work</h3><p class="w-sub" style="margin-bottom:8px">“First answer” = how long reports waited before this person answered them first (median).</p>
      ${M.staff.length ? html`<div class="w-tablewrap"><table class="w-table"><thead><tr><th>Name</th><th>Handled</th><th>Bugs</th><th>Suggestions</th><th>Replies</th><th>First answer</th><th>Admin answer</th><th>Last active</th></tr></thead><tbody>
        ${M.staff.map(p => html`<tr><td>${p.name}</td><td><b>${p.handled}</b></td><td>${p.bugs || '–'}</td><td>${p.suggestions || '–'}</td><td>${p.replies || '–'}</td>
          <td>${p.first_count ? fmtHours(p.first_hours) + ' (' + p.first_count + ')' : '–'}</td><td>${p.admin_count ? fmtHours(p.admin_hours) + ' (' + p.admin_count + ')' : '–'}</td><td>${p.last ? ago(p.last) : '–'}</td></tr>`)}</tbody></table></div>`
        : html`<div class="w-empty">Nothing recorded in this period.</div>`}

}

/* ---- translations ---- */
function trValue(k) { const R = S.tr; return k.key in R.dirty ? R.dirty[k.key] : (k.custom != null ? k.custom : (k.builtin || '')); }
function viewTranslations() {
  const R = S.tr;
  if (!R || !R.data) return html`<div class="w-pagehead"><h2>Translations</h2></div><div class="w-card w-pad w-empty">Loading…</div>`;
  const D = R.data, enabled = D.languages.map(l => l.code), addable = D.known.filter(k => !enabled.includes(k.code));
  const groups = [...new Set(D.keys.map(k => k.group))], q = R.q.toLowerCase();
  const list = D.keys.filter(k => (!R.group || k.group === R.group) && (!q || (k.en + ' ' + trValue(k)).toLowerCase().includes(q)));
  const missing = D.keys.filter(k => !trValue(k)).length, nDirty = Object.keys(R.dirty).length;
  const isEn = D.lang === 'en';
  return html`
    <div class="w-pagehead"><h2>Translations</h2><p>Every message players get from the bot – tickets, buttons, DMs, gift codes. Each player gets their own language:
      the one they pick in a ticket or with <b>/language</b>, otherwise their Discord language, otherwise the default below.</p></div>
    ${autoCard()}
    <section class="w-card w-pad"><h3 class="w-h3" style="margin-bottom:12px">Languages</h3>
      <div class="w-langs">${D.languages.map(l => html`<div class="w-lang ${l.code === D.default ? 'def' : ''}"><b>${l.name}</b>
        <span class="w-hint">${l.code}${l.code === D.default ? ' · default' : ''} · ${l.players} player${l.players === 1 ? '' : 's'}${l.custom ? ' · ' + l.custom + ' edited' : ''}${l.auto ? ' · ' + l.auto + ' auto-translated' : !l.builtin && l.code !== 'en' ? ' · not translated yet' : ''}</span>
        <div class="w-inline" style="gap:12px;margin-top:6px">${l.code !== D.default ? html`<button class="w-linkbtn" data-act="langDefault" data-l="${l.code}">Make default</button>` : ''}
          ${l.code !== 'en' ? html`<button class="w-linkbtn" style="color:var(--w-bad)" data-act="langRemove" data-l="${l.code}">Remove</button>` : ''}</div></div>`)}</div>
      ${addable.length ? html`<div class="w-inline" style="margin-top:14px"><select class="w-select" id="tr-add" style="max-width:220px" aria-label="Language to add">${addable.map(k => html`<option value="${k.code}">${k.name}</option>`)}</select>
        <button class="w-btn" data-act="langAdd">Add language</button><span class="w-hint">With a Google key, new languages are translated automatically. Without one they use English until you translate them here.</span></div>` : ''}
    </section>
    <section class="w-card w-pad">
      <div class="w-toolbar">
        <select class="w-select w-fsel" id="tr-lang" aria-label="Language to edit">${D.languages.map(l => html`<option value="${l.code}" ${l.code === D.lang ? 'selected' : ''}>${l.name}</option>`)}</select>
        <select class="w-select w-fsel" id="tr-group" aria-label="Part"><option value="">All parts</option>${groups.map(g => html`<option ${R.group === g ? 'selected' : ''}>${g}</option>`)}</select>
        <input class="w-input w-search" id="tr-q" type="search" placeholder="Search texts…" value="${R.q}" aria-label="Search texts">
        <span class="w-hint">${missing ? missing + ' not translated yet' : 'All ' + D.keys.length + ' texts translated'}</span>
      </div>
      <div id="tr-list">${list.map(k => { const v = trValue(k), st = k.key in R.dirty ? 'changed' : k.custom != null ? 'custom' : k.auto ? 'auto-translated' : v ? 'built-in' : 'missing';
        return html`<div class="w-tr ${st}"><div class="w-tr-head"><span class="w-hint">${k.group}</span>
          <span class="w-badge ${st === 'missing' ? 'warn' : st === 'built-in' ? 'todo' : 'info'}">${st === 'missing' ? 'Uses English' : st}</span>
          ${k.custom != null || k.key in R.dirty ? html`<button class="w-linkbtn" data-act="trReset" data-k="${k.key}">${k.builtin || isEn ? 'Reset to built-in' : 'Clear'}</button>` : ''}</div>
          ${isEn ? '' : html`<div class="w-tr-en">${k.en}</div>`}
          <textarea class="w-textarea w-tr-in" data-tr="${k.key}" rows="${Math.min(8, Math.max(2, Math.ceil(k.en.length / 90) + (k.en.split('\n').length - 1)))}" placeholder="${isEn ? '' : 'Type the ' + D.languages.find(l => l.code === D.lang).name + ' text (empty = English is used)'}">${v}</textarea>
          ${k.placeholders.length ? html`<div class="w-hint">Keep: ${k.placeholders.map(x => html`<code>{${x}}</code> `)}</div>` : ''}</div>`; })}
        ${list.length ? '' : html`<div class="w-empty">No texts match.</div>`}</div>
    </section>
    <div class="w-savebar" id="trbar" ${nDirty ? '' : 'hidden'} role="status"><span id="trcount">${nDirty} unsaved change${nDirty === 1 ? '' : 's'}</span>
      <button class="w-btn" data-act="trDiscard">Discard</button><button class="w-btn primary" data-act="trSave">Save translations</button></div>`;
}
async function loadTr(lang) {
  S.tr = S.tr || { q: '', group: '', dirty: {} };
  const [d, x] = await Promise.all([call('GET', '/api/translations' + (lang ? '?lang=' + encodeURIComponent(lang) : '')), call('GET', '/api/translate')]);
  S.tr.data = d; S.tr.x = x; S.tr.dirty = {};
}
function autoCard() {
  const X = S.tr.x; if (!X) return '';
  const pct = X.limit ? Math.min(100, Math.round(X.usage.chars / X.limit * 100)) : 100, F = X.feed;
  const chans = S.channels.filter(c => c.id !== F.channel_id);
  return html`<section class="w-card w-pad"><h3 class="w-h3">Automatic translation (Google)</h3>
    <p class="w-sub" style="margin:4px 0 12px">Used only when someone asks: a player right-clicks a message → <b>Apps → Translate</b> (only they see it, in their Discord language),
      or you press “Translate missing … texts” below. Free up to 500,000 characters a month – the limit stops it before anything costs money.</p>
    ${X.key_set ? html`
      <div class="w-check"><div class="w-check-ic ok">${icon('check')}</div><div><div class="w-check-label">Google key saved (${X.key_hint})</div>
        <div class="w-check-detail">${X.usage.chars.toLocaleString()} of ${X.limit.toLocaleString()} characters used in ${X.usage.month}</div>
        <div class="w-meter-bar ${pct >= 90 ? 'bad' : pct >= 75 ? 'warn' : 'ok'}" style="margin-top:6px;max-width:360px"><i style="width:${pct}%"></i></div></div>
        <button class="w-btn small danger" data-act="trKeyRemove">Remove key</button></div>
      <div class="w-inline" style="margin-top:10px"><label class="w-label" for="trx-limit" style="margin:0">Monthly limit</label>
        <input class="w-input w-num" id="trx-limit" type="number" min="0" max="20000000" step="10000" value="${X.limit}" style="width:140px"><span class="w-hint">characters</span>
        <button class="w-btn small" data-act="trLimit">Save limit</button><div class="w-spacer"></div>
        ${S.tr.data.lang !== 'en' ? html`<button class="w-btn small primary" data-act="trFill">Translate missing ${S.tr.data.languages.find(l => l.code === S.tr.data.lang).name} texts</button>` : ''}</div>
      <div class="w-hint" style="margin-top:6px">Only manual: the bot never translates by itself. Pick a language in the editor below, then press the button – each language costs about 10,000 characters, once.</div>`
    : html`<div class="w-inline"><input class="w-input" id="trx-key" placeholder="Google API key (AIza…)" autocomplete="off" style="max-width:360px">
        <button class="w-btn primary" data-act="trKeySave">Save key</button></div>
      <div class="w-hint" style="margin-top:6px">How to get the key: bot guide → “Automatic translation”.</div>`}
    <div class="w-sect"><span class="w-label">Translation feed</span>
      <p class="w-hint" style="margin-bottom:10px">Messages from the language channels you tick are posted, translated, in one feed channel. <b>This translates every message automatically and uses the allowance fastest</b> – it is off unless you switch it on.</p>
      <label class="w-inline" style="gap:8px;margin-bottom:12px"><input type="checkbox" id="trx-on" ${X.feed_on ? 'checked' : ''}> <b>Feed switched on</b></label>
      <div class="w-form2"><div class="w-field"><label class="w-label" for="trx-feed">Feed channel</label>
        <select class="w-select" id="trx-feed"><option value="">– off –</option>${channelOptions(F.channel_id)}</select></div>
        <div class="w-field"><label class="w-label" for="trx-target">Translate into</label>
        <select class="w-select" id="trx-target">${S.tr.data.known.map(k => html`<option value="${k.code}" ${k.code === F.target ? 'selected' : ''}>${k.name}</option>`)}</select></div></div>
      <div class="w-label" style="margin:4px 0 6px">Channels to translate (${F.sources.length})</div>
      <div class="w-chanpick">${chans.map(c => html`<label><input type="checkbox" class="trx-src" value="${c.id}" ${F.sources.includes(c.id) ? 'checked' : ''}> #${c.name}${c.category ? html` <span class="w-hint">${c.category}</span>` : ''}</label>`)}</div>
      <div class="w-actions"><button class="w-btn" data-act="trFeedSave">Save feed</button></div></div>
  </section>`;
}
async function setLanguages(langs, def) {
  const body = { languages: langs.join('\n') }; if (def) body.default_language = def;
  const r = await call('PUT', '/api/settings', body); S.settings = r.settings; S.draft = Object.assign({}, r.settings);
  await loadTr(S.tr.data.lang in langs ? S.tr.data.lang : null); renderMain();
}

/* ---- suggestions ---- */
const SUG_LABEL = { new: 'Open', accepted: 'Accepted', rejected: 'Rejected' };
const SUG_BADGE = { new: 'todo', accepted: 'ok', rejected: 'bad' };
function sugChips() {
  const G = S.sugs, total = Object.values(G.counts).reduce((a, b) => a + b, 0);
  return html`<button class="w-chip" data-act="sugStatus" data-s="" aria-pressed="${String(G.status === '')}">All ${total}</button>
    ${Object.keys(SUG_LABEL).map(k => html`<button class="w-chip" data-act="sugStatus" data-s="${k}" aria-pressed="${String(G.status === k)}">${SUG_LABEL[k]} ${G.counts[k] || 0}</button>`)}`;
}
function sugList() {
  const G = S.sugs;
  if (!G.items.length) return html`<div class="w-empty">${G.loading ? 'Loading…' : 'No suggestions match.'}</div>`;
  return html`${G.items.map(x => html`<div class="w-sugrow${G.selecting && G.sel.includes(x.id) ? ' picked' : ''}" data-id="${x.id}">
    ${G.selecting ? html`<input type="checkbox" class="w-sugpick" data-act="sugPick" data-id="${x.id}" ${G.sel.includes(x.id) ? 'checked' : ''} aria-label="Select suggestion #${x.id}">` : ''}
    <div class="w-sugbody"><div class="w-sughead"><b>#${x.id}</b> <span class="w-sub">${x.author} · <time title="${full(x.created_at)}">${ago(x.created_at)}</time></span>
      <span class="w-badge ${SUG_BADGE[x.status]}">${SUG_LABEL[x.status]}</span></div>
      <p class="w-sugtext">${x.text}</p>
      ${trBox('suggestions', x.id)}
      ${x.status === 'rejected' && x.reason ? html`<div class="w-hint" style="margin:-4px 0 10px">💬 Reason sent: ${x.reason}</div>` : ''}
      ${x.status === 'new' ? html`<div class="w-changes" id="rej-${x.id}" hidden><label class="w-label" for="rr-${x.id}">Why are you rejecting it?</label>${reasonBox('rr-' + x.id, SUG_REASON_KEYS, '')}
        <div class="w-inline" style="margin-top:8px"><span class="w-hint">The player gets this reason in their DM.</span><div class="w-spacer"></div><button class="w-btn small danger" data-act="sugDecide" data-id="${x.id}" data-s="rejected">Reject with this reason</button></div></div>` : ''}
      ${x.status === 'accepted' ? html`<div class="w-changes${x.changes ? ' done' : ''}">
        <label class="w-label" for="chg-${x.id}">🛠️ What we changed ${x.changes ? html`<span class="w-hint">· posted ${ago(x.changed_at)}${x.changed_by ? ' by ' + x.changed_by : ''}${x.changes_url ? html` · <a href="${x.changes_url}" target="_blank" rel="noopener">see in Discord</a>` : ''}</span>` : html`<span class="w-hint">– tell players what you actually changed</span>`}</label>
        <textarea class="w-textarea" id="chg-${x.id}" maxlength="1000" placeholder="e.g. Bear Trap now has a 10-minute warning in alliance chat (from version 1.34).">${x.changes || ''}</textarea>
        <div class="w-inline" style="margin-top:8px"><span class="w-hint">Posted as a reply under the suggestion in Discord${x.changes ? ' (updated in place)' : ' and sent to the player by DM'}.</span><div class="w-spacer"></div>
          <button class="w-btn small primary" data-act="sugChanges" data-id="${x.id}">${icon('send')} ${x.changes ? 'Update' : 'Post update'}</button></div></div>` : ''}
      <div class="w-inline">${x.status === 'new' ? html`<button class="w-btn small" data-act="sugDecide" data-id="${x.id}" data-s="accepted">${icon('check')} Accept</button>
        <button class="w-btn small" data-act="sugReject" data-id="${x.id}">Reject…</button>` : ''}
        ${x.mod_url ? html`<a class="w-btn small" href="${x.mod_url}" target="_blank" rel="noopener">Open in Discord</a>` : ''}
        <div class="w-spacer"></div><button class="w-btn small danger" data-act="sugDelete" data-id="${x.id}">Delete</button></div></div></div>`)}`;
}
function sugSelBar() {
  const G = S.sugs; if (!G.selecting) return '';
  return html`<div class="w-selbar"><b>${G.sel.length} selected</b><div class="w-spacer"></div>
    <button class="w-btn small" data-act="sugSelAll">Select all shown</button>
    <label class="w-inline w-hint" style="gap:6px"><input type="checkbox" id="sug-discord" checked> Also delete their Discord messages</label>
    <button class="w-btn small danger" data-act="sugDelSel" ${G.sel.length ? '' : 'disabled'}>Delete ${G.sel.length || ''} selected</button></div>`;
}
function viewSuggestions() {
  const G = S.sugs;
  return html`
    <div class="w-pagehead"><h2>Suggestions</h2><p>Ideas from players. Accept or reject them here or with ✅ / ❌ in the mod channel.</p></div>
    <section class="w-card w-pad">
      <div class="w-toolbar"><div class="w-chips" id="sugchips" role="group" aria-label="Filter by status">${sugChips()}</div></div>
      <div class="w-toolbar">
        <input class="w-input w-search" id="sugq" type="search" placeholder="Search text, player or #number…" value="${G.q}" aria-label="Search suggestions">
        <button class="w-btn small" data-act="sugRefresh">${icon('refresh')} Refresh</button><div class="w-spacer"></div>
        <button class="w-btn small" data-act="sugSelect" id="sugselbtn">${G.selecting ? 'Cancel selecting' : 'Select to delete'}</button>
      </div>
      <div id="sugselbar">${sugSelBar()}</div>
      <div id="suglist">${sugList()}</div>
      <div class="w-actions" style="justify-content:center"><button class="w-btn" id="sugmore" data-act="sugMore" ${G.items.length >= G.total ? 'hidden' : ''}>Load more</button></div>
    </section>`;
}
function renderSugList() {
  const l = $('#suglist'); if (!l) return;
  l.innerHTML = String(sugList()); $('#sugchips').innerHTML = String(sugChips()); $('#sugselbar').innerHTML = String(sugSelBar());
  $('#sugselbtn').textContent = S.sugs.selecting ? 'Cancel selecting' : 'Select to delete';
  const m = $('#sugmore'); if (m) m.hidden = S.sugs.items.length >= S.sugs.total;
}
async function loadSugs(reset) {
  const G = S.sugs; if (G.loading) return; G.loading = true;
  try {
    const qs = new URLSearchParams({ limit: '25', offset: String(reset ? 0 : G.items.length) });
    if (G.status) qs.set('status', G.status); if (G.q) qs.set('q', G.q);
    const r = await call('GET', '/api/suggestions?' + qs);
    G.items = reset ? r.items : G.items.concat(r.items); G.total = r.total; G.counts = r.counts;
  } catch (e) { toast(e.message, 'err'); }
  G.loading = false; renderSugList();
}

/* ---- insights ---- */
function weeklyChart(weeks) {
  const W = 640, H = 230, L = 34, R = 8, T = 16, Bt = 30, pw = W - L - R, ph = H - T - Bt;
  const top = Math.max(5, ...weeks.map(w => Math.max(w.reported, w.fixed)));
  const max = Math.ceil(top / 4) * 4, slot = pw / weeks.length, bw = Math.min(26, slot * 0.34);
  const y = v => T + ph - (v / max) * ph;
  const grid = [0, 0.5, 1].map(f => { const v = Math.round(max * f); return `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--w-border)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; }).join('');
  const bars = weeks.map((w, i) => {
    const cx = L + slot * i + slot / 2, d = new Date(w.start * 1000), lab = d.getDate() + '/' + (d.getMonth() + 1);
    const bar = (v, dx, col) => `<rect x="${cx + dx}" y="${y(v)}" width="${bw}" height="${Math.max(0, T + ph - y(v))}" rx="3" style="fill:var(${col})"/>` +
      (v ? `<text x="${cx + dx + bw / 2}" y="${y(v) - 4}" text-anchor="middle">${v}</text>` : '');
    return bar(w.reported, -bw - 1, '--w-accent') + bar(w.fixed, 1, '--w-ok') + `<text x="${cx}" y="${H - 10}" text-anchor="middle">${lab}</text>`;
  }).join('');
  return raw(`<svg class="w-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bug reports and fixes per week, last ${weeks.length} weeks">${grid}${bars}</svg>`);
}
function memberChart(items) {
  const W = 640, H = 230, L = 44, R = 10, T = 16, Bt = 28, pw = W - L - R, ph = H - T - Bt;
  const vals = items.map(i => i.members), lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max(2, Math.ceil((hi - lo) * 0.15)), min = Math.max(0, lo - pad), max = hi + pad;
  const x = i => L + (items.length < 2 ? pw / 2 : pw * i / (items.length - 1)), y = v => T + ph - ((v - min) / (max - min || 1)) * ph;
  const grid = [0, 0.5, 1].map(f => { const v = Math.round(min + (max - min) * f); return `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--w-border)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; }).join('');
  const pts = items.map((it, i) => x(i).toFixed(1) + ',' + y(it.members).toFixed(1)).join(' ');
  const area = `${x(0).toFixed(1)},${T + ph} ${pts} ${x(items.length - 1).toFixed(1)},${T + ph}`;
  const step = Math.max(1, Math.round((items.length - 1) / 4));
  const labs = items.map((it, i) => (i % step === 0 || i === items.length - 1) && (items.length - 1 - i >= step * 0.6 || i === items.length - 1) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === items.length - 1 ? 'end' : 'middle'}">${it.day.slice(8)}/${it.day.slice(5, 7)}</text>` : '').join('');
  const dots = items.map((it, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(it.members).toFixed(1)}" r="${items.length > 45 ? 3 : 4}" style="fill:var(--w-accent);opacity:${i === items.length - 1 ? 1 : 0}" class="w-dot-pt"><title>${it.day}: ${it.members} members (+${it.joins} / −${it.leaves})</title></circle>`).join('');
  return raw(`<svg class="w-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Server members over the last ${items.length} days">${grid}
    <defs><linearGradient id="wmg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--w-accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--w-accent)" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${area}" fill="url(#wmg)"/><polyline points="${pts}" fill="none" style="stroke:var(--w-accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labs}</svg>`);
}
function memberCard(M) {
  if (!M || M.items.length < 2) return html`<section class="w-card w-pad"><h3 class="w-h3">Member growth</h3>
    <div class="w-empty">Tracking has started. The chart fills in as the days pass.</div></section>`;
  const net = M.items[M.items.length - 1].members - M.items[Math.max(0, M.items.length - 30)].members;
  return html`<div class="w-tiles w-tiles4">
      <div class="w-card w-tile"><i class="w-tic">${icon('userplus')}</i><b>${M.current}</b><span>Members now</span></div>
      <div class="w-card w-tile ok"><i class="w-tic">${icon('check')}</i><b>+${M.joined}</b><span>Joined, last 30 days</span></div>
      <div class="w-card w-tile bad"><i class="w-tic">${icon('circle')}</i><b>−${M.left}</b><span>Left, last 30 days</span></div>
      <div class="w-card w-tile ${net >= 0 ? 'ok' : 'bad'}"><i class="w-tic">${icon('chart')}</i><b>${net >= 0 ? '+' : '−'}${Math.abs(net)}</b><span>Net change, 30 days</span></div>
    </div>
    <section class="w-card w-pad"><h3 class="w-h3">Member growth</h3>
      ${memberChart(M.items)}
      ${M.estimated ? html`<p class="w-hint" style="margin-top:6px">Days before the bot started tracking are estimated from join dates, so members who already left are not included there.</p>` : ''}
    </section>`;
}
function fmtHours(h) { if (h == null) return '–'; return h >= 48 ? (h / 24).toFixed(1) + ' days' : h >= 1 ? h + ' h' : Math.round(h * 60) + ' min'; }
function viewInsights() {
  const I = S.insights, B = S.overview.stats.bugs;
  if (!I) return html`<div class="w-pagehead"><h2>Insights</h2></div><div class="w-card w-pad w-empty">Loading…</div>`;
  const sum = k => I.weeks.reduce((a, w) => a + w[k], 0);
  const seg = [['Awaiting moderators', B.awaiting, '--w-muted'], ['With admins', B.with_admins, '--w-accent'], ['Being investigated', B.investigating, '--w-warn'],
    ['Fixed', B.fixed, '--w-ok'], ['Rejected', B.rejected, '--w-bad']];
  const tile = (n, l, c) => html`<div class="w-card w-tile ${c || ''}"><b>${n}</b><span>${l}</span></div>`;
  const staffCols = [['passed', 'Passed'], ['rejected', 'Rejected'], ['investigating', 'Info tickets'], ['being_investigated', 'Investigating'], ['fixed', 'Fixed'],
    ['admin_rejected', 'Rejected (admin)'], ['suggestion_accepted', '💡 Accepted'], ['suggestion_rejected', '💡 Rejected'], ['replied', 'Replies']]
    .filter(c => !isMod() || !c[0].startsWith('suggestion'));
  return html`
    <div class="w-pagehead"><h2>${isMod() ? 'Bug stats' : 'Insights'}</h2><p>How the bug reports are flowing, and who is doing the work.</p></div>
    <div class="w-tiles w-tiles4">
      ${tile(fmtHours(I.fix_hours), 'Average time to fix' + (I.fix_count ? ' (' + I.fix_count + ' bugs)' : ''))}
      ${tile(sum('reported'), 'Reported, last ' + I.weeks.length + ' weeks')}
      ${tile(sum('fixed'), 'Fixed, last ' + I.weeks.length + ' weeks', 'ok')}
      ${tile(I.duplicates, 'Closed as duplicates')}
    </div>
    ${isMod() ? '' : memberCard(I.members)}
    <section class="w-card w-pad"><h3 class="w-h3">Reports per week</h3>
      ${weeklyChart(I.weeks)}
      <div class="w-legend"><span><i class="w-sw" style="background:var(--w-accent)"></i>Reported</span><span><i class="w-sw" style="background:var(--w-ok)"></i>Fixed</span></div>
    </section>
    <section class="w-card w-pad"><h3 class="w-h3">Where the bugs are now</h3>
      <div class="w-stack" role="img" aria-label="Bugs by status">${seg.map(s => html`<i style="width:${B.total ? (s[1] / B.total * 100) : 0}%;background:var(${s[2]})" title="${s[0]}: ${s[1]}"></i>`)}</div>
      <div class="w-legend">${seg.map(s => html`<span><i class="w-sw" style="background:var(${s[2]})"></i>${s[0]} ${s[1]}</span>`)}</div>
    </section>
    <section class="w-card w-pad"><h3 class="w-h3">Bugs by area</h3><p class="w-sub" style="margin-bottom:8px">Where the game hurts most. Click an area to see its bugs.</p>
      ${I.areas && I.areas.length ? html`<div class="w-tablewrap"><table class="w-table"><thead><tr><th>Area</th><th>Reports</th><th>Open</th><th>Fixed</th><th style="width:34%"></th></tr></thead><tbody>
        ${I.areas.map(a => html`<tr><td><button class="w-linkbtn" data-act="areaGo" data-v="${a.name}">${a.name}</button></td><td>${a.total}</td><td>${a.open}</td><td>${a.fixed}</td>
        <td><div class="w-stack" style="height:8px"><i style="width:${a.total ? a.fixed / a.total * 100 : 0}%;background:var(--w-ok)"></i><i style="width:${a.total ? a.open / a.total * 100 : 0}%;background:var(--w-accent)"></i></div></td></tr>`)}</tbody></table></div>` : html`<div class="w-empty">No data yet.</div>`}
    </section>
    <section class="w-card w-pad"><h3 class="w-h3">Bugs by game version</h3>
      ${I.versions && I.versions.length ? html`<div class="w-tablewrap"><table class="w-table"><thead><tr><th>Version</th><th>Reports</th><th>Fixed</th></tr></thead><tbody>
        ${I.versions.map(v => html`<tr><td>${v.name}</td><td>${v.total}</td><td>${v.fixed}</td></tr>`)}</tbody></table></div>` : html`<div class="w-empty">No versions recorded yet. Set the current version under Bug bot → Bug reports.</div>`}
    </section>
    <section class="w-card w-pad"><h3 class="w-h3">Top reporters</h3><p class="w-sub" style="margin-bottom:8px">“Accepted” = a moderator passed the bug on to the admins. A high share means useful reports.</p>
      ${I.reporters.length ? html`<div class="w-tablewrap"><table class="w-table"><thead><tr><th>Player</th><th>Reports</th><th>Accepted</th><th>Fixed</th><th>Rejected</th><th>Quality</th></tr></thead><tbody>
        ${I.reporters.map(r => html`<tr><td>${r.name}</td><td>${r.total}</td><td>${r.accepted}</td><td>${r.fixed}</td><td>${r.rejected}</td><td>${r.total ? Math.round(r.accepted / r.total * 100) + '%' : '–'}</td></tr>`)}</tbody></table></div>` : html`<div class="w-empty">No reports yet.</div>`}
    </section>
    <section class="w-card w-pad"><h3 class="w-h3">Staff activity</h3><p class="w-sub" style="margin-bottom:8px">What each moderator and admin has handled (from the day this version was installed).</p>
      ${I.staff.length ? html`<div class="w-tablewrap"><table class="w-table"><thead><tr><th>Name</th>${staffCols.map(c => html`<th>${c[1]}</th>`)}<th>Total</th></tr></thead><tbody>
        ${I.staff.map(s => html`<tr><td>${s.name}</td>${staffCols.map(c => html`<td>${s.counts[c[0]] || '–'}</td>`)}<td><b>${s.total}</b></td></tr>`)}</tbody></table></div>` : html`<div class="w-empty">Nothing recorded yet.</div>`}
    </section>`;
}

/* ---- data & backups ---- */
const fmtBytes = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
function driveCard(G) {
  if (!G) return '';
  return html`<section class="w-card w-pad"><div class="w-sec-head"><h3 class="w-h3">Google Drive</h3>
      ${G.configured ? html`<button class="w-btn small primary" data-act="driveNow">${icon('upload')} Copy to Google Drive now</button>` : ''}</div>
    ${G.configured ? html`<div class="w-check"><div class="w-check-ic ${G.last_error ? 'warn' : 'ok'}">${icon(G.last_error ? 'alert' : 'check')}</div>
        <div><div class="w-check-label">Connected${G.account ? ' to ' + G.account : ''}</div>
        <div class="w-check-detail">${G.last_ok ? 'Last copy ' + ago(G.last_ok) + ' (' + G.last_name + ')' : 'No copy yet'} · every ${S.settings.drive_every_days} day(s), newest ${S.settings.drive_keep} kept${S.settings.drive_enabled ? '' : ' · switched off under Data & backups'}</div>
        ${G.last_error ? html`<div class="w-check-detail" style="color:var(--w-warn)">Last try ${ago(G.last_try)}: ${G.last_error}</div>` : ''}</div>
        ${G.folder_url ? html`<a class="w-btn small" href="${G.folder_url}" target="_blank" rel="noopener">Open folder</a>` : ''}</div>`
      : html`<p class="w-sub">Not connected. A copy of the database outside the server protects you if the server is ever lost.
        Follow “Backups to Google Drive” in the bot guide (about 10 minutes, one time).</p>`}
  </section>`;
}
function viewData() {
  const D = S.data;
  if (!D) return html`<div class="w-pagehead"><h2>Data</h2></div><div class="w-card w-pad w-empty">Loading…</div>`;
  return html`
    <div class="w-pagehead"><h2>Data</h2><p>The bot keeps everything in one small database file. A copy is saved every day.</p></div>

/* ---- live data: every tab switch fetches fresh data; the open page refreshes itself in the background ---- */
function liveBar() {
  return html`<div class="w-livebar" role="status"><span class="w-live-dot${S.syncing ? ' busy' : S.syncErr ? ' err' : ''}" aria-hidden="true"></span>
    <span id="w-updated">${liveText()}</span><button class="w-btn small" data-act="refresh" title="Get the newest data now">${icon('refresh')} Refresh</button></div>`;
}
function liveText() {
  if (S.syncing) return 'Updating…';
  if (S.syncErr) return 'Offline – retrying';
  if (!S.syncedAt) return 'Live';
  const s = Math.round((Date.now() - S.syncedAt) / 1000);
  return 'Updated ' + (s < 5 ? 'just now' : s < 60 ? s + ' s ago' : Math.round(s / 60) + ' min ago');
}
function setLive() {
  const bar = $('.w-livebar'); if (!bar) return;
  bar.querySelector('#w-updated').textContent = liveText();
  bar.querySelector('.w-live-dot').className = 'w-live-dot' + (S.syncing ? ' busy' : S.syncErr ? ' err' : '');
}
function paint(t) {
  const m = $('#wosd-main'); if (!m) return;
  m.innerHTML = String(liveBar()) + String(hubTabs()) + String(VIEWS[t || S.tab]());
  if ($('#savebar')) updateSaveBar();
  if (S.tab === 'log') renderLogList();
  if (S.tab === 'bugs' && S.bugs.items) renderBugList();
  if (S.tab === 'suggestions' && S.sugs.items) renderSugList();
}
// True while someone is typing or has something open – then new data waits instead of wiping their input.
function editing() {
  const m = $('#wosd-main'); if (!m) return false;
  if ($('#wmodal') || S.tmEdit || S.rmEdit || S.replyEdit) return true;
  const a = document.activeElement;
  if (a && m.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  return [...m.querySelectorAll('input:not([type=checkbox]):not([type=radio]), textarea')].some(e => e.value !== e.defaultValue)
    || [...m.querySelectorAll('select:not([multiple])')].some(e => { const d = [...e.options].findIndex(o => o.defaultSelected); return e.selectedIndex !== (d < 0 ? 0 : d); });
}
async function syncCore() {
  const [overview, health, st, ch, q] = await Promise.all([call('GET', '/api/overview'), call('GET', '/api/health'),
    call('GET', '/api/settings'), call('GET', '/api/channels'), call('GET', '/api/queue').then(q => q && q.raid ? q : null, () => null)]);
  S.overview = overview; S.health = health; S.channels = ch.channels; S.queue = q;
  if (st) {   // keep unsaved changes, take everything else from the server
    const fresh = st.settings;
    Object.keys(fresh).forEach(k => { if (S.draft[k] === S.settings[k]) S.draft[k] = fresh[k]; });
    S.settings = fresh; S.panelInfo = st.panel;
  }
  S.coreAt = Date.now();
}
let syncSeq = 0;
async function syncTab(manual, opened) {
  const t = S.tab, n = ++syncSeq;
  S.syncing = true; S.syncErr = false; setLive();
  try {
    const list = t === 'bugs' || t === 'suggestions';
    const listOk = list && !(t === 'bugs' ? S.bugs.selecting || S.bugs.items.length > 25 : S.sugs.selecting || S.sugs.items.length > 25);
    await Promise.all([manual || Date.now() - (S.coreAt || 0) > 4000 ? syncCore() : null,
      !list && LOADERS[t] ? LOADERS[t]() : null,
      listOk && (manual || opened || !editing()) ? (t === 'bugs' ? loadBugs(true) : loadSugs(true)) : null]);
  } catch (e) { S.syncErr = true; if (manual) toast(e.message, 'err'); }
  S.syncing = false;
  if (n !== syncSeq) return;
  if (opened && S.tab === t) { paint(t); setLive(); refreshNavCount(); return; }   // just opened: nothing typed yet, show the fresh data
  if (!S.syncErr) S.syncedAt = Date.now();
  const busyEditing = editing();
  if (S.tab === t && !busyEditing) { paint(t); const tb = $('.w-tabbar'); if (tb && S.overview) tb.outerHTML = String(tabBar()); refreshNavCount(); }
  else { setLive(); refreshNavCount(); if (manual && busyEditing) toast('Got the newest data – the page updates when you’ve finished editing.'); }
  if (S.tab === 'bot' && t === 'bot') loadStickerImgs();
}
function refreshNavCount() {
  const mq = S.queue ? S.queue.reports + S.queue.appeals : 0, mb = $('.w-nav [data-hub="moderation"]');
  if (mb) { let e2 = mb.querySelector('.w-count'); if (!mq) { if (e2) e2.remove(); } else { if (!e2) { e2 = document.createElement('em'); e2.className = 'w-count'; mb.appendChild(e2); } e2.textContent = mq; } }
  const n = S.overview && S.overview.stats.bugs.awaiting, b = $('.w-nav [data-hub="bugs"]'); if (!b) return;
  let em = b.querySelector('.w-count'); if (!n) { if (em) em.remove(); return; }
  if (!em) { em = document.createElement('em'); em.className = 'w-count'; b.appendChild(em); } em.textContent = n;
}

// Number ticker: the overview numbers count up once per visit (skipped when the person prefers less motion).
function tick(scope) {
  if (S.ticked || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const els = $$('[data-tick]', scope); if (!els.length) return;
  S.ticked = true;
  const t0 = performance.now(), dur = 900;
  els.forEach(e => { e.dataset.to = e.dataset.tick; e.textContent = '0'; });
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), k = 1 - Math.pow(1 - p, 3);
    els.forEach(e => { e.textContent = String(Math.round(+e.dataset.to * k)); });
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function renderTab() {
  const main = $('#wosd-main'); if (!main) return;
  paint(S.tab);
  if (S.tab === 'overview') tick(main);
  S.hubLast = S.hubLast || {}; S.hubLast[hubOf(S.tab)[0]] = S.tab;

const PHONE_TABS = ['overview', 'bugs', 'suggestions', 'codes'];
function navList() { return NAV.filter(n => !isMod() || MOD_TABS.includes(n[0])); }
function tabBar() {
  const o = S.overview, more = !PHONE_TABS.includes(S.tab);
  return html`<nav class="w-tabbar" aria-label="Sections">${navList().filter(n => PHONE_TABS.includes(n[0])).map(n => html`<button data-act="nav" data-tab="${n[0]}" aria-current="${n[0] === S.tab ? 'page' : 'false'}">${icon(n[2])}<span>${n[0] === 'suggestions' ? 'Ideas' : n[0] === 'codes' ? 'Codes' : n[1]}</span>${n[0] === 'bugs' && o.stats.bugs.awaiting ? html`<em class="w-count">${o.stats.bugs.awaiting}</em>` : ''}</button>`)}
    <button data-act="sheet" aria-current="${more ? 'page' : 'false'}" aria-haspopup="dialog">${icon('grid')}<span>${more ? hubName(hubOf(S.tab)) : 'More'}</span></button></nav>`;
}
function openSheet() {
  closeSheet();
  const hubs = HUBS.filter(h => h !== '|' && hubKids(h).length);
  root.insertAdjacentHTML('beforeend', String(html`<div class="w-sheetbg" id="wsheet" data-act="sheetBg"><div class="w-sheet" role="dialog" aria-modal="true" aria-label="All sections">
    <i class="w-grab" aria-hidden="true"></i>
    <button class="w-search-btn" data-act="palette">${icon('search')}<span>Search pages or open bug #…</span></button>
    <div class="w-sheetgrid">${hubs.map(h => html`<button data-act="hub" data-hub="${h[0]}" aria-current="${hubOf(S.tab)[0] === h[0] ? 'page' : 'false'}">${icon(h[2])}<span>${hubName(h)}</span></button>`)}</div>
    <div class="w-sidefoot"><button class="w-btn small" data-act="refresh">${icon('refresh')} Refresh</button><button class="w-btn small" data-act="logout">${S.user ? 'Log out' : 'Disconnect'}</button></div>
  </div></div>`));
}
function closeSheet() { const x = $('#wsheet'); if (x) x.remove(); }
/* Quick jump (Ctrl/⌘ K): pages, and #number opens that bug. */
function openPalette() {
  closeSheet(); closePalette();
  root.insertAdjacentHTML('beforeend', String(html`<div class="w-palbg" id="wpal" data-act="palBg"><div class="w-pal" role="dialog" aria-modal="true" aria-label="Quick jump">
    <input class="w-palin" id="palq" placeholder="Go to a page, or type a bug number…" autocomplete="off" aria-label="Search">
    <div class="w-pallist" id="pall" role="listbox"></div><div class="w-palfoot"><span>↑↓ to choose</span><span>Enter to open</span><span>Esc to close</span></div></div></div>`));
  S.pal = { i: 0, items: [] }; palDraw(); const q = $('#palq'); if (q) q.focus();
}
function closePalette() { const x = $('#wpal'); if (x) x.remove(); S.pal = null; }
function palDraw() {
  const q = ($('#palq') ? $('#palq').value : '').trim().toLowerCase(), num = q.replace(/^#/, '');
  const items = [];
  if (/^\d{1,6}$/.test(num)) items.push({ kind: 'bug', id: +num, label: 'Open bug #' + num, ic: 'bug' });

function cropBanner(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const W = 1360, H = 480, r = Math.max(W / img.width, H / img.height), c = document.createElement('canvas');
      c.width = W; c.height = H;
      c.getContext('2d').drawImage(img, (W - img.width * r) / 2, (H - img.height * r) / 2, img.width * r, img.height * r);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => reject(new Error("That file isn't a readable image."));
    img.src = url;
  });
}
function cropAvatar(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement('canvas');
      c.width = c.height = 512;
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 512, 512);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => reject(new Error("That file isn't a readable image."));
    img.src = url;
  });
}

async function downloadBackup(name) {
  if (S.demo) return toast('Downloads are not available in the demo.', 'warn');
  let res;
  try { res = await fetch(S.base.replace(/\/+$/, '') + '/api/backups/' + encodeURIComponent(name), { headers: { Authorization: 'Bearer ' + S.key } }); }
  catch (e) { throw new Error("Can't reach the bot to download the file."); }
  if (!res.ok) throw new Error('The download failed (' + res.status + ').');
  const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob()); a.download = name;
  root.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
async function exportCsv(what) {
  let blob;
  if (S.demo) {
    const r = await api('GET', '/api/bugs?limit=100');
    const rows = [['id', 'status', 'summary', 'reporter']].concat(r.items.map(b => [b.id, b.status, b.summary, b.reporter]));
    blob = new Blob(['\ufeff' + rows.map(x => x.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n')], { type: 'text/csv' });
  } else {
    let res;
    try { res = await fetch(S.base.replace(/\/+$/, '') + '/api/export/' + what, { headers: { Authorization: 'Bearer ' + S.key } }); }
    catch (e) { throw new Error("Can't reach the bot to download the file."); }
    if (!res.ok) throw new Error('The download failed (' + res.status + ').');
    blob = await res.blob();
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = what;
  root.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('Downloaded ' + what + '.');
}
