<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c121b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png">
<title>WOS EU1 – Staff</title>
<style>
/* =====================================================================================================
   WOS EU1 staff dashboard v2 – built around the daily work (see docs/superpowers/specs/…-staff-dashboard-v2-design.md)
   Look: the players' website's brand – Figtree for text, Unbounded for page titles, the orange "heat" gradient for the
   single main action, ice blue for links and focus. Dark mode is the website's navy night; light mode a clean snowfield.
   Status always has a word or an icon, never colour alone.
   ===================================================================================================== */
@font-face{font-family:'Unbounded';font-style:normal;font-weight:200 900;font-display:swap;src:url(fonts/unbounded.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:'Figtree';font-style:normal;font-weight:300 900;font-display:swap;src:url(fonts/figtree.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:'Figtree';font-style:normal;font-weight:300 900;font-display:swap;src:url(fonts/figtree-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0,U+2C60-2C7F,U+A720-A7FF}
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5; --text:#111827; --muted:#5b6474; --line:#dfe3ea; --line-2:#cbd2dc;
  --accent:#e8590c; --accent-ink:#ffffff; --accent-soft:#fdeee5; --ice:#0e7490; --ice-soft:#e2f3f7;
  --ok:#15803d; --ok-soft:#e6f4ea; --warn:#a16207; --warn-soft:#fbf2dc; --bad:#c2261d; --bad-soft:#fbe9e7;
  --shadow:0 1px 2px rgba(17,24,39,.06),0 8px 24px -12px rgba(17,24,39,.18);
  --r-sm:8px; --r:10px; --r-lg:14px;
  --font:'Figtree',system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --display:'Unbounded','Figtree',system-ui,sans-serif;
  --heat-grad:linear-gradient(135deg,#ff8a3d,#ffb14e);
  --rail:84px; --pane:min(520px,42vw);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#060c17; --surface:#0f1a2c; --surface-2:#15233a; --text:#e8f0fa; --muted:#8a9dba; --line:#1c2b42; --line-2:#2a3d5a;
  --accent:#ff8a3d; --accent-ink:#1d0e03; --accent-soft:#3a2214; --ice:#7de3f4; --ice-soft:#10303d;
  --ok:#5be0a8; --ok-soft:#10301f; --warn:#ffc15e; --warn-soft:#3a2f12; --bad:#ff6b81; --bad-soft:#3e1a22;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-text-size-adjust:100%}
body{min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ice)}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- buttons and fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:6px 13px;border-radius:var(--r);border:1px solid var(--line-2);
  background:var(--surface);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
a.btn{text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.main{background:var(--heat-grad);border-color:transparent;color:#1d0e03;box-shadow:0 6px 18px -8px rgba(255,138,61,.6)}
.btn.main:hover{filter:brightness(1.06)}
.btn.ok{color:var(--ok)}.btn.bad{color:var(--bad)}
.btn.go{color:var(--ice);border-color:color-mix(in srgb,var(--ice) 45%,var(--line-2))}
.btn.go:hover{background:var(--ice-soft)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.icon{padding:0;width:36px}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.field label.check{font-size:14px;font-weight:500;color:var(--text);display:inline-flex;align-items:center;gap:8px}
.in{width:100%;min-height:38px;padding:7px 11px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--text)}
textarea.in{min-height:84px;resize:vertical;line-height:1.45}
.in:focus{outline:2px solid var(--ice);outline-offset:0;border-color:transparent}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1}

/* ---------- status words ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:650;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.ice{background:var(--ice-soft);color:var(--ice)}
.tag.hot{background:var(--accent-soft);color:var(--accent)}

/* ---------- app frame: rail · page (list + pane) ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100dvh}
.rail{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:14px 8px;border-right:1px solid var(--line);background:var(--surface)}
.rail .logo{width:40px;height:40px;border-radius:12px;margin:0 auto 14px;display:block;object-fit:cover;background:var(--surface-2)}
.rail a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:var(--r);color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:650}
.rail a .ic{width:21px;height:21px}
.rail a:hover{background:var(--surface-2);color:var(--text)}
.rail a[aria-current="page"]{background:var(--ice-soft);color:var(--text)}
.rail a[aria-current="page"] .ic{color:var(--ice)}
.badge{position:absolute;top:3px;right:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:750;line-height:18px;text-align:center}
.rail .foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.me{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface-2)}

.page{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.02em}
.top .count{color:var(--muted);font-weight:600;font-size:15px}
.search{display:flex;align-items:center;gap:8px;min-width:220px;min-height:36px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.search kbd{margin-left:auto;font:600 11px var(--font);padding:1px 6px;border:1px solid var(--line-2);border-radius:5px}
.body{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.body.split{grid-template-columns:minmax(0,1fr) var(--pane)}
.content{min-width:0;padding:18px 24px 48px}
.pane{position:sticky;top:61px;height:calc(100dvh - 61px);overflow:auto;border-left:1px solid var(--line);background:var(--surface)}

/* ---------- lists ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{min-height:32px;padding:4px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip .num{opacity:.7;margin-left:4px}
.group{margin:0 0 22px}
.group>h2{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:13px;font-weight:700;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.item{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:start;padding:13px 16px 13px 20px;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item[aria-selected="true"]{background:var(--ice-soft)}
.item::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--heat,transparent)}
.item.urgent{--heat:var(--accent)}.item.warm{--heat:color-mix(in srgb,var(--accent) 45%,transparent)}
.item .what{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.item .title{margin:2px 0 0;font-weight:650;font-size:15px;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.split .item{grid-template-columns:minmax(0,1fr)}.split .item .acts{justify-content:flex-start}
.item .text{margin:3px 0 0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.item time{font-size:12.5px;color:var(--muted);white-space:nowrap}
.reason{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.reason .in{flex:1;min-width:200px}
.done{opacity:.75}
.done .item{cursor:default}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.more{display:flex;justify-content:center;padding:14px}
details.fold>summary{list-style:none;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}

/* ---------- pane ---------- */
.pane-head{position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;gap:10px;padding:16px 20px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.pane-head h2{margin:0;font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.pane-body{padding:16px 20px 32px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin:6px 0 0}
.sec{margin:0 0 20px}
.sec>h3{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--muted)}
.report{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-2);border-radius:var(--r);padding:12px 14px;font-size:14.5px}
.report .q{display:block;color:var(--muted);font-size:12.5px;margin-top:8px}.report .q:first-child{margin-top:0}
.actbar{display:flex;flex-wrap:wrap;gap:8px}
.files{display:flex;flex-wrap:wrap;gap:8px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{position:relative;display:grid;grid-template-rows:auto auto;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);overflow:hidden;cursor:zoom-in;text-align:left;color:var(--text)}
.thumb img,.thumb .ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.thumb .ph .ic{width:30px;height:30px}.thumb.video .ph{background:#111;color:#fff}.thumb.file{cursor:pointer}
.thumb .cap{padding:6px 8px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface);border-top:1px solid var(--line)}
.thumb:hover{border-color:var(--line-2)}.thumb:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.thumb.gone{cursor:default}.thumb.gone::before{content:"Removed from the bot";display:grid;place-items:center;aspect-ratio:4/3;font-size:12.5px;color:var(--muted)}
.viewer{position:fixed;inset:0;z-index:100;display:grid;grid-template-rows:auto 1fr;background:rgba(6,9,14,.97);color:#fff}
.vbar{display:flex;align-items:center;gap:10px;padding:10px 14px}.vbar .hint{color:#c9d1dc}.vname{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50vw}
.vstage{position:relative;display:grid;place-items:center;min-height:0;padding:0 56px 20px}.vstage img,.vstage video{max-width:100%;max-height:calc(100vh - 90px);object-fit:contain;border-radius:6px;background:#000}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:34px;cursor:pointer}
.vnav.prev{left:8px}.vnav.next{right:8px}.vnav:hover{background:rgba(255,255,255,.22)}
@media (max-width:700px){.thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}.vstage{padding:0 8px 12px}.vnav{width:38px;height:52px;background:rgba(0,0,0,.45)}}
.file{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer}
.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:4px 2px}
.msg{max-width:88%;padding:8px 12px;border-radius:12px;background:var(--surface-2);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.staff{align-self:flex-end;background:var(--ice-soft)}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:12.5px;text-align:center}
.msg .who{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.composer{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sim{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.sim:first-child{border-top:0}
.score{flex:none;width:44px;text-align:center;font-weight:750;color:var(--warn)}
.hist{font-size:13px;color:var(--muted);display:grid;gap:3px}
.tr{margin-top:8px;padding:10px 12px;border-left:3px solid var(--ice);background:var(--ice-soft);border-radius:0 var(--r) var(--r) 0;font-size:14px;white-space:pre-wrap}
.blank{display:grid;place-items:center;height:100%;padding:24px;text-align:center;color:var(--muted)}

/* ---------- cards (Community / More) ---------- */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:6px}
.fig{background:var(--surface);padding:14px 16px}.fig b{display:block;font-size:22px;font-weight:750;letter-spacing:-.01em}.fig span{font-size:13px;color:var(--muted)}
.fig.ok b{color:var(--ok)}.fig.bad b{color:var(--bad)}.fig.warn b{color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.tblwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td:first-child{width:40%}.tbl th,.tbl td{padding:9px 14px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl thead th{border-top:0;font-size:12.5px;color:var(--muted);font-weight:650}.tbl .n{text-align:right}
.chart{width:100%;max-width:820px;height:auto;display:block;margin:0 auto}.chart text{font-size:11px;fill:var(--muted)}.chart .gl{stroke:var(--line)}
.b-rep{fill:var(--ice);background:var(--ice)}.b-fix{fill:var(--ok);background:var(--ok)}.chart .line{fill:none;stroke:var(--ice);stroke-width:2.5;stroke-linejoin:round}.chart .area{fill:var(--ice-soft);stroke:none}
.legend{display:inline-flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);align-items:center}.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2)}.stack i,.sw{background:var(--line-2)}
.stack .muted,.sw.muted{background:var(--line-2)}.stack .ice,.sw.ice{background:var(--ice)}.stack .warn,.sw.warn{background:var(--warn)}.stack .ok,.sw.ok{background:var(--ok)}.stack .bad,.sw.bad{background:var(--bad)}
.sw.b-rep{background:var(--ice)}.sw.b-fix{background:var(--ok)}
.meter{margin:4px 0 14px}.meter:last-child{margin-bottom:2px}.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.logrow{display:grid;grid-template-columns:74px auto minmax(0,1fr);gap:10px;align-items:baseline;padding:10px 16px;border-top:1px solid var(--line)}.logrow:first-child{border-top:0}.logrow p{margin:0;overflow-wrap:anywhere}.logrow .tag{justify-self:start}
@media (max-width:700px){.logrow{grid-template-columns:auto minmax(0,1fr)}.logrow p{grid-column:1/-1}}
.settings{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.snav{position:sticky;top:76px;display:grid;gap:10px}.snav ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}.snav .sgsel{display:none}
.snav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.snav a:hover{background:var(--surface-2);color:var(--text)}.snav a[aria-current="page"]{background:var(--ice-soft);color:var(--text)}.snav a[aria-current="page"] .ic{color:var(--ice)}
.sbody{display:grid;gap:16px;padding-bottom:80px}.sset{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 18px 6px}
.sset h3{margin:0 0 6px;font-size:15px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.sset h3+.srow,.sset .hint+.srow{border-top:0}
.srow[hidden]{display:none}.srow.wide{grid-template-columns:minmax(0,1fr) minmax(0,300px);align-items:start}.srow.act{grid-template-columns:auto;border-top:0;padding-top:4px}
.slab label{font-weight:650;font-size:14.5px}.slab p{margin:2px 0 0;font-size:13px;color:var(--muted);max-width:62ch}
.unit{min-width:86px}@media (max-width:860px){.unit{min-width:0}}
.chanctl{display:grid;gap:6px;justify-items:end;width:100%}
.switch{position:relative;display:inline-block;width:44px;height:26px;flex:none}.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:13px;background:var(--line-2);transition:background .15s}.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+span{background:var(--ok)}.switch input:checked+span::after{transform:translateX(18px)}.switch input:focus-visible+span{outline:2px solid var(--ice);outline-offset:2px}
.savebar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:10px;width:min(560px,calc(100vw - 24px));padding:10px 12px 10px 18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(0,0,0,.18);font-weight:650}
.savebar[hidden]{display:none}
@media (max-width:860px){.settings{grid-template-columns:minmax(0,1fr)}.snav{position:static}.snav ul{display:none}.snav .sgsel{display:block}

/* ---- insights */
function weeksChart(weeks) {
  const W = 640, H = 210, L = 30, R = 6, T = 14, Bt = 26, pw = W - L - R, ph = H - T - Bt;
  const max = Math.ceil(Math.max(4, ...weeks.map(w => Math.max(w.reported, w.fixed))) / 4) * 4, slot = pw / weeks.length, bw = Math.min(22, slot * 0.32), y = v => T + ph - v / max * ph;
  const grid = [0, 0.5, 1].map(f => { const v = Math.round(max * f); return `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; }).join('');
  const bars = weeks.map((w, i) => { const cx = L + slot * i + slot / 2, d = new Date(w.start * 1000);
    const bar = (v, dx, cls) => `<rect x="${cx + dx}" y="${y(v)}" width="${bw}" height="${Math.max(0, T + ph - y(v))}" rx="3" class="${cls}"><title>${v}</title></rect>`;
    return bar(w.reported, -bw - 1, 'b-rep') + bar(w.fixed, 1, 'b-fix') + `<text x="${cx}" y="${H - 8}" text-anchor="middle">${d.getDate()}/${d.getMonth() + 1}</text>`; }).join('');
  return raw(`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bug reports and fixes per week">${grid}${bars}</svg>`);
}
function membersChart(items) {
  const W = 640, H = 190, L = 40, R = 6, T = 12, Bt = 24, pw = W - L - R, ph = H - T - Bt, v = items.map(i => i.members);
  const pad = Math.max(2, Math.ceil((Math.max(...v) - Math.min(...v)) * 0.15)), lo = Math.max(0, Math.min(...v) - pad), hi = Math.max(...v) + pad;
  const x = i => L + pw * i / Math.max(1, items.length - 1), y = n => T + ph - (n - lo) / (hi - lo || 1) * ph;
  const pts = items.map((it, i) => x(i).toFixed(1) + ',' + y(it.members).toFixed(1)).join(' ');
  const grid = [0, 0.5, 1].map(f => { const n = Math.round(lo + (hi - lo) * f); return `<line x1="${L}" x2="${W - R}" y1="${y(n)}" y2="${y(n)}" class="gl"/><text x="${L - 6}" y="${y(n) + 4}" text-anchor="end">${n}</text>`; }).join('');
  const labs = [0, Math.floor((items.length - 1) / 2), items.length - 1].map((i, k) => `<text x="${x(i)}" y="${H - 6}" text-anchor="${['start', 'middle', 'end'][k]}">${items[i].day.slice(5).replace('-', '/')}</text>`).join('');
  return raw(`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Server members over the last ${items.length} days">${grid}<polyline points="${x(0)},${T + ph} ${pts} ${x(items.length - 1)},${T + ph}" class="area"/><polyline points="${pts}" class="line"/>${labs}</svg>`);
}

}
const checkRow = (ok, label, detail) => html`<div class="sim"><span class="tag ${ok === true ? 'ok' : ok === false ? 'bad' : 'warn'}">${ok === true ? 'OK' : ok === false ? 'Problem' : 'Check'}</span><div class="grow"><p style="margin:0;font-weight:600">${label}</p><p class="hint" style="margin:2px 0 0">${detail}</p></div></div>`;

    ${figs([[B.online ? 'Online' : 'Offline', 'Discord bot' + (B.latency_ms != null ? ' · ' + B.latency_ms + ' ms' : ''), B.online ? 'ok' : 'bad'], [fmtDur(B.uptime_s), 'Bot running since restart'], [fmtDur(Y.uptime_s), 'Server running since reboot'],

let edTimer;

const roleName = id => { const r = (S.roles || []).find(x => x.id === String(id)); return r ? '@' + r.name : 'deleted role'; };
const roleOptions = (sel, onlyAssignable) => html`<option value="">— None —</option>${(S.roles || []).map(r => html`<option value="${r.id}" ${r.id === String(sel || '') ? 'selected' : ''} ${onlyAssignable && !r.assignable ? 'disabled' : ''}>@${r.name}${onlyAssignable && !r.assignable ? ' (above the bot)' : ''}</option>`)}`;

async function publishPanel(btn) {
  const d = S.panelDraft;
  if (!d.channel_id) return toast('Choose the bug report channel first.', 'err');
  if (!d.title.trim() || !d.text.trim()) return toast("The title and message can't be empty.", 'err');
  busy(btn, true, 'Publishing…');
  try {
    const r = await call('POST', '/api/panel', { title: d.title.trim(), text: d.text.trim(), channel_id: d.channel_id });
    Object.assign(S.settings, { report_channel_id: d.channel_id, panel_title: d.title.trim(), panel_text: d.text.trim() });
    S.draft.report_channel_id = d.channel_id;
    S.health = await call('GET', '/api/health');
    toast('Panel published in ' + r.channel_name + '.'); renderTab();
  } catch (e) { busy(btn, false); toast(e.message, 'err'); }
}

async function saveBot(btn) {
  const d = S.botDraft, b = S.bot, body = {};
  if (d.username.trim() && d.username.trim() !== b.username) body.username = d.username.trim();
  if (d.nickname.trim() !== (b.nickname || '')) body.nickname = d.nickname.trim();
  if (d.status !== b.status) body.status = d.status;
  if (d.activity_type !== b.activity_type) body.activity_type = d.activity_type;
  if (d.activity_text.trim() !== (b.activity_text || '')) body.activity_text = d.activity_text.trim();
  if (d.avatar) body.avatar = d.avatar;

    renderApp();

  } catch (e) { busy(btn, false); toast(e.message, 'err'); }
}
function cropBanner(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const W = 1360, H = 480, r = Math.max(W / img.width, H / img.height), c = document.createElement('canvas');
      c.width = W; c.height = H;
      c.getContext('2d').drawImage(img, (W - img.width * r) / 2, (H - img.height * r) / 2, img.width * r, img.height * r);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => reject(new Error("That file isn't a readable image."));
    img.src = url;
  });
}
function cropAvatar(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement('canvas');
      c.width = c.height = 512;
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 512, 512);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => reject(new Error("That file isn't a readable image."));
    img.src = url;
  });
}

/* ---- posts */

  return html`
    ${sectionHead('Patch notes', html`<span class="hint">${plural(P.unreleased.length, 'fixed bug')} not announced yet</span>`)}
    <div class="list"><div class="item" style="cursor:default"><div>${P.unreleased.length ? html`<p class="title">Ready to announce</p>
        ${P.unreleased.slice(0, 8).map(b => html`<p class="text" style="-webkit-line-clamp:1"><a href="#bug-${b.id}">#${b.id}</a> ${b.summary}</p>`)}${P.unreleased.length > 8 ? html`<p class="hint">and ${P.unreleased.length - 8} more</p>` : ''}
        <form class="reason" data-act-submit="patchPublish" style="margin-top:10px"><label class="sr" for="pn-title">Title</label><input class="in" id="pn-title" maxlength="120" value="${P.default_title || ''}">
          <button class="btn sm go" type="submit">${icon('send')} Publish patch notes</button></form>`

      ${(P.history || []).slice(0, 3).map(h => html`<div class="item" style="cursor:default"><div><div class="what"><span>${ago(h.ts)}</span><span>${h.by}</span></div><p class="text">${h.title} · ${plural(h.count, 'bug')}</p></div></div>`)}</div>

    ${sectionHead('Timed messages', html`<span class="hint">${T.timezone || ''}</span><button class="btn sm go" data-act="timerEdit">${icon('plus')} New timed message</button>`)}
    <div class="list">${T.items.length ? T.items.map(t => html`<div class="item" style="cursor:default"><div>
        <div class="what"><span class="tag ${t.enabled ? (t.next_run ? 'ok' : '') : ''}">${t.enabled ? (t.next_run ? 'On' : 'Done') : 'Paused'}</span><span>${timerWhen(t)}</span><span>${chanName(t.channel_id)}</span>${t.role_id ? html`<span>${roleName(t.role_id)}</span>` : ''}</div>
        <p class="title">${t.name}</p><p class="text">${t.next_run && t.enabled ? 'Next: ' + when(t.next_run) : t.last_run ? 'Last posted ' + ago(t.last_run) : ''}</p></div>
      <div class="acts"><label class="check"><input type="checkbox" data-act-change="timerToggle" data-id="${t.id}" ${t.enabled ? 'checked' : ''}> On</label>
        <button class="btn sm" data-act="timerSend" data-id="${t.id}">${icon('send')} Post now</button><button class="btn sm" data-act="timerEdit" data-id="${t.id}">Edit</button>
        <button class="btn sm bad" data-act="timerDel" data-id="${t.id}" data-name="${t.name}" aria-label="Delete ${t.name}">${icon('x')}</button></div></div>`)
      : html`<div class="empty"><b>No timed messages</b>Post reminders like “Bear Hunt in 30 minutes” on a schedule.</div>`}</div>

    ${sectionHead('Giveaways', html`<button class="btn sm go" data-act="gwNew">${icon('plus')} Start a giveaway</button>`)}
    <div class="list">${running.length || ended.length ? running.concat(ended).map(g => html`<div class="item" style="cursor:default"><div>
        <div class="what"><span class="tag ${g.ended ? '' : 'ok'}">${g.ended ? 'Ended' : 'Running'}</span><span>${g.ended ? ago(g.ends_at) : 'ends ' + when(g.ends_at)}</span><span>${plural(g.winners, 'winner')}</span>${g.ended ? html`<span>${plural(g.entries, 'entry', 'entries')}</span>` : ''}</div>
        <p class="title">${g.prize}</p>${g.winner_names && g.winner_names.length ? html`<p class="text">Won by ${g.winner_names.join(', ')}</p>` : ''}</div>
      <div class="acts">${g.url ? html`<a class="btn sm ghost" href="${g.url}" target="_blank" rel="noopener">${icon('ext')} Discord</a>` : ''}
        ${g.ended ? html`<button class="btn sm" data-act="gwDo" data-a="reroll" data-id="${g.id}">${icon('refresh')} New winner</button>` : html`<button class="btn sm" data-act="gwDo" data-a="end" data-id="${g.id}">End now</button>`}</div></div>`)
      : html`<div class="empty"><b>No giveaways</b>Players react 🎉 to enter; the bot picks the winners.</div>`}</div>

    ${PT ? html`${sectionHead('Promoter servers', html`<span class="hint">${plural(PT.summary.servers, 'server')} · ${PT.summary.members} members</span><button class="btn sm go" data-act="ptInvite">${icon('plus')} Invite link</button>`)}
      ${(PT.invites || []).length ? html`<div class="note">${PT.invites.map(i => html`<div class="row">Open invite for <b>${i.promoter}</b><span class="hint">link works until ${when(i.expires_ts)}</span><div class="grow"></div><button class="btn sm ghost" data-act="ptRevoke" data-id="${i.id}">Revoke</button></div>`)}</div>` : ''}
      <div class="list">${PT.items.length ? PT.items.slice().sort((a, b) => ((b.issues || []).length - (a.issues || []).length)).map(x => html`<div class="item ${x.issues && x.issues.length ? 'warm' : ''}" style="cursor:default"><div>
          <div class="what"><span class="tag ${x.status === 'ok' ? 'ok' : x.status === 'paused' ? '' : 'warn'}">${{ ok: 'Working', paused: 'Paused', problem: 'Needs a fix', setup: 'Not set up' }[x.status] || x.status}</span>
            <span>${x.members || 0} members</span><span>${plural(x.posts_30d || 0, 'post')} in 30 days</span>${x.promoter ? html`<span>${x.promoter}</span>` : ''}</div>
          <p class="title">${x.name}</p>${(x.issues || []).length ? html`<p class="text" style="-webkit-line-clamp:3;color:var(--warn)">${x.issues.join(' · ')}</p>` : ''}</div>
        <div class="acts"><button class="btn sm" data-act="ptTest" data-id="${x.id}">${icon('send')} Test post</button><button class="btn sm" data-act="ptDm" data-id="${x.id}">${icon('message')} Send setup steps</button>
          <button class="btn sm" data-act="ptPause" data-id="${x.id}" data-on="${x.paused ? 0 : 1}">${x.paused ? 'Resume' : 'Pause'}</button>
          <button class="btn sm bad" data-act="ptRemove" data-id="${x.id}" data-name="${x.name}">${icon('x')} Remove</button></div></div>`)
        : html`<div class="empty"><b>No promoter servers yet</b>Make an invite link and send it to a promoter.</div>`}</div>` : ''}`;
}
function timerWhen(t) {
  if (t.kind === 'once') { const d = new Date(t.at); return isNaN(d) ? t.at : d.toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  if (t.kind === 'interval') return 'every ' + Math.round((t.every_minutes || 0) / 60) + ' h';
  return t.at + ' · ' + ((t.days || []).length === 7 ? 'every day' : (t.days || []).map(x => x[0].toUpperCase() + x.slice(1)).join(', '));
}

/* ---- sheets used by Community */
function openSheet(title, body) {

}
const chanOptions = sel => (S.channels || []).map(c => html`<option value="${c.id}" ${String(c.id) === String(sel || '') ? 'selected' : ''}>#${c.name}</option>`);
const roleOptions = sel => html`<option value="">No tag</option>${(S.roles || []).filter(r => r.assignable !== false || String(r.id) === String(sel)).map(r => html`<option value="${r.id}" ${String(r.id) === String(sel || '') ? 'selected' : ''}>@${r.name}</option>`)}`;
function timerSheet(t) {
  const E = S.tmEdit = Object.assign({ id: null, name: '', channel_id: (S.channels && S.channels[0] && S.channels[0].id) || '', content: '', kind: 'daily', at: '19:30', days: DAYS.map(x => x[0]), every_minutes: 360, role_id: '', delete_previous: false, enabled: true }, t || {});
  openSheet(E.id ? 'Edit timed message' : 'New timed message', html`<form data-act-submit="timerSave">
    <div class="field"><label for="tm-name">Name (only staff see it)</label><input class="in" id="tm-name" maxlength="80" value="${E.name}" required></div>
    <div class="field"><label for="tm-msg">Message</label><textarea class="in" id="tm-msg" maxlength="1900" required>${E.content}</textarea></div>
    <div class="row"><div class="field grow"><label for="tm-chan">Channel</label><select class="in" id="tm-chan">${chanOptions(E.channel_id)}</select></div>
      <div class="field grow"><label for="tm-role">Tag</label><select class="in" id="tm-role">${roleOptions(E.role_id)}</select></div></div>
    <div class="field"><label for="tm-kind">When</label><select class="in" id="tm-kind" data-act-change="tmKind"><option value="once" ${E.kind === 'once' ? 'selected' : ''}>Once – on a date and time</option><option value="daily" ${E.kind === 'daily' ? 'selected' : ''}>Every day (or chosen days)</option><option value="interval" ${E.kind === 'interval' ? 'selected' : ''}>Again and again – every few hours</option></select></div>
    <div id="tm-when">${timerWhenFields(E)}</div>
    <label class="check" style="margin-bottom:14px"><input type="checkbox" id="tm-del" ${E.delete_previous ? 'checked' : ''}> Delete the previous post when posting a new one</label>
    <p class="hint" id="tm-err" role="alert" style="color:var(--bad)"></p>
    <div class="row"><div class="grow"></div><button class="btn ghost" type="button" data-act="closeSheet">Cancel</button><button class="btn main" type="submit">Save</button></div></form>`);
}
function timerWhenFields(E) {
  if (E.kind === 'once') return html`<div class="field"><label for="tm-at">Date and time</label><input class="in" id="tm-at" type="datetime-local" value="${/T/.test(E.at) ? E.at : ''}" required></div>`;
  if (E.kind === 'interval') return html`<div class="field"><label for="tm-every">Every … hours</label><input class="in" id="tm-every" type="number" min="1" max="168" value="${Math.round((E.every_minutes || 360) / 60)}" required></div>`;
  return html`<div class="field"><label for="tm-at">Time</label><input class="in" id="tm-at" type="time" value="${/^\d\d:\d\d$/.test(E.at) ? E.at : '19:30'}" required></div>
    <div class="chips" role="group" aria-label="Days">${DAYS.map(([k, l]) => html`<label class="chip" style="display:inline-flex;align-items:center;gap:6px"><input type="checkbox" class="tm-day" value="${k}" ${(E.days || []).includes(k) ? 'checked' : ''}>${l}</label>`)}</div>`;
}
function timerCollect() {
  const E = S.tmEdit;
  E.name = $('#tm-name').value.trim(); E.content = $('#tm-msg').value; E.channel_id = $('#tm-chan').value; E.role_id = $('#tm-role').value; E.kind = $('#tm-kind').value;
  E.delete_previous = $('#tm-del').checked;
  // read the fields that are on screen (they belong to the kind shown before a switch)
  if ($('#tm-every')) E.every_minutes = (parseInt($('#tm-every').value || '0', 10) || 0) * 60;
  if ($('#tm-at')) E.at = $('#tm-at').value;
  if ($$('.tm-day').length) E.days = $$('.tm-day').filter(x => x.checked).map(x => x.value);
  return E;
}

/* ============================================================ search (Ctrl K) */
function allPages() {
  return [['todo', 'To do'], ['bugs', 'Bugs'], ...(isMod() ? [] : [['ideas', 'Ideas']])].map(([k, l]) => ({ label: l, hint: 'Page', go: () => go(k) }))
    .concat(isMod() ? [] : SET_GROUPS.map(g => ({ label: g[1], hint: 'Settings', words: g[3].filter(x => x[0] !== '@').flatMap(n => FSEC[n].map(sec => sec.title)).join(' '), go: () => goSettings(g[0]) })))
    .concat(COMMUNITY.concat([MORE[0]]).flatMap(([g, cards]) => cards.filter(c => !isMod() || MOD_OK.includes(c[0])).map(c => c[4] ? { label: c[1], hint: (g === 'Stats' ? 'Stats' : 'Community · ' + g), words: c[2], go: () => (g === 'Stats' ? goMore : goComm)(c[4]) } : { label: c[1], hint: 'Settings', words: c[2], go: () => goSettings(SETUP_OF[c[0]][0], null, SETUP_OF[c[0]][1]) })))
    .concat(isMod() ? [] : SET_GROUPS.flatMap(g => g[3].filter(x => x[0] !== '@').flatMap(n => FSEC[n].flatMap(sec => sec.fields.filter(f => f.k).map(f => ({ label: f.label, hint: 'Settings · ' + g[1], words: sec.title, go: () => goSettings(g[0], f.k) }))))));
}
function openSearch() {
  closeSearch();
  root.insertAdjacentHTML('beforeend', '<div class="palette" id="pal" data-act="palBg"><div class="box" role="dialog" aria-modal="true" aria-label="Search"><input id="palq" placeholder="Search pages, #bug number, ideas or players" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="pall"><ul id="pall" role="listbox"></ul></div></div>');
  S.pal = { items: [], sel: 0, seq: 0 }; $('#palq').focus(); palFill('');
}
function closeSearch() { const p = $('#pal'); if (p) p.remove(); S.pal = null; }
async function palFill(qv) {
  const P = S.pal; if (!P) return; const seq = ++P.seq, ql = qv.trim().toLowerCase();
  const qq = ql.replace(/^#/, ''), rank = x => !qq ? 0 : x.label.toLowerCase().startsWith(qq) ? 0 : x.label.toLowerCase().includes(qq) ? 1 : 2;
  let items = allPages().filter(x => !ql || (x.label + ' ' + (x.words || '') + ' ' + x.hint).toLowerCase().includes(qq)).map((x, i) => [rank(x), i, x]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(r => r[2]).slice(0, 8);
  const m = ql.match(/^#?(\d+)$/);
  if (m) items = [{ label: 'Bug #' + m[1], hint: 'Open', pane: ['bug', +m[1]] }].concat(isMod() ? [] : [{ label: 'Idea #' + m[1], hint: 'Open', pane: ['idea', +m[1]] }]).concat(items);
  palPaint(items);
  if (ql.length >= 3 && !m) {
    try {
      const [b, pl, ideas] = await Promise.all([call('GET', '/api/bugs?limit=5&q=' + encodeURIComponent(ql)), call('GET', '/api/players/find?q=' + encodeURIComponent(ql)).catch(() => ({ items: [] })),
        isMod() ? Promise.resolve({ items: [] }) : call('GET', '/api/suggestions?limit=5&q=' + encodeURIComponent(ql))]);
      if (!S.pal || seq !== S.pal.seq) return;
      items = items.concat(b.items.map(x => ({ label: '#' + x.id + ' ' + x.summary, hint: 'Bug', pane: ['bug', x.id] })),
        ideas.items.map(x => ({ label: x.text.slice(0, 70), hint: 'Idea #' + x.id, pane: ['idea', x.id] })),
        pl.items.slice(0, 5).map(x => ({ label: x.name, hint: 'Player', pane: ['player', x.id] })));
      palPaint(items);
    } catch (e) { /* offline */ }
  }
}
function palPaint(items) {
  const P = S.pal; if (!P) return; P.items = items; P.sel = Math.min(P.sel, Math.max(0, items.length - 1));
  $('#pall').innerHTML = items.length ? items.map((x, i) => `<li role="option" data-i="${i}" aria-selected="${i === P.sel}">${esc(x.label)}<small>${esc(x.hint)}</small></li>`).join('') : '<li aria-disabled="true">Nothing found</li>';
}
function palPick(i) {
  const x = S.pal && S.pal.items[i]; if (!x) return; closeSearch();
  if (x.pane) { if (!['todo', 'bugs', 'ideas', 'community'].includes(S.place)) { S.place = x.pane[0] === 'player' ? 'community' : 'bugs'; load(S.place); } openPane(x.pane[0], x.pane[1]); }
  else if (x.href) location.href = x.href; else if (x.go) x.go();
}

  if (!act && el.classList.contains('item')) { if (e.target.closest('button, a, input, select, textarea, form')) return; const it = findItem(el.dataset.key); const p = it && paneOf(it); if (p) openPane(p[0], p[1]); else if (it) { S.sel = el.dataset.key; renderMain(); } return; }
  if (act === 'do') { const it = findItem(el.dataset.key); if (it) runAction(it, +el.dataset.n, undefined, el); }
  else if (act === 'reasonCancel') { S.reasonFor = null; renderMain(); }
  else if (act === 'filter') { S.todoFilter = el.dataset.f; renderMain(); }
  else if (act === 'closePane') closePane();
  else if (act === 'paneDo') {
    const d = S.paneData, ref = d.bug ? { status: d.bug.status, dup_suggest: d.bug.dup_suggest } : d.appeal ? { kind: d.appeal.kind } : {};
    const it = pseudoItem(el.dataset.kind, isNaN(+el.dataset.id) ? el.dataset.id : +el.dataset.id, ref), a = actionsFor(it)[+el.dataset.n];
    if (a[4] && a[4].settings) { goSettings(a[4].settings); return; }
    if (a[4] && a[4].reason) { S.paneReason = { kind: it.kind, id: it.id, n: +el.dataset.n, label: a[4].reason, name: a[0], tone: a[2], ref }; paintPane(); const f = $('#pwhy'); if (f) f.focus(); return; }
    await paneRun(it, a, undefined, el);
  }
  else if (act === 'paneReasonCancel') { S.paneReason = null; paintPane(); }
  else if (act === 'translate') {
    busy(el, true, '…');
    try { const r = await call('POST', '/api/' + el.dataset.kind + '/' + el.dataset.id + '/translate', { target: S.trLang }); if (S.paneData) { S.paneData.tr = r; paintPane(); } }
    catch (err) { busy(el, false); toast(err.message, 'err'); }

document.addEventListener('keydown', e => {
  if (S.viewer) { if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); closeViewer(); } else if (e.key === 'ArrowLeft') stepViewer(-1); else if (e.key === 'ArrowRight') stepViewer(1); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); S.pal ? closeSearch() : openSearch(); return; }
  if (S.pal) {
    if (e.key === 'Escape') closeSearch();
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); S.pal.sel = Math.max(0, Math.min(S.pal.items.length - 1, S.pal.sel + (e.key === 'ArrowDown' ? 1 : -1))); palPaint(S.pal.items); }
    else if (e.key === 'Enter') { e.preventDefault(); palPick(S.pal.sel); }
    return;
  }
  if (e.key === 'Escape' && $('#sheet')) { closeSheet(); return; }
  if (e.target.closest && e.target.closest('input, textarea, select')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === 'Escape') { if ($('#sheet')) closeSheet(); else if (S.open) closePane(); return; }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('item')) { e.target.click(); return; }
  if (e.key === 'j' || e.key === 'k') {
    const rows = $$('#main .item[data-key]'); if (!rows.length) return;
    let i = rows.findIndex(r => r.dataset.key === S.sel); i = i < 0 ? 0 : Math.max(0, Math.min(rows.length - 1, i + (e.key === 'j' ? 1 : -1)));

  }
});
root.addEventListener('click', e => { const li = e.target.closest && e.target.closest('#pall li[data-i]'); if (li) palPick(+li.dataset.i); });

async function boot() {

  if (h.tab) S.comm.tab = h.tab;

  if (h.sgroup) { S.set.group = h.sgroup; S.set.sub = h.ssub || ''; }

  call('GET', '/api/settings').then(r => { S.settings = r.settings; }).catch(() => {});

  setInterval(() => { if (!document.hidden && S.place === 'more' && S.more.tab === 'status' && !S.open) loadMore('status', true); }, 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadTodo(true); });
}
boot();
})();
