<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c121b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><link rel="icon" href="../icons/icon-192.png">
<title>WOS EU1 – Staff</title>
<style>
/* =====================================================================================================
   WOS EU1 staff dashboard v2 – built around the daily work (see docs/superpowers/specs/…-staff-dashboard-v2-design.md)
   Look: “snowfield” (light) and “polar night” (dark), following the device. One ember accent for the single main
   action on a screen, ice blue for links and focus. Status always has a word or an icon, never colour alone.
   ===================================================================================================== */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5; --text:#111827; --muted:#5b6474; --line:#dfe3ea; --line-2:#cbd2dc;
  --accent:#e8590c; --accent-ink:#ffffff; --accent-soft:#fdeee5; --ice:#0e7490; --ice-soft:#e2f3f7;
  --ok:#15803d; --ok-soft:#e6f4ea; --warn:#a16207; --warn-soft:#fbf2dc; --bad:#c2261d; --bad-soft:#fbe9e7;
  --shadow:0 1px 2px rgba(17,24,39,.06),0 8px 24px -12px rgba(17,24,39,.18);
  --r-sm:8px; --r:10px; --r-lg:14px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --rail:84px; --pane:min(520px,42vw);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c121b; --surface:#121a26; --surface-2:#182231; --text:#e6ebf2; --muted:#93a0b4; --line:#223042; --line-2:#2e3e54;
  --accent:#ff7a2f; --accent-ink:#1a0b02; --accent-soft:#3a2014; --ice:#67d4e8; --ice-soft:#123341;
  --ok:#4fd08a; --ok-soft:#123222; --warn:#f2c35b; --warn-soft:#3a2f12; --bad:#ff8577; --bad-soft:#3e1b1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-text-size-adjust:100%}
body{min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ice)}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- buttons and fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:6px 13px;border-radius:var(--r);border:1px solid var(--line-2);
  background:var(--surface);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.main:hover{filter:brightness(1.06)}
.btn.ok{color:var(--ok)}.btn.bad{color:var(--bad)}
.btn.go{color:var(--ice);border-color:color-mix(in srgb,var(--ice) 45%,var(--line-2))}
.btn.go:hover{background:var(--ice-soft)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.icon{padding:0;width:36px}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.in{width:100%;min-height:38px;padding:7px 11px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--text)}
textarea.in{min-height:84px;resize:vertical;line-height:1.45}
.in:focus{outline:2px solid var(--ice);outline-offset:0;border-color:transparent}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1}

/* ---------- status words ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:650;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.ice{background:var(--ice-soft);color:var(--ice)}
.tag.hot{background:var(--accent-soft);color:var(--accent)}

/* ---------- app frame: rail · page (list + pane) ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100dvh}
.rail{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:14px 8px;border-right:1px solid var(--line);background:var(--surface)}
.rail .logo{width:40px;height:40px;border-radius:12px;margin:0 auto 14px;display:block;object-fit:cover;background:var(--surface-2)}
.rail a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:var(--r);color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:650}
.rail a .ic{width:21px;height:21px}
.rail a:hover{background:var(--surface-2);color:var(--text)}
.rail a[aria-current="page"]{background:var(--ice-soft);color:var(--text)}
.rail a[aria-current="page"] .ic{color:var(--ice)}
.badge{position:absolute;top:3px;right:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:750;line-height:18px;text-align:center}
.rail .foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.me{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface-2)}

.page{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:19px;font-weight:750;letter-spacing:-.01em}
.top .count{color:var(--muted);font-weight:600;font-size:15px}
.search{display:flex;align-items:center;gap:8px;min-width:220px;min-height:36px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.search kbd{margin-left:auto;font:600 11px var(--font);padding:1px 6px;border:1px solid var(--line-2);border-radius:5px}
.body{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.body.split{grid-template-columns:minmax(0,1fr) var(--pane)}
.content{min-width:0;padding:18px 24px 48px}
.pane{position:sticky;top:61px;height:calc(100dvh - 61px);overflow:auto;border-left:1px solid var(--line);background:var(--surface)}

/* ---------- lists ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{min-height:32px;padding:4px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip .num{opacity:.7;margin-left:4px}
.group{margin:0 0 22px}
.group>h2{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:13px;font-weight:700;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.item{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:start;padding:13px 16px 13px 20px;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item[aria-selected="true"]{background:var(--ice-soft)}
.item::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--heat,transparent)}
.item.urgent{--heat:var(--accent)}.item.warm{--heat:color-mix(in srgb,var(--accent) 45%,transparent)}
.item .what{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.item .title{margin:2px 0 0;font-weight:650;font-size:15px;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.split .item{grid-template-columns:minmax(0,1fr)}.split .item .acts{justify-content:flex-start}
.item .text{margin:3px 0 0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.item time{font-size:12.5px;color:var(--muted);white-space:nowrap}
.reason{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.reason .in{flex:1;min-width:200px}
.done{opacity:.75}
.done .item{cursor:default}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.more{display:flex;justify-content:center;padding:14px}
details.fold>summary{list-style:none;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}

/* ---------- pane ---------- */
.pane-head{position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;gap:10px;padding:16px 20px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.pane-head h2{margin:0;font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.pane-body{padding:16px 20px 32px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin:6px 0 0}
.sec{margin:0 0 20px}
.sec>h3{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--muted)}
.report{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-2);border-radius:var(--r);padding:12px 14px;font-size:14.5px}
.report .q{display:block;color:var(--muted);font-size:12.5px;margin-top:8px}.report .q:first-child{margin-top:0}
.actbar{display:flex;flex-wrap:wrap;gap:8px}
.files{display:flex;flex-wrap:wrap;gap:8px}
.file{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer}
.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:4px 2px}
.msg{max-width:88%;padding:8px 12px;border-radius:12px;background:var(--surface-2);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.staff{align-self:flex-end;background:var(--ice-soft)}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:12.5px;text-align:center}
.msg .who{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.composer{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sim{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.sim:first-child{border-top:0}
.score{flex:none;width:44px;text-align:center;font-weight:750;color:var(--warn)}
.hist{font-size:13px;color:var(--muted);display:grid;gap:3px}
.tr{margin-top:8px;padding:10px 12px;border-left:3px solid var(--ice);background:var(--ice-soft);border-radius:0 var(--r) var(--r) 0;font-size:14px;white-space:pre-wrap}
.blank{display:grid;place-items:center;height:100%;padding:24px;text-align:center;color:var(--muted)}

/* ---------- cards (Community / More) ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);color:var(--text);text-decoration:none}
.card:hover{border-color:var(--line-2);background:var(--surface-2)}
.card .ic{width:22px;height:22px;color:var(--ice);margin-top:2px}
.card b{display:block;font-size:15px}.card span{font-size:13px;color:var(--muted)}
.section-title{font-size:13px;font-weight:700;color:var(--muted);margin:22px 0 10px}
.section-title:first-child{margin-top:0}
.note{padding:12px 14px;border-radius:var(--r);background:var(--surface-2);font-size:13.5px;color:var(--muted);margin-bottom:16px}

/* ---------- sheets, toasts, search ---------- */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(8,12,20,.42);display:grid;place-items:center;padding:16px}
.sheet{width:100%;max-width:520px;max-height:calc(100dvh - 32px);overflow:auto;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);padding:18px 20px 20px}
.sheet h2{margin:0 0 12px;font-size:17px}
.seg{display:flex;gap:4px;padding:3px;border-radius:var(--r);background:var(--surface-2);margin-bottom:14px}
.seg button{flex:1;min-height:34px;border:0;border-radius:8px;background:none;font-weight:650;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:grid;gap:8px;width:min(440px,calc(100vw - 24px))}
.toast{padding:11px 14px;border-radius:var(--r);background:var(--text);color:var(--bg);font-size:14px;box-shadow:var(--shadow)}
.toast.err{background:var(--bad);color:#fff}
.palette{position:fixed;inset:0;z-index:150;background:rgba(8,12,20,.42);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.palette .box{width:min(560px,100%);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;background:none;font-size:16px;outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.palette li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);cursor:pointer}
.palette li[aria-selected="true"]{background:var(--ice-soft)}
.palette li small{margin-left:auto;color:var(--muted)}
.login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login .box{width:min(380px,100%);text-align:center}
.login img{width:64px;height:64px;border-radius:18px}

/* ---------- phones ---------- */
@media (max-width:860px){
  :root{--rail:0px}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;justify-content:space-around;gap:0;padding:6px 4px;border-right:0;border-bottom:1px solid var(--line)}
  .rail .logo,.rail .foot{display:none}
  .rail a{flex:1;padding:6px 0;min-height:48px}
  .badge{right:calc(50% - 22px)}
  .app.inapp .rail{position:fixed;top:auto;bottom:0;left:0;right:0;border-bottom:0;border-top:1px solid var(--line);padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .app.inapp .page{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .toasts.inapp{bottom:calc(84px + env(safe-area-inset-bottom))}
  .top{top:0;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
  .app:not(.inapp) .top{top:61px}
  .search{min-width:0;width:40px;padding:0;justify-content:center}.search span,.search kbd{display:none}
  .content{padding:14px 12px 40px}
  .body.split{grid-template-columns:minmax(0,1fr)}
  .pane{position:fixed;inset:0;z-index:60;height:100dvh;border-left:0;padding-bottom:env(safe-area-inset-bottom)}
  .pane-head{padding-top:calc(14px + env(safe-area-inset-top))}
  .item{grid-template-columns:minmax(0,1fr);padding:13px 14px 13px 18px}
  .item .acts{justify-content:flex-start}
  .chips{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin-left:-12px;margin-right:-12px;padding:0 12px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;min-height:38px}
  .btn{min-height:42px}.btn.sm{min-height:38px}.btn.icon{width:42px}
  .in,select.in,textarea.in{font-size:16px;min-height:44px}
  .scrim{align-items:end;padding:0}
  .sheet{max-width:none;border-radius:var(--r-lg) var(--r-lg) 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
'use strict';
/* ============================================================ setup */
const CFG = window.WOS_DASHBOARD_CONFIG = window.WOS_DASHBOARD_CONFIG || {
  apiBase: "",            // "same-origin" when /api is on this site (the deploy script sets it), or the bot's address
  classic: "../"          // the current dashboard (Community and More link there during phase 1)
};
const Q = new URLSearchParams(location.search);
const root = document.getElementById('app');
const S = {
  base: CFG.apiBase === 'same-origin' ? location.origin : (CFG.apiBase || location.origin),
  demo: Q.has('demo'), user: null, overview: null, settings: null,
  place: 'todo', todo: null, todoFilter: 'all', done: [], open: null, sel: null,
  bugs: { items: [], total: 0, counts: {}, status: '', q: '', offset: 0, loading: false },
  ideas: { items: [], total: 0, counts: {}, status: 'new', q: '', loading: false },
  replies: null, channels: null, trLang: (() => { try { return localStorage.getItem('wos2.tr') || 'en'; } catch (e) { return 'en'; } })()
};
const inApp = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone || Q.has('app');

/* ============================================================ tiny helpers */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
class Raw { constructor(v) { this.v = v; } toString() { return this.v; } }
const raw = v => new Raw(v);
const part = v => v instanceof Raw ? v.v : Array.isArray(v) ? v.map(part).join('') : (v == null || v === false) ? '' : esc(v);
const html = (s, ...vals) => { let o = s[0]; vals.forEach((v, i) => { o += part(v) + s[i + 1]; }); return new Raw(o); };
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
const ICON = {
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  pin: '<path d="M12 17v5"/><path d="M9 10.76V6h6v4.76a2 2 0 0 0 1.11 1.79l1.78.9A2 2 0 0 1 19 15.24V17H5v-1.76a2 2 0 0 1 1.11-1.79l1.78-.9A2 2 0 0 0 9 10.76z"/><path d="M8 2h8"/>',
  more: '<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
  arrowup: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  message: '<path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  hash: '<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>',
  sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  bot: '<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 5v3M9 14h.01M15 14h.01"/><circle cx="12" cy="3.6" r="1.1"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  alert: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  circle: '<circle cx="12" cy="12" r="8"/>',
  refresh: '<path d="M21 12a9 9 0 0 1-15.5 6.2L3 16M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M3 21v-5h5"/>',

}
function palPaint(items) {
  const P = S.pal; if (!P) return; P.items = items; P.sel = Math.min(P.sel, Math.max(0, items.length - 1));
  $('#pall').innerHTML = items.length ? items.map((x, i) => `<li role="option" data-i="${i}" aria-selected="${i === P.sel}">${esc(x.label)}<small>${esc(x.hint)}</small></li>`).join('') : '<li aria-disabled="true">Nothing found</li>';
}
function palPick(i) {
  const x = S.pal && S.pal.items[i]; if (!x) return; closeSearch();
  if (x.pane) { if (!['todo', 'bugs', 'ideas'].includes(S.place)) { S.place = 'bugs'; load('bugs'); } openPane(x.pane[0], x.pane[1]); }
  else if (x.href) location.href = x.href; else if (x.go) x.go();
}

/* ============================================================ events */
root.addEventListener('click', async e => {
  const el = e.target.closest('[data-act], [data-go], [data-open], .item[data-key]'); if (!el) return;
  if (el.dataset.go) { e.preventDefault(); if (S.open) { S.open = null; stopChat(); } go(el.dataset.go); syncHash(); return; }
  const act = el.dataset.act;
  if (!act && el.dataset.open) { openPane(el.dataset.open, +el.dataset.id); return; }
  if (!act && el.classList.contains('item')) { if (e.target.closest('button, a, input, select, textarea, form')) return; const it = findItem(el.dataset.key); const p = it && paneOf(it); if (p) openPane(p[0], p[1]); else if (it) { S.sel = el.dataset.key; renderMain(); } return; }
  if (act === 'do') { const it = findItem(el.dataset.key); if (it) runAction(it, +el.dataset.n, undefined, el); }
  else if (act === 'reasonCancel') { S.reasonFor = null; renderMain(); }
  else if (act === 'filter') { S.todoFilter = el.dataset.f; renderMain(); }
  else if (act === 'closePane') closePane();
  else if (act === 'paneDo') {
    const d = S.paneData, ref = d.bug ? { status: d.bug.status, dup_suggest: d.bug.dup_suggest } : d.appeal ? { kind: d.appeal.kind } : {};
    const it = pseudoItem(el.dataset.kind, isNaN(+el.dataset.id) ? el.dataset.id : +el.dataset.id, ref), a = actionsFor(it)[+el.dataset.n];
    if (a[4] && a[4].link) { location.href = CFG.classic + '#' + a[4].link; return; }
    if (a[4] && a[4].reason) { S.paneReason = { kind: it.kind, id: it.id, n: +el.dataset.n, label: a[4].reason, name: a[0], tone: a[2], ref }; paintPane(); const f = $('#pwhy'); if (f) f.focus(); return; }
    await paneRun(it, a, undefined, el);
  }
  else if (act === 'paneReasonCancel') { S.paneReason = null; paintPane(); }
  else if (act === 'translate') {
    busy(el, true, '…');
    try { const r = await call('POST', '/api/' + el.dataset.kind + '/' + el.dataset.id + '/translate', { target: S.trLang }); if (S.paneData) { S.paneData.tr = r; paintPane(); } }
    catch (err) { busy(el, false); toast(err.message, 'err'); }
  }
  else if (act === 'file' || act === 'chatFile') {
    try { const u = await fileUrl(act === 'file' || el.dataset.kind === 'bug' ? 'bugs' : 'suggestions', el.dataset.id, el.dataset.fid); window.open(u, '_blank', 'noopener'); } catch (err) { toast(err.message, 'err'); }
  }
  else if (act === 'merge') {
    if (!confirm('Close #' + el.dataset.id + ' as a duplicate of #' + el.dataset.into + '?')) return;
    try { await call('PUT', '/api/bugs/' + el.dataset.id, { duplicate_of: +el.dataset.into, reason: 'This bug was already reported.' }); toast('Merged into #' + el.dataset.into); S.paneData = null; render(); loadTodo(true); }
    catch (err) { toast(err.message, 'err'); }
  }
  else if (act === 'dm') {
    const t = $('#dm').value.trim(); if (!t) return toast('Write the message first.', 'err');
    busy(el, true, 'Sending…'); try { await call('POST', '/api/bugs/' + el.dataset.id + '/reply', { text: t }); toast('Sent by DM'); $('#dm').value = ''; } catch (err) { toast(err.message, 'err'); } busy(el, false);
  }
  else if (act === 'ticketClose') {
    if (!confirm('Close the ticket? The conversation is saved with the bug.')) return;
    try { await call('POST', '/api/bugs/' + el.dataset.id + '/ticket/close', { note: '' }); toast('Ticket closed and saved with the bug'); S.paneData = null; stopChat(); render(); loadTodo(true); } catch (err) { toast(err.message, 'err'); }
  }
  else if (act === 'changes') {
    const t = $('#chg').value.trim(); if (!t) return toast('Write what changed first.', 'err');
    busy(el, true, 'Posting…'); try { await call('PUT', '/api/suggestions/' + el.dataset.id, { changes: t }); toast('Posted – players can see what changed'); S.paneData = null; render(); } catch (err) { busy(el, false); toast(err.message, 'err'); }
  }
  else if (act === 'bugStatus') { S.bugs.status = el.dataset.s; renderMain(); loadBugs(true); }
  else if (act === 'bugsMore') loadBugs(false);
  else if (act === 'ideaStatus') { S.ideas.status = el.dataset.s; renderMain(); loadIdeas(); }
  else if (act === 'new') openNew();
  else if (act === 'newTab') openNew(el.dataset.t);
  else if (act === 'closeSheet' || (act === 'sheetBg' && e.target === el)) closeSheet();
  else if (act === 'search') openSearch();
  else if (act === 'palBg' && e.target === el) closeSearch();
  else if (act === 'logout') { try { await call('POST', '/api/auth/logout'); } catch (err) { /* already out */ } location.reload(); }
});
async function paneRun(it, a, why, el) {
  if (el) busy(el, true, '…');
  try {
    const msg = await a[3](it, why); S.paneReason = null; toast(msg);
    S.done.push({ kind: it.kind, id: it.id, title: (S.paneData.bug && S.paneData.bug.summary) || (S.paneData.idea && S.paneData.idea.text) || KIND[it.kind][0], label: msg, ts: now() }); saveDone();
    if (S.todo) S.todo.items = S.todo.items.filter(i => !(paneOf(i) && paneOf(i)[0] === S.open.kind && paneOf(i)[1] === S.open.id && i.kind === it.kind));
    S.paneData = null; render(); loadTodo(true); if (S.place === 'bugs') loadBugs(true); if (S.place === 'ideas') loadIdeas();
  } catch (err) { if (el) busy(el, false); toast(err.message, 'err'); if (err.status === 400 || err.status === 404) { S.paneReason = null; S.paneData = null; render(); loadTodo(true); } }
}
root.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault(); const act = f.dataset.actSubmit, btn = f.querySelector('[type=submit]');
  if (act === 'reason') {
    const R = S.reasonFor, it = R && findItem(R.key), v = $('#why').value.trim();
    if (!it) return; if (!v && !R.optional) { $('#why').focus(); return toast('Write a short reason first.', 'err'); }
    runAction(it, R.n, v, btn);
  } else if (act === 'paneReason') {
    const R = S.paneReason, v = $('#pwhy').value.trim(); if (!R) return;
    const it = pseudoItem(R.kind, R.id, R.ref), a = actionsFor(it)[R.n];
    if (!v && !(a[4] && a[4].optional)) { $('#pwhy').focus(); return toast('Write a short reason first.', 'err'); }
    paneRun(it, a, v, btn);
  } else if (act === 'chatSend') {
    const ta = $('#chatmsg'), fi = $('#chatfiles'), text = ta.value.trim(), files = fi ? [...fi.files].slice(0, 4) : [];
    if (!text && !files.length) return toast('Write a message first.', 'err');
    const fd = new FormData(); fd.append('text', text); files.forEach(x => fd.append('files', x));
    busy(btn, true, 'Sending…');
    try { await call('POST', f.dataset.kind === 'bug' ? '/api/bugs/' + f.dataset.id + '/ticket/send' : '/api/suggestions/' + f.dataset.id + '/chat', fd); ta.value = ''; if (fi) fi.value = ''; busy(btn, false); startChat(f.dataset.kind, +f.dataset.id); loadTodo(true); }
    catch (err) { busy(btn, false); toast(err.message, 'err'); }
  } else if (act === 'newCode') {
    const code = $('#nc-code').value.trim(); if (!code) return;
    busy(btn, true, 'Adding…');
    try { const r = await call('POST', '/api/giftcodes', { code, reward: $('#nc-reward').value.trim(), hours: $('#nc-h').value ? +$('#nc-h').value : null, announce: $('#nc-ann').checked }); closeSheet(); toast(r.warning || 'Gift code ' + ((r.item && r.item.code) || code) + ' added'); }
    catch (err) { busy(btn, false); toast(err.message, 'err'); }
  } else if (act === 'newAnn') {
    const text = $('#na-text').value.trim(); if (text.length < 2) return;
    busy(btn, true, 'Posting…');
    try { const r = await call('POST', '/api/announce', { title: $('#na-title').value.trim(), text, channel_id: $('#na-ch').value, role_id: $('#na-tag').value, image: '', partners: $('#na-pt').checked }); closeSheet(); toast('Posted in #' + r.channel + (r.partners ? ' and ' + plural(r.partners, 'promoter server') : '')); }
    catch (err) { busy(btn, false); toast(err.message, 'err'); }
  } else if (act === 'newVer') {
    const v = $('#nv').value.trim(); if (!v) return;
    busy(btn, true, 'Saving…');
    try { await call('PUT', '/api/settings', { game_version: v }); if (S.settings) S.settings.game_version = v; closeSheet(); toast('Game version is now ' + v); }
    catch (err) { busy(btn, false); toast(err.message, 'err'); }
  }
});
root.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.actChange === 'canned') { const r = (S.replies || []).find(x => String(x.id) === el.value), ta = $('#' + el.dataset.target); if (r && ta) { ta.value = r.text.replace(/\{bug\}/g, '#' + (S.open ? S.open.id : '')).replace(/\{summary\}/g, S.paneData && S.paneData.bug ? S.paneData.bug.summary : ''); ta.focus(); } el.value = ''; }
});
root.addEventListener('toggle', e => { if (e.target.dataset && e.target.dataset.fold === 'done') S.doneOpen = e.target.open; }, true);
let searchTimer = null;
root.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'bq') { clearTimeout(searchTimer); searchTimer = setTimeout(() => { S.bugs.q = el.value.trim(); loadBugs(true); }, 300); }
  else if (el.id === 'iq') { clearTimeout(searchTimer); searchTimer = setTimeout(() => { S.ideas.q = el.value.trim(); loadIdeas(); }, 300); }
  else if (el.id === 'palq') palFill(el.value);
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); S.pal ? closeSearch() : openSearch(); return; }
  if (S.pal) {
    if (e.key === 'Escape') closeSearch();
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); S.pal.sel = Math.max(0, Math.min(S.pal.items.length - 1, S.pal.sel + (e.key === 'ArrowDown' ? 1 : -1))); palPaint(S.pal.items); }
    else if (e.key === 'Enter') { e.preventDefault(); palPick(S.pal.sel); }
    return;
  }
  if (e.key === 'Escape' && $('#sheet')) { closeSheet(); return; }
  if (e.target.closest && e.target.closest('input, textarea, select')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === 'Escape') { if ($('#sheet')) closeSheet(); else if (S.open) closePane(); return; }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('item')) { e.target.click(); return; }
  if (e.key === 'j' || e.key === 'k') {
    const rows = $$('#main .item[data-key]'); if (!rows.length) return;
    let i = rows.findIndex(r => r.dataset.key === S.sel); i = i < 0 ? 0 : Math.max(0, Math.min(rows.length - 1, i + (e.key === 'j' ? 1 : -1)));
    S.sel = rows[i].dataset.key; rows.forEach(r => r.setAttribute('aria-selected', String(r.dataset.key === S.sel))); rows[i].focus(); rows[i].scrollIntoView({ block: 'nearest' });
  }
});
root.addEventListener('click', e => { const li = e.target.closest && e.target.closest('#pall li[data-i]'); if (li) palPick(+li.dataset.i); });

/* ============================================================ loading and start */
function load(place) {
  if (place === 'todo') loadTodo();
  if (place === 'bugs') loadBugs(true);
  if (place === 'ideas') loadIdeas();
}
function renderLogin(msg) {
  root.innerHTML = String(html`<div class="login"><div class="box"><img src="../icons/icon-192.png" alt="">
    <h1 style="font-size:22px;margin:14px 0 6px">WOS EU1 staff</h1><p class="hint">${msg || 'Log in with your Discord account. Your staff role decides what you can see.'}</p>
    <a class="btn main" style="margin-top:14px" href="${S.base.replace(/\/+$/, '')}/api/auth/login?next=${encodeURIComponent(location.pathname)}">Log in with Discord</a>
    <p class="hint" style="margin-top:18px"><a href="${CFG.classic}">Open the current dashboard</a></p></div></div>`);
}
async function boot() {
  loadDone();
  try { S.user = await call('GET', '/api/auth/me'); }
  catch (e) { return renderLogin(e.status === 401 || e.status === 403 ? '' : e.message); }
  const h = readHash();
  if (h.place) S.place = h.place;
  if (h.pane) S.open = h.pane;
  try { S.overview = await call('GET', '/api/overview'); } catch (e) { /* the frame works without it */ }
  render(); syncHash(); load(S.place); if (S.place !== 'todo') loadTodo(true);
  call('GET', '/api/settings').then(r => { S.settings = r.settings; }).catch(() => {});
  call('GET', '/api/replies').then(r => { S.replies = r.items; }).catch(() => { S.replies = []; });
  setInterval(() => { if (!document.hidden && !$('#sheet')) loadTodo(true); }, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadTodo(true); });
}
boot();
})();
</script>
</body>
