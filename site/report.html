<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Report a bug – WOS EU1</title><meta name="theme-color" content="#060c17"><meta name="description" content="Tell the WOS EU1 team about a bug.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="WOS EU1">
<link rel="preload" href="fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css"></head><body>
<main>
  <h1 data-i="h1"></h1><p class="lead" data-i="lead"></p>
  <div class="layout">
    <div>
      <div class="chips" id="mode" role="group" hidden><button type="button" data-m="bug" aria-pressed="true" data-i="mBug"></button><button type="button" data-m="idea" aria-pressed="false" data-i="mIdea"></button></div>
      <form class="card" id="form" novalidate>
        <p class="closed" id="closedP" data-i="off" hidden></p>
        <div id="bugF">
        <div class="row">
          <div><label for="area" data-i="area"></label><select id="area" name="area"></select></div>
          <div><label for="ver" data-i="ver"></label><input id="ver" name="version" maxlength="30"></div>
        </div>
        <label for="title" data-i="ttl"></label><input id="title" name="title" maxlength="100" data-ph="ttlPh">
        <div id="sim" aria-live="polite"></div>
        <label for="desc" data-i="desc"></label><textarea id="desc" name="description" maxlength="1800" data-ph="descPh"></textarea>
        <div class="hint"><span data-i="descHint"></span><span id="cnt">0 / 1800</span></div>
        <label for="files"><span data-i="files"></span> <small data-i="filesHint"></small></label>
        <div class="drop" id="drop" role="button" tabindex="0"><span data-i="dropT"></span></div>
        <input id="files" type="file" multiple hidden accept="image/png,image/jpeg,image/gif,image/webp,video/mp4,video/webm,video/quicktime"><div class="files" id="flist"></div>
        <label for="contact"><span data-i="contact"></span> <small data-i="opt"></small></label><input id="contact" name="contact" maxlength="100" autocomplete="email">
        <div class="hint"><span data-i="contactHint"></span></div>
        </div>
        <div id="ideaF" hidden>
          <label for="idea" data-i="ideaL"></label><textarea id="idea" name="idea" maxlength="1800" data-ph="ideaPh"></textarea>
          <div class="hint"><span data-i="ideaHint"></span><span id="icnt">0 / 1800</span></div>
        </div>
        <div class="row" id="who">
          <div><label for="chief"><span data-i="chief"></span> <small data-i="opt"></small></label><input id="chief" name="chief_name" maxlength="50" autocomplete="off"></div>
          <div><label for="uid"><span data-i="uid"></span> <small data-i="opt"></small></label><input id="uid" name="uid" inputmode="numeric" maxlength="20" autocomplete="off"></div>
        </div>
        <div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
        <div class="btns" style="margin-top:22px"><button class="btn pri" type="submit" id="go" style="flex:1"></button></div>
        <div id="msg" role="status" aria-live="polite"></div>
      </form>
      <div class="card done" id="done" hidden><div class="big">✅</div><h2 data-i="okH"></h2><p class="muted" id="okT"></p><div id="follow" class="follow"></div>
        <div class="btns" style="justify-content:center"><button class="btn pri" id="again" type="button" data-i="again"></button><a class="btn" href="index.html" data-i="nav_home"></a></div></div>
    </div>
    <aside class="card" id="tips"><h3 data-i="tipsH"></h3><ul class="tips"><li data-i="tip1"></li><li data-i="tip2"></li><li data-i="tip3"></li><li data-i="tip4"></li></ul>
      <p class="muted" style="font-size:14px;margin:14px 0 0" id="ki"><a href="known-issues.html" data-i="kiLink"></a></p></aside>
  </div>
</main>
<script src="config.js"></script><script src="app.js"></script>
<script>
const S = {
 en: { follow: 'Follow your report', followT: 'If the team needs more information, they ask you on your report’s page – this site shows you a notice. Keep the link:', meAs: 'Sending as {name} on Discord – we can ask you questions and send you updates.', meLogin: 'Log in with Discord',
  meWhy: 'so we can ask you questions about your report and send you updates.', h1: 'Report a bug', lead: 'Tell us what went wrong. The more detail you give, the faster we can fix it.', chief: 'Chief name', uid: 'Player UID', opt: '(optional)', area: 'Area', ver: 'Game version',
  ttl: 'Short title', ttlPh: 'e.g. Horse sinks when mounted near water', desc: 'What happened?', descPh: 'What did you do, what did you expect, and what happened instead?', descHint: 'At least 20 characters.',
  files: 'Screenshots or video', filesHint: '(up to 4 files, 8 MB each)', dropT: 'Tap to add files, or drop them here', contact: 'Contact', contactHint: 'Only moderators see this. Leave it empty if you do not need a reply.',
  send: 'Send report', sending: 'Sending…', pick: 'Choose an area…', okH: 'Thank you!', ok: 'Your report was sent to our team.', again: 'Report another bug', off: 'Bug reports from the website are closed right now. Please use our Discord.',
  eTitle: 'Please write a short title (at least 5 characters).', eDesc: 'Please describe what happened (at least 20 characters).', eArea: 'Please choose an area.', eUid: 'The player UID should only contain numbers.',
  eFile: 'You can attach at most 4 files of 8 MB each.', tipsH: 'Tips for a good report', tip1: 'Check the known issues first.', tip2: 'Describe the steps so we can repeat the bug.', tip3: 'Screenshots and short videos help a lot.', tip4: 'One problem per report.',
  similar: 'This may already be reported:', similarNote: 'If it is the same problem, you do not need to send it again.', kiLink: 'Open the known issues list', in: 'fixed in', passed: 'Confirmed', being_investigated: 'Investigating', fixed: 'Fixed',
  mBug: '🐞 Report a bug', mIdea: '💡 Suggest an idea', h1Idea: 'Suggest an idea', leadIdea: 'Tell us what would make the game better. The team reads every idea.',
  ideaL: 'Your idea', ideaPh: 'What would you like to change or add, and why would it help players?', ideaHint: 'At least 20 characters.', sendIdea: 'Send idea',
  eIdea: 'Please describe your idea (at least 20 characters).' },
 pl: { follow: 'Śledź swoje zgłoszenie', followT: 'Jeśli zespół będzie potrzebował więcej informacji, zapyta na stronie Twojego zgłoszenia – ta strona pokaże Ci powiadomienie. Zachowaj link:', meAs: 'Wysyłasz jako {name} na Discordzie – możemy zadać ci pytania i wysyłać aktualizacje.', meLogin: 'Zaloguj się przez Discord',
  meWhy: 'aby móc zadać ci pytania o zgłoszenie i wysyłać aktualizacje.', h1: 'Zgłoś błąd', lead: 'Napisz, co poszło nie tak. Im więcej szczegółów, tym szybciej to naprawimy.', chief: 'Imię wodza', uid: 'UID gracza', opt: '(opcjonalnie)', area: 'Obszar', ver: 'Wersja gry',
  ttl: 'Krótki tytuł', ttlPh: 'np. Koń tonie przy wsiadaniu przy wodzie', desc: 'Co się stało?', descPh: 'Co zrobiłeś, czego się spodziewałeś i co się stało zamiast tego?', descHint: 'Co najmniej 20 znaków.',
  files: 'Zrzuty ekranu lub wideo', filesHint: '(do 4 plików, po 8 MB)', dropT: 'Stuknij, aby dodać pliki, lub upuść je tutaj', contact: 'Kontakt', contactHint: 'Widzą to tylko moderatorzy. Zostaw puste, jeśli nie potrzebujesz odpowiedzi.',
  send: 'Wyślij zgłoszenie', sending: 'Wysyłanie…', pick: 'Wybierz obszar…', okH: 'Dziękujemy!', ok: 'Twoje zgłoszenie trafiło do zespołu.', again: 'Zgłoś kolejny błąd', off: 'Zgłoszenia ze strony są teraz zamknięte. Użyj naszego Discorda.',
  eTitle: 'Wpisz krótki tytuł (min. 5 znaków).', eDesc: 'Opisz, co się stało (min. 20 znaków).', eArea: 'Wybierz obszar.', eUid: 'UID powinien zawierać tylko cyfry.',
  eFile: 'Możesz dodać maksymalnie 4 pliki po 8 MB.', tipsH: 'Wskazówki do dobrego zgłoszenia', tip1: 'Najpierw sprawdź znane problemy.', tip2: 'Opisz kroki, abyśmy mogli powtórzyć błąd.', tip3: 'Zrzuty ekranu i krótkie wideo bardzo pomagają.', tip4: 'Jeden problem na zgłoszenie.',
  similar: 'To może być już zgłoszone:', similarNote: 'Jeśli to ten sam problem, nie musisz wysyłać go ponownie.', kiLink: 'Otwórz listę znanych problemów', in: 'naprawiono w', passed: 'Potwierdzony', being_investigated: 'W trakcie badania', fixed: 'Naprawiony',
  mBug: '🐞 Zgłoś błąd', mIdea: '💡 Zaproponuj pomysł', h1Idea: 'Zaproponuj pomysł', leadIdea: 'Napisz, co uczyniłoby grę lepszą. Zespół czyta każdy pomysł.',
  ideaL: 'Twój pomysł', ideaPh: 'Co chciałbyś zmienić lub dodać i jak pomogłoby to graczom?', ideaHint: 'Co najmniej 20 znaków.', sendIdea: 'Wyślij pomysł',
  eIdea: 'Opisz swój pomysł (min. 20 znaków).' } };
const $ = id => document.getElementById(id), f = $('form'), opened = Date.now(); let cfg = {}, chosen = [], simTimer = null, lastSim = '';
let mode = /[?&#]idea\b/.test(location.search + location.hash) ? 'idea' : 'bug';
function setMode(m) {                                // 🐞 bug report or 💡 idea – same page, same follow-up conversation
  if (m === 'idea' && !cfg.send_ideas) m = 'bug';
  mode = m; const idea = m === 'idea', shut = idea ? false : cfg.enabled === false;
  $('mode').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === m)));
  $('bugF').hidden = idea || shut; $('ideaF').hidden = !idea; $('who').hidden = shut; $('tips').hidden = idea;
  $('closedP').hidden = !shut; $('go').hidden = shut;
  document.querySelector('h1').textContent = WOS.t(idea ? 'h1Idea' : 'h1'); document.querySelector('.lead').textContent = WOS.t(idea ? 'leadIdea' : 'lead');
  $('go').textContent = WOS.t(idea ? 'sendIdea' : 'send'); say('');
  history.replaceState(null, '', idea ? '?idea' : location.pathname);
}
$('mode').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.m); });
$('idea').oninput = e => { $('icnt').textContent = e.target.value.length + ' / 1800'; };
const say = (t, k) => { const m = $('msg'); m.replaceChildren(); if (t) m.append(WOS.el('div', { class: 'msg ' + k }, t)); };
function fillAreas() { const s = $('area'), cur = s.value; s.replaceChildren(new Option(WOS.t('pick'), '')); (cfg.areas || []).forEach(a => s.add(new Option(a, a))); s.value = cur; $('go').textContent = WOS.t(mode === 'idea' ? 'sendIdea' : 'send'); }
function drawFiles() { const b = $('flist'); b.replaceChildren(); chosen.forEach((x, i) => b.append(WOS.el('span', {}, x.name, WOS.el('button', { type: 'button', 'aria-label': 'Remove', onclick: () => { chosen.splice(i, 1); drawFiles(); } }, '×')))); }
$('files').onchange = e => { chosen = chosen.concat(Array.from(e.target.files)); e.target.value = ''; drawFiles(); };
const dz = $('drop'); dz.prepend(WOS.icon('download'));
dz.onclick = () => $('files').click(); dz.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('files').click(); } };
['dragenter', 'dragover'].forEach(n => dz.addEventListener(n, e => { e.preventDefault(); dz.classList.add('over'); }));
['dragleave', 'drop'].forEach(n => dz.addEventListener(n, e => { e.preventDefault(); dz.classList.remove('over'); }));
dz.addEventListener('drop', e => { chosen = chosen.concat(Array.from(e.dataTransfer.files || [])); drawFiles(); });
$('desc').oninput = e => { $('cnt').textContent = e.target.value.length + ' / 1800'; };
async function similar() {
  const q = $('title').value.trim() + ' ' + $('desc').value.trim().slice(0, 100);
  if ($('title').value.trim().length < 6 || q === lastSim) return; lastSim = q;
  try {
    const { items } = await WOS.api('/public/similar?q=' + encodeURIComponent(q) + '&area=' + encodeURIComponent($('area').value));
    const box = $('sim'); box.replaceChildren(); if (!items.length) return;
    box.append(WOS.el('div', { class: 'sim' }, WOS.el('b', {}, '🔎 ' + WOS.t('similar')),
      WOS.el('ul', {}, ...items.map(i => WOS.el('li', {}, i.title + ' – ' + WOS.t(i.status) + (i.fixed_in ? ' (' + WOS.t('in') + ' ' + i.fixed_in + ')' : '')))), WOS.el('div', { style: 'margin-top:6px' }, WOS.t('similarNote'))));
  } catch (e) { /* hints are optional */ }
}
$('title').oninput = () => { clearTimeout(simTimer); if ($('title').value.trim().length < 6) $('sim').replaceChildren(); simTimer = setTimeout(similar, 600); };
$('area').onchange = () => { lastSim = ''; similar(); };
WOS.init(S).then(c => {
  cfg = c; fillAreas(); WOS.onLang.push(fillAreas);
  if (c.version && !$('ver').value) $('ver').value = c.version;
  if (c.known_issues === false) $('ki').hidden = true;
  $('mode').hidden = !c.send_ideas;
  const dc = (window.WOS_CONFIG || {}).DISCORD_URL;
  if (dc) $('closedP').after(WOS.el('div', { class: 'btns', id: 'closedD' }, WOS.el('a', { class: 'btn pri', href: dc, rel: 'noopener' }, 'Discord')));
  setMode(mode); WOS.onLang.push(() => setMode(mode));
  const sync = () => { const d = $('closedD'); if (d) d.hidden = $('closedP').hidden; }; sync(); $('mode').addEventListener('click', sync);
  if (!c.areas) { say(WOS.t('netErr'), 'err'); }
  if (c.enabled !== false || c.send_ideas) WOS.api('/public/my').then(me => {          // who is sending: lets staff open a ticket / DM them
    const box = WOS.el('p', { class: 'me muted' });
    const paint = () => box.replaceChildren(...(me.logged_in ? [WOS.t('meAs').replace('{name}', me.name || '')]
      : [WOS.el('a', { href: ((window.WOS_CONFIG || {}).API_BASE || '').replace(/\/+$/, '') + '/api/auth/report' }, WOS.t('meLogin')), ' ', WOS.t('meWhy')]));
    if (!me.logged_in && !me.login) return;
    paint(); WOS.onLang.push(paint); f.prepend(box);
  }).catch(() => {});
});
f.addEventListener('submit', async e => {
  e.preventDefault(); const v = n => f.elements[n].value.trim();
  if (mode === 'idea') return sendIdea(v);
  if (!v('area')) return say(WOS.t('eArea'), 'err');
  if (v('title').length < 5) return say(WOS.t('eTitle'), 'err');
  if (v('description').length < 20) return say(WOS.t('eDesc'), 'err');
  if (v('uid') && !/^\d{4,20}$/.test(v('uid').replace(/\s/g, ''))) return say(WOS.t('eUid'), 'err');
  if (chosen.length > 4 || chosen.some(x => x.size > 8 * 1048576)) return say(WOS.t('eFile'), 'err');
  const fd = new FormData(); ['chief_name', 'uid', 'area', 'version', 'title', 'description', 'contact', 'website'].forEach(n => fd.append(n, v(n)));
  fd.append('t', String(Date.now() - opened)); chosen.forEach(x => fd.append('file', x, x.name));
  const go = $('go'); go.disabled = true; go.textContent = WOS.t('sending'); say('');
  try {
    const j = await WOS.api('/public/report', { method: 'POST', body: fd });
    f.hidden = true; $('done').hidden = false; $('okT').textContent = WOS.t('ok') + (j.id ? ' #' + j.id : ''); window.scrollTo({ top: 0, behavior: 'smooth' });
    const fl = $('follow'); fl.replaceChildren();
    if (j.id && j.token) {                                  // the player's private page: status + the team's questions
      WOS.rememberReport(j.id, j.token, v('title'));
      const url = new URL('follow.html?b=' + j.id + '&t=' + encodeURIComponent(j.token), location.href).href;
      location.href = url; return;                       // straight into the conversation (with the standard welcome message)
    }
  } catch (err) { say(err.message, 'err'); }
  go.disabled = false; go.textContent = WOS.t('send');
});
async function sendIdea(v) {
  if (v('idea').length < 20) return say(WOS.t('eIdea'), 'err');
  if (v('uid') && !/^\d{4,20}$/.test(v('uid').replace(/\s/g, ''))) return say(WOS.t('eUid'), 'err');
  const go = $('go'); go.disabled = true; go.textContent = WOS.t('sending'); say('');
  try {
    const j = await WOS.api('/public/idea', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: v('idea'), chief_name: v('chief_name'), uid: v('uid'), website: v('website'), t: Date.now() - opened }) });
    if (j.id && j.token) {                                  // straight into the idea's conversation
      WOS.rememberReport(j.id, j.token, v('idea').slice(0, 80), 'idea');
      location.href = new URL('follow.html?i=' + j.id + '&t=' + encodeURIComponent(j.token), location.href).href; return;
    }
    f.hidden = true; $('done').hidden = false; $('okT').textContent = WOS.t('ok') + (j.id ? ' #' + j.id : ''); $('again').hidden = true;
  } catch (err) { say(err.message, 'err'); }
  go.disabled = false; go.textContent = WOS.t('sendIdea');
}
$('again').onclick = () => { f.reset(); chosen = []; drawFiles(); $('sim').replaceChildren(); lastSim = ''; if (cfg.version) $('ver').value = cfg.version; f.hidden = false; $('done').hidden = true; };
</script></body></html>
