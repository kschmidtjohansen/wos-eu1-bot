<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My reports – WOS EU1</title><meta name="theme-color" content="#060c17"><meta name="robots" content="noindex">
<meta name="description" content="See what happened to the bug reports and ideas you sent to the WOS EU1 team.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="WOS EU1">
<link rel="preload" href="fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<style>
.my{max-width:820px}
.rep{padding:16px 18px;margin-bottom:10px}
.rep-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rep-h .n{font-family:var(--display);color:var(--muted);font-size:13.5px}
.rep-h b{flex:1 1 240px;font-size:17px;overflow-wrap:anywhere}
.st.wait{color:var(--muted);background:var(--glass-2);border-color:var(--line-2)}
.st.no{color:var(--bad);background:rgba(255,107,129,.1);border-color:rgba(255,107,129,.25)}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.why{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:rgba(4,10,20,.4);border:1px solid var(--line);font-size:15px;overflow-wrap:anywhere}
.why small{display:block;color:var(--muted);font-weight:650}
.steps{display:flex;flex-wrap:wrap;gap:6px 0;list-style:none;margin:12px 0 0;padding:0;font-size:13.5px;color:var(--muted)}
.steps li{display:flex;align-items:center}
.steps li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ice);margin-inline-end:7px;flex:none}
.steps li:not(:last-child)::after{content:"";width:18px;height:2px;background:var(--line-2);margin-inline:9px}
.steps li.end-ok::before{background:var(--ok)} .steps li.end-no::before{background:var(--bad)}
.steps time{margin-inline-start:5px;opacity:.75}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;font-size:14px;color:var(--muted)}
.foot button{border:0;background:none;color:var(--ice);font:inherit;cursor:pointer;padding:0}
</style></head><body>
<main id="main" class="my">
  <h1 data-i="h1"></h1><p class="lead" data-i="lead"></p>
  <div class="chips" id="chips"></div>
  <div id="box" aria-live="polite"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>
<script src="config.js"></script><script src="app.js"></script>
<script>
const S = {
 en: { h1: 'My reports', lead: 'What happened to the bug reports and ideas you sent – and why.',
  loginH: 'Log in to see your reports', loginT: 'Use the Discord account you sent them from. We only see your name – nothing is posted for you.',
  login: 'Log in with Discord', noLogin: 'Logging in isn’t set up on this server yet. Use /mybugs on Discord instead.',
  hi: 'Logged in as', out: 'Log out', bugs: 'Bug reports', ideas: 'Ideas', open: 'Still open',
  none: 'You haven’t sent any bug reports from this Discord account yet.', noneIdeas: 'You haven’t sent any ideas yet.', noneOpen: 'Nothing is open. Everything you sent has an answer.',
  send: 'Report a bug', err: 'Could not load your reports. Try again in a moment.',
  s_new: 'Waiting for a moderator', s_investigating: 'A moderator has a question for you', s_passed: 'Confirmed – with the admins', s_being_investigated: 'Being fixed',
  s_fixed: 'Fixed', s_rejected: 'Closed', s_admin_rejected: 'Closed', s_dup: 'Already reported',
  i_new: 'Waiting for a decision', i_accepted: 'Accepted', i_rejected: 'Not planned',
  t_sent: 'Sent', t_investigating: 'Question asked', t_passed: 'Confirmed', t_being_investigated: 'Fix started', t_fixed: 'Fixed', t_rejected: 'Closed', t_reopened: 'Reopened',
  why: 'From the team', dupOf: 'Same as bug #{id}, which is', dupFixed: 'fixed', dupOpen: 'still being worked on', fixedIn: 'Fixed in version', aff: 'players have this',
  devs: 'The developers are working on it.', ticket: 'Look for your ticket on Discord and answer there.', area: 'Area' },
 pl: { h1: 'Moje zgłoszenia', lead: 'Co stało się ze zgłoszeniami błędów i pomysłami, które wysłałeś – i dlaczego.',
  loginH: 'Zaloguj się, aby zobaczyć swoje zgłoszenia', loginT: 'Użyj konta Discord, z którego je wysłałeś. Widzimy tylko Twoją nazwę – nic nie jest publikowane w Twoim imieniu.',
  login: 'Zaloguj się przez Discord', noLogin: 'Logowanie nie jest jeszcze skonfigurowane na tym serwerze. Użyj /mybugs na Discordzie.',
  hi: 'Zalogowano jako', out: 'Wyloguj', bugs: 'Zgłoszenia błędów', ideas: 'Pomysły', open: 'Wciąż otwarte',
  none: 'Z tego konta Discord nie wysłano jeszcze żadnych zgłoszeń.', noneIdeas: 'Nie wysłałeś jeszcze żadnych pomysłów.', noneOpen: 'Nic nie jest otwarte. Wszystko, co wysłałeś, ma odpowiedź.',
  send: 'Zgłoś błąd', err: 'Nie udało się wczytać zgłoszeń. Spróbuj za chwilę.',
  s_new: 'Czeka na moderatora', s_investigating: 'Moderator ma do Ciebie pytanie', s_passed: 'Potwierdzony – u administratorów', s_being_investigated: 'W naprawie',
  s_fixed: 'Naprawiony', s_rejected: 'Zamknięty', s_admin_rejected: 'Zamknięty', s_dup: 'Już zgłoszony',
  i_new: 'Czeka na decyzję', i_accepted: 'Przyjęty', i_rejected: 'Nie w planach',
  t_sent: 'Wysłano', t_investigating: 'Zadano pytanie', t_passed: 'Potwierdzono', t_being_investigated: 'Rozpoczęto naprawę', t_fixed: 'Naprawiono', t_rejected: 'Zamknięto', t_reopened: 'Otwarto ponownie',
  why: 'Od zespołu', dupOf: 'To samo co błąd #{id}, który jest', dupFixed: 'naprawiony', dupOpen: 'wciąż w trakcie', fixedIn: 'Naprawiono w wersji', aff: 'graczy ma ten problem',
  devs: 'Programiści nad tym pracują.', ticket: 'Znajdź swój ticket na Discordzie i odpowiedz tam.', area: 'Obszar' } };
let me = null, error = null, tab = 'open';
const $ = id => document.getElementById(id), el = (...a) => WOS.el(...a), t = k => WOS.t(k);
const base = ((window.WOS_CONFIG || {}).API_BASE || '').replace(/\/+$/, '');
const isOpen = b => !b.duplicate_of && ['new', 'investigating', 'passed', 'being_investigated'].includes(b.status);
function bugCard(b) {
  const dup = !!b.duplicate_of, cls = dup ? 'wait' : b.status === 'fixed' ? 'fixed' : ['rejected', 'admin_rejected'].includes(b.status) ? 'no' : b.status === 'new' ? 'wait' : b.status === 'being_investigated' ? 'being_investigated' : 'passed';
  const kids = [el('div', { class: 'rep-h' }, el('span', { class: 'n' }, '#' + b.id), el('b', {}, b.title), el('span', { class: 'st ' + cls }, t(dup ? 's_dup' : 's_' + b.status)))];
  const sub = [b.area ? t('area') + ': ' + b.area : '', b.affected > 1 && !dup ? b.affected + ' ' + t('aff') : '', b.fixed_in && b.status === 'fixed' ? t('fixedIn') + ' ' + b.fixed_in : ''].filter(Boolean);
  if (sub.length) kids.push(el('p', { class: 'sub' }, sub.join(' · ')));
  if (dup) kids.push(el('p', { class: 'sub' }, t('dupOf').replace('{id}', b.duplicate_of) + ' ' + t(b.original_status === 'fixed' ? 'dupFixed' : 'dupOpen') + (b.original_fixed_in ? ' (' + b.original_fixed_in + ')' : '') + '.'));
  else if (b.status === 'investigating') kids.push(el('p', { class: 'sub' }, t('ticket')));
  else if (b.dev === 'working' && b.status !== 'fixed') kids.push(el('p', { class: 'sub' }, t('devs')));
  if (b.reason) kids.push(el('div', { class: 'why' }, el('small', {}, t('why')), b.reason));
  if (!dup && b.steps.length > 1) kids.push(el('ol', { class: 'steps' }, b.steps.map((s, i) => el('li', { class: i === b.steps.length - 1 ? (s.step === 'fixed' ? 'end-ok' : s.step === 'rejected' ? 'end-no' : '') : '' }, t('t_' + s.step), el('time', {}, WOS.date(s.ts))))));
  else kids.push(el('p', { class: 'sub' }, t('t_sent') + ' ' + WOS.date(b.created)));
  return el('article', { class: 'card rep' }, kids);
}
function ideaCard(x) {
  const cls = x.status === 'accepted' ? 'fixed' : x.status === 'rejected' ? 'no' : 'wait';
  return el('article', { class: 'card rep' }, el('div', { class: 'rep-h' }, el('span', { class: 'n' }, '#' + x.id), el('b', { style: 'font-weight:500;font-size:16px' }, x.text), el('span', { class: 'st ' + cls }, t('i_' + x.status))),
    ...(x.reason ? [el('div', { class: 'why' }, el('small', {}, t('why')), x.reason)] : []), el('p', { class: 'sub' }, t('t_sent') + ' ' + WOS.date(x.created)));
}
function draw() {
  const box = $('box'), ch = $('chips'); box.replaceChildren(); ch.replaceChildren();
  if (error) return box.append(el('div', { class: 'card empty' }, t('err')));
  if (!me) return;
  if (!me.logged_in) {
    if (!me.login) return box.append(el('div', { class: 'card empty' }, t('noLogin')));
    return box.append(el('div', { class: 'card' }, el('h3', {}, t('loginH')), el('p', { class: 'muted', style: 'margin:4px 0 16px' }, t('loginT')),
      el('a', { class: 'btn pri', href: base + '/api/auth/player' }, t('login'))));
  }
  const open = me.bugs.filter(isOpen);
  [['open', t('open'), open.length], ['bugs', t('bugs'), me.bugs.length], ['ideas', t('ideas'), me.suggestions.length]].forEach(([k, l, n]) =>
    ch.append(el('button', { type: 'button', 'aria-pressed': String(tab === k), onclick: () => { tab = k; draw(); } }, l + ' ' + n)));
  const list = tab === 'ideas' ? me.suggestions : tab === 'open' ? open : me.bugs;
  if (!list.length) box.append(el('div', { class: 'card empty' }, el('p', { style: 'margin:0 0 14px' }, t(tab === 'ideas' ? 'noneIdeas' : me.bugs.length ? 'noneOpen' : 'none')),
    ...(tab === 'ideas' ? [] : [el('a', { class: 'btn', href: 'report.html' }, t('send'))])));
  list.forEach(x => box.append(tab === 'ideas' ? ideaCard(x) : bugCard(x)));
  const out = el('button', { type: 'button' }, t('out'));
  out.onclick = async () => { try { await WOS.api('/public/appeal/logout', { method: 'POST' }); } catch (e) { /* ignore */ } me = { logged_in: false, login: true }; draw(); };
  box.append(el('div', { class: 'foot' }, el('span', {}, t('hi') + ' ', el('b', {}, me.name)), out));
}
WOS.init(S).then(async () => {
  try { me = await WOS.api('/public/my'); } catch (e) { error = true; }
  if (me && me.logged_in && !me.bugs.some(isOpen)) tab = me.bugs.length ? 'bugs' : me.suggestions.length ? 'ideas' : 'open';
  WOS.onLang.push(draw); draw();
});
</script></body></html>
