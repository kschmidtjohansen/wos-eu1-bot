<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>What's fixed – WOS EU1</title><meta name="theme-color" content="#060c17"><meta name="description" content="Every WOS EU1 update with the bugs it fixed, and the player ideas we added.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="WOS EU1">
<link rel="preload" href="fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css"></head><body>
<main>
  <h1 data-i="h1"></h1><p class="lead" data-i="lead"></p>
  <div class="chips" id="chips"></div>
  <div id="list" aria-live="polite"><div class="skel"></div><div class="skel"></div></div>
  <div class="btns" style="justify-content:center;margin-top:22px"><button class="btn" id="more" type="button" data-i="more" hidden></button></div>
</main>
<script src="config.js"></script><script src="app.js"></script>
<script>
const S = {
 en: { h1: "What's fixed", lead: 'Every update and the bugs it fixed – and the ideas from players that made it into the game. Thank you for reporting!',
  fixesT: 'Bug fixes', ideasT: 'Player ideas', none: 'Nothing has been published yet.', noIdeas: 'No player ideas have been added yet.', off: 'The changelog is not public right now.',
  err: 'Could not load the changelog.', more: 'Show older updates', fixes: 'fixes', all: 'Other', idea: 'The idea', changed: 'What we changed' },
 pl: { h1: 'Co naprawiono', lead: 'Każda aktualizacja i naprawione w niej błędy – oraz pomysły graczy, które trafiły do gry. Dziękujemy za zgłoszenia!',
  fixesT: 'Poprawki błędów', ideasT: 'Pomysły graczy', none: 'Nic jeszcze nie opublikowano.', noIdeas: 'Nie dodano jeszcze żadnych pomysłów graczy.', off: 'Dziennik zmian jest teraz niepubliczny.',
  err: 'Nie udało się wczytać dziennika zmian.', more: 'Pokaż starsze aktualizacje', fixes: 'poprawek', all: 'Inne', idea: 'Pomysł', changed: 'Co zmieniliśmy' } };
let items = null, ideas = [], error = null, shown = 5, view = 'fixes';
const $ = id => document.getElementById(id);
function draw() {
  const ch = $('chips'); ch.replaceChildren();
  [['fixes', 'fixesT'], ['ideas', 'ideasT']].forEach(([k, l]) => ch.append(WOS.el('button', { type: 'button', 'aria-pressed': String(view === k), onclick: () => { view = k; draw(); } },
    WOS.t(l) + (k === 'ideas' ? ' ' + ideas.length : items ? ' ' + items.reduce((n, c) => n + c.items.length, 0) : ''))));
  const box = $('list'); box.replaceChildren(); $('more').hidden = true;
  if (view === 'ideas') {
    if (!ideas.length) return box.append(WOS.el('div', { class: 'card empty' }, WOS.t('noIdeas')));
    return box.append(WOS.el('div', { class: 'grid g2' }, ideas.map(x => WOS.el('div', { class: 'card idea' }, WOS.el('q', {}, x.idea),
      WOS.el('div', { class: 'chg' }, WOS.icon('spark'), WOS.el('span', {}, x.changes)), WOS.el('time', {}, WOS.date(x.ts))))));
  }
  if (error) return box.append(WOS.el('div', { class: 'card empty' }, WOS.t(error)));
  if (!items) return;
  if (!items.length) return box.append(WOS.el('div', { class: 'card empty' }, WOS.t('none')));
  const tl = WOS.el('div', { class: 'tl' });
  items.slice(0, shown).forEach(c => {
    const groups = {}; c.items.forEach(i => (groups[i.area || WOS.t('all')] = groups[i.area || WOS.t('all')] || []).push(i.title));
    tl.append(WOS.el('article', { class: 'card rel' },
      WOS.el('div', { class: 'rel-h' }, WOS.el('h2', {}, c.title), WOS.el('span', { class: 'muted' }, WOS.date(c.ts) + ' · ' + c.items.length + ' ' + WOS.t('fixes'))),
      ...Object.entries(groups).map(([g, list]) => WOS.el('div', { class: 'grp' }, WOS.el('h3', {}, g), WOS.el('ul', {}, ...list.map(t => WOS.el('li', {}, t)))))));
  });
  box.append(tl); $('more').hidden = items.length <= shown;
}
WOS.init(S).then(async cfg => {
  try { items = (await WOS.api('/public/changelog')).items; } catch (e) { error = e.status === 404 ? 'off' : 'err'; }
  if (cfg.ideas) { try { ideas = (await WOS.api('/public/ideas')).items; } catch (e) { ideas = []; } }
  if (location.hash === '#ideas') view = 'ideas';
  WOS.onLang.push(draw); draw(); $('more').onclick = () => { shown += 5; draw(); };
});
</script></body></html>
