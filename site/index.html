<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WOS EU1 – codes, known issues and bug reports</title><meta name="theme-color" content="#060c17"><meta name="description" content="Gift codes, known issues and bug reports for the WOS EU1 server.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="WOS EU1">
<link rel="preload" href="fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css"></head><body>
<main>
  <section class="hero">
    <div>
      <span class="ver" id="ver" hidden><i></i><span id="ver-t"></span></span>
      <h1><span class="srv" id="srv"></span><span data-i="h1"></span></h1>
      <p class="lead" data-i="lead"></p>
      <div class="btns"><a class="btn pri" href="report.html" data-i="cta1"></a><a class="btn" href="known-issues.html" data-k="known" data-i="cta2"></a></div>
    </div>
    <div class="hero-codes" id="hc" hidden>
      <h2><span data-i="todayH"></span><a href="codes.html" data-i="allCodes"></a></h2>
      <div class="tickets" id="hc-l"></div>
    </div>
  </section>

  <section class="sec acts" aria-label="Shortcuts">
    <a class="card act hot" href="report.html"><span class="ic"></span><h3 data-i="aRepH"></h3><p data-i="aRep"></p></a>
    <a class="card act" href="known-issues.html" data-k="known"><span class="ic"></span><h3 data-i="aKnownH"></h3><p data-i="aKnown"></p><span class="num"><b id="n-open">–</b><small data-i="nOpen"></small></span></a>
    <a class="card act" href="changelog.html" data-k="fixed"><span class="ic"></span><h3 data-i="aFixH"></h3><p data-i="aFix"></p><span class="num"><b id="n-fixed">–</b><small data-i="nFixed"></small></span></a>
  </section>

  <section class="sec grid g2">
    <div id="latest"><div class="sec-h"><h2 data-i="latestH"></h2><a href="changelog.html" data-i="all"></a></div><div class="list" id="latest-l"><div class="skel"></div><div class="skel"></div></div></div>
    <div id="ideas" hidden><div class="sec-h"><h2 data-i="ideasH"></h2></div><div class="list" id="ideas-l"></div></div>
  </section>

  <section class="sec card banner" id="app" data-install hidden>
    <div><span class="ic" id="app-ic"></span><div><h3 data-i="appH"></h3><span class="muted" data-i="appT"></span></div></div>
    <button class="btn pri" type="button" id="app-b" data-i="install"></button></section>
  <section class="sec card banner" id="dc" hidden>
    <div><span class="ic" id="dc-ic"></span><div><h3 data-i="dcH"></h3><span class="muted" data-i="dcT"></span></div></div>
    <a class="btn" id="dc-a" rel="noopener" data-i="dcB"></a></section>
</main>
<script src="config.js"></script><script src="app.js"></script>
<script>
const S = {
 en: { h1: 'Stay warm out there.', lead: "Today's gift codes, the bugs we already know about, and a quick way to tell us when something in the game isn't working.",
  cta1: 'Report a bug', cta2: 'Known issues', todayH: "Today's codes", allCodes: 'All codes',
  aRepH: 'Report a bug', aRep: 'Something broken? A short form, a screenshot, done. Moderators read every report.',
  aKnownH: 'Known issues', aKnown: "Bugs we already know about. Check here first – you can skip reporting these.", nOpen: 'being worked on',
  aFixH: "What's fixed", aFix: 'Every update and the bugs it fixed, with the game version.', nFixed: 'fixed so far',
  latestH: 'Fixed lately', all: 'See all', none: 'Nothing published yet.', ideasH: 'Ideas from players we added',
  appH: 'Get the app', appT: 'Add WOS EU1 to your home screen – codes and known issues one tap away.',
  dcH: 'Never miss a code', dcT: 'New codes are posted on our Discord the moment they go live.', dcB: 'Join our Discord' },
 pl: { h1: 'Trzymaj się ciepło.', lead: 'Dzisiejsze kody prezentowe, błędy, o których już wiemy, i szybki sposób, by zgłosić, że coś w grze nie działa.',
  cta1: 'Zgłoś błąd', cta2: 'Znane problemy', todayH: 'Dzisiejsze kody', allCodes: 'Wszystkie kody',
  aRepH: 'Zgłoś błąd', aRep: 'Coś nie działa? Krótki formularz, zrzut ekranu i gotowe. Moderatorzy czytają każde zgłoszenie.',
  aKnownH: 'Znane problemy', aKnown: 'Błędy, o których już wiemy. Sprawdź najpierw tutaj – tych nie musisz zgłaszać.', nOpen: 'w trakcie prac',
  aFixH: 'Co naprawiono', aFix: 'Każda aktualizacja i naprawione w niej błędy, z wersją gry.', nFixed: 'naprawionych',
  latestH: 'Ostatnio naprawione', all: 'Zobacz wszystkie', none: 'Nic jeszcze nie opublikowano.', ideasH: 'Pomysły graczy, które dodaliśmy',
  appH: 'Pobierz aplikację', appT: 'Dodaj WOS EU1 do ekranu głównego – kody i znane problemy na wyciągnięcie ręki.',
  dcH: 'Nie przegap żadnego kodu', dcT: 'Nowe kody publikujemy na Discordzie, gdy tylko się pojawią.', dcB: 'Dołącz do Discorda' } };
const $ = id => document.getElementById(id);
const C = window.WOS_CONFIG || {};
$('srv').textContent = C.SERVER_NAME || 'WOS EU1';
document.querySelectorAll('.act .ic').forEach((s, i) => s.append(WOS.icon(['report', 'known', 'fixed'][i])));
$('app-ic').append(WOS.icon('download')); $('dc-ic').append(WOS.icon('chat'));
$('app-b').onclick = () => WOS.install();
let codes = [], changes = [], known = [], ideas = [];
function draw() {
  const hl = $('hc-l'); hl.replaceChildren();
  const pick = codes.filter(c => c.new).concat(codes.filter(c => !c.new)).slice(0, 3);
  $('hc').hidden = !pick.length; pick.forEach(c => hl.append(WOS.ticket(c)));
  const box = $('latest-l'); box.replaceChildren();
  const items = changes.flatMap(c => c.items.map(i => ({ ...i, v: c.title }))).slice(0, 5);
  if (!items.length) box.append(WOS.el('div', { class: 'card empty' }, WOS.t('none')));
  items.forEach(i => box.append(WOS.el('div', { class: 'item' }, WOS.el('div', {}, WOS.el('b', {}, i.title), WOS.el('span', { class: 'm' }, [i.area, i.v].filter(Boolean).join(' · '))), WOS.el('span', { class: 'st fixed' }, '✓'))));
  const il = $('ideas-l'); il.replaceChildren(); $('ideas').hidden = !ideas.length;
  ideas.slice(0, 3).forEach(x => { const chg = WOS.el('div', { class: 'chg' }, WOS.icon('spark'), WOS.el('span', {}, x.changes));
    il.append(WOS.el('div', { class: 'card idea' }, WOS.el('q', {}, x.idea), chg, WOS.el('time', {}, WOS.date(x.ts)))); });
}
WOS.init(S).then(async cfg => {
  if (cfg.version) { $('ver-t').textContent = cfg.version; $('ver').hidden = false; }
  if (C.DISCORD_URL) { $('dc-a').href = C.DISCORD_URL; $('dc').hidden = false; }
  const get = async (on, path) => { if (!on) return []; try { return (await WOS.api(path)).items; } catch (e) { return []; } };
  [codes, known, changes, ideas] = await Promise.all([get(cfg.giftcodes, '/public/giftcodes'), get(cfg.known_issues, '/public/known-issues'),
    get(cfg.changelog, '/public/changelog'), get(cfg.ideas, '/public/ideas')]);
  if (!cfg.changelog) $('latest').hidden = true;
  $('n-open').textContent = known.filter(i => i.status !== 'fixed').length;
  $('n-fixed').textContent = changes.reduce((n, c) => n + c.items.length, 0) || known.filter(i => i.status === 'fixed').length;
  WOS.tick($('n-open')); WOS.tick($('n-fixed'));
  WOS.onLang.push(draw); draw(); setInterval(draw, 60000);
});
</script></body></html>
