<!doctype html><html><head><meta charset="utf-8"><style>

<script>
const INK = '#0b1630', ORANGE = '#ff8a3d', GOLD = '#ffc15e', ICE = '#7de3f4', NAVY = '#1b2f57', NAVY2 = '#2a4680';
const sw = 6;
const st = `stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;

function eyes(kind) {
  const L = 126, R = 194, Y = 158;
  const dot = (x, s = 1) => `<ellipse cx="${x}" cy="${Y}" rx="${9 * s}" ry="${12 * s}" fill="${INK}"/><circle cx="${x + 3 * s}" cy="${Y - 5 * s}" r="${3.4 * s}" fill="#fff"/>`;

  switch (kind) {
    case 'happy': return `<path d="M${L - 11},${Y + 4} Q${L},${Y - 12} ${L + 11},${Y + 4}" fill="none" ${st}/><path d="M${R - 11},${Y + 4} Q${R},${Y - 12} ${R + 11},${Y + 4}" fill="none" ${st}/>`;

    case 'wide': return dot(L, 1.25) + dot(R, 1.25);
    case 'worried': return dot(L) + dot(R) + `<path d="M${L - 13},${Y - 22} L${L + 9},${Y - 28}" ${st.replace(sw, 4.5)}/><path d="M${R + 13},${Y - 22} L${R - 9},${Y - 28}" ${st.replace(sw, 4.5)}/>`;

    default: return dot(L) + dot(R);

}
function mouth(kind) {
  const X = 160, Y = 190;
  switch (kind) {
    case 'open': return `<path d="M${X - 16},${Y - 4} Q${X},${Y - 6} ${X + 16},${Y - 4} Q${X + 14},${Y + 20} ${X},${Y + 20} Q${X - 14},${Y + 20} ${X - 16},${Y - 4}Z" fill="${INK}"/><path d="M${X - 8},${Y + 13} Q${X},${Y + 6} ${X + 8},${Y + 13} Q${X},${Y + 19} ${X - 8},${Y + 13}Z" fill="#ff7a8c"/>`;

    case 'flat': return `<path d="M${X - 12},${Y + 3} L${X + 12},${Y + 3}" ${st.replace(sw, 4.5)}/>`;

    default: return `<path d="M${X - 13},${Y} Q${X},${Y + 13} ${X + 13},${Y}" fill="none" ${st.replace(sw, 5)}/>`;

function mitt(x, y, r = 0) { return `<g transform="translate(${x} ${y}) rotate(${r})"><ellipse cx="0" cy="0" rx="19" ry="17" fill="${ORANGE}" ${st}/><ellipse cx="-12" cy="-8" rx="7" ry="8" fill="${ORANGE}" ${st.replace(sw, 5)}/><path d="M-14,10 Q0,16 14,10" fill="none" stroke="${GOLD}" stroke-width="4" stroke-linecap="round"/></g>`; }

  snow: [[40, 70], [282, 60], [34, 170], [288, 180], [70, 22], [250, 20]].map(([x, y], i) => `<path transform="translate(${x} ${y}) scale(${i % 2 ? .8 : 1})" d="M0,-14 V14 M-12,-7 L12,7 M12,-7 L-12,7" stroke="${ICE}" stroke-width="5" stroke-linecap="round"/>`).join(''),

function sticker(o) {
  const cap = o.cap, fs = cap.length > 9 ? 25 : cap.length > 6 ? 31 : 37;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">

}
